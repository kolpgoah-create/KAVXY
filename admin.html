const PAGES={"admin.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - Master Dashboard</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <!-- Chart.js CDN -->\n  <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    /* Forced Desktop View Styles */\n    body.forced-desktop {\n      min-width: 1200px !important;\n      overflow-x: auto !important;\n    }\n    body.forced-desktop #desktopSidebar {\n      display: flex !important;\n    }\n    body.forced-desktop #mobileBottomBar {\n      display: none !important;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- ==================== TOAST ALERT ==================== -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-circle-check\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION (DESKTOP MODE) ==================== -->\n  <aside id=\"desktopSidebar\" class=\"w-64 bg-white dark:bg-[#080d19] border-r border-slate-200 dark:border-white/5 flex-col justify-between shrink-0 hidden lg:flex\">\n    <div>\n      <div class=\"px-6 py-5 flex items-center gap-3 border-b border-slate-200 dark:border-white/5\">\n        <div class=\"w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 text-white flex items-center justify-center text-lg shadow-lg shadow-blue-500/20 font-black\">\n          <i class=\"fa-solid fa-gamepad\"></i>\n        </div>\n        <div>\n          <h1 class=\"text-base font-extrabold text-slate-900 dark:text-white tracking-wide\" id=\"sidebarBrandName\">GameAdmin</h1>\n          <p class=\"text-[10px] text-blue-500 font-mono\">Control Panel Hub</p>\n        </div>\n      </div>\n\n      <!-- Navigation Links: Image ကို Premium Emoji အပေါ်တွင် ထားရှိထားပါသည် -->\n      <nav class=\"p-4 space-y-1 text-xs font-semibold\">\n        <a href=\"admin.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition\">\n          <i class=\"fa-solid fa-house text-sm w-4 text-center\"></i>\n          <span>Home Dashboard</span>\n        </a>\n        \n        <!-- ၁။ AImage (Banners) - Premium Emoji အပေါ်တွင် ရောက်ရှိသွားပါပြီ -->\n        <a href=\"Aimage.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-images text-sm w-4 text-center text-sky-400\"></i>\n          <span>Banners (AImage)</span>\n        </a>\n\n        <!-- ၂။ APremiumemoji (11 Tiers) -->\n        <a href=\"APremiumemoji.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-amber-500 hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-crown text-sm w-4 text-center\"></i>\n          <span>Premium Emoji (11 Tiers)</span>\n        </a>\n\n        <a href=\"APayment.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & Slips</span>\n        </a>\n        <a href=\"AEvent.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-wand-magic-sparkles text-sm w-4 text-center text-amber-400\"></i>\n          <span>Events & Seasons</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders Management</span>\n        </a>\n        <a href=\"Asetting.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gear text-sm w-4 text-center\"></i>\n          <span>Settings (Asetting)</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"index.html\" target=\"_blank\" class=\"w-full py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-up-right-from-square text-xs text-blue-500\"></i>\n        <span>Live Index ကြည့်မည်</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN DASHBOARD WORKSPACE ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll pb-20 lg:pb-6\">\n    \n    <!-- Top Header Bar -->\n    <header class=\"h-16 border-b border-slate-200 dark:border-white/5 bg-white/90 dark:bg-[#0a0f1d]/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30\">\n      <div class=\"flex items-center gap-3\">\n        <div>\n          <h2 class=\"text-sm font-extrabold text-slate-900 dark:text-white leading-tight\">Master Control Dashboard</h2>\n          <span class=\"text-[10px] text-emerald-400 font-mono flex items-center gap-1\">\n            <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse\"></span> Cloud Sync Status\n          </span>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-2 sm:gap-3\">\n        <!-- Switcher: ဖုန်းဗားရှင်း / PC ဗားရှင်း -->\n        <button onclick=\"toggleDeviceLayout()\" id=\"deviceToggleBtn\" class=\"px-2.5 py-1.5 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-500 font-bold text-xs flex items-center gap-1.5 active:scale-95 transition\" title=\"ဗားရှင်းပြောင်းမည်\">\n          <i id=\"deviceToggleIcon\" class=\"fa-solid fa-desktop\"></i>\n          <span id=\"deviceToggleText\">PC ဗားရှင်း</span>\n        </button>\n\n        <!-- Light / Dark Toggle -->\n        <button onclick=\"toggleTheme()\" class=\"w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center active:scale-95 transition\">\n          <i id=\"themeToggleIcon\" class=\"fa-solid fa-moon text-blue-500\"></i>\n        </button>\n\n        <a href=\"APayment.html\" class=\"relative w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-600 dark:text-slate-300\">\n          <i class=\"fa-solid fa-receipt text-xs\"></i>\n          <span class=\"absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-black flex items-center justify-center\" id=\"notifBadge\">0</span>\n        </a>\n      </div>\n    </header>\n\n    <!-- Main Content -->\n    <main class=\"p-4 sm:p-6 space-y-6\">\n\n      <!-- ==================== QUICK PORTAL CARDS (AIMAGE အပေါ်တွင် ထားရှိထားသည်) ==================== -->\n      <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n        <!-- ၁။ AImage (Banners) Box -->\n        <a href=\"Aimage.html\" class=\"p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 hover:border-sky-500 transition flex items-center gap-3 shadow-sm group\">\n          <div class=\"w-10 h-10 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition\">\n            <i class=\"fa-solid fa-images\"></i>\n          </div>\n          <div class=\"overflow-hidden\">\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white truncate\">AImage (Banners)</h4>\n            <span class=\"text-[9px] text-slate-400 block truncate\">Gallery ပုံ ၅ ပုံ ပြင်ရန်</span>\n          </div>\n        </a>\n\n        <!-- ၂။ APremiumemoji (Emoji Tiers) Box -->\n        <a href=\"APremiumemoji.html\" class=\"p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 hover:border-purple-500 transition flex items-center gap-3 shadow-sm group\">\n          <div class=\"w-10 h-10 rounded-xl bg-purple-500/15 text-purple-500 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition\">\n            <i class=\"fa-solid fa-crown\"></i>\n          </div>\n          <div class=\"overflow-hidden\">\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white truncate\">Emoji Tiers</h4>\n            <span class=\"text-[9px] text-slate-400 block truncate\">11 ဇီးကွက် Badges</span>\n          </div>\n        </a>\n\n        <!-- ၃။ APayment Box -->\n        <a href=\"APayment.html\" class=\"p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 hover:border-blue-500 transition flex items-center gap-3 shadow-sm group\">\n          <div class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition\">\n            <i class=\"fa-solid fa-credit-card\"></i>\n          </div>\n          <div class=\"overflow-hidden\">\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white truncate\">APayment</h4>\n            <span class=\"text-[9px] text-slate-400 block truncate\">KPay, Wave, Slips</span>\n          </div>\n        </a>\n\n        <!-- ၄။ AEvent Box -->\n        <a href=\"AEvent.html\" class=\"p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 hover:border-amber-500 transition flex items-center gap-3 shadow-sm group\">\n          <div class=\"w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition\">\n            <i class=\"fa-solid fa-wand-magic-sparkles\"></i>\n          </div>\n          <div class=\"overflow-hidden\">\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white truncate\">AEvent</h4>\n            <span class=\"text-[9px] text-slate-400 block truncate\">Theme & ပွဲတော်များ</span>\n          </div>\n        </a>\n      </div>\n\n      <!-- ==================== 1. PRE-MAINTENANCE CONTROLLER (ALL USERS) ==================== -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-4 shadow-sm\">\n        <div class=\"flex items-center justify-between\">\n          <div class=\"flex items-center gap-3\">\n            <div id=\"maintStatusIcon\" class=\"w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-lg\">\n              <i class=\"fa-solid fa-screwdriver-wrench\"></i>\n            </div>\n            <div>\n              <div class=\"flex items-center gap-2\">\n                <h3 class=\"text-xs font-bold text-slate-900 dark:text-white\">Pre-Maintenance စနစ် (All Users တစ်ပြိုင်နက် ပိတ်/ဖွင့်)</h3>\n                <span id=\"maintStatusBadge\" class=\"px-2 py-0.5 rounded-full text-[9px] font-bold bg-slate-100 dark:bg-white/5 text-slate-400\">OFFLINE</span>\n              </div>\n              <p class=\"text-[11px] text-slate-400 mt-0.5\">ဖွင့်ထားပါက User အားလုံးထံ index.html အစား ပြင်ဆင်နေပါသည် ဟူ၍ ပိတ်ထားပေးမည်</p>\n            </div>\n          </div>\n\n          <label class=\"relative inline-flex items-center cursor-pointer\">\n            <input type=\"checkbox\" id=\"preMaintToggle\" class=\"sr-only peer\" onchange=\"togglePreMaint(this.checked)\">\n            <div class=\"w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-amber-500\"></div>\n          </label>\n        </div>\n\n        <div id=\"maintSettingsPanel\" class=\"hidden pt-4 border-t border-slate-100 dark:border-white/5 space-y-3\">\n          <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n            <div>\n              <label class=\"text-[11px] font-semibold text-slate-400 block mb-1\">ပြင်ဆင်ပြီးစီးမည့် ခန့်မှန်းရက်/အချိန်:</label>\n              <input type=\"text\" id=\"maintEstimatedTime\" placeholder=\"ဥပမာ - 08:30 PM (MST)\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none\">\n            </div>\n            <div>\n              <label class=\"text-[11px] font-semibold text-slate-400 block mb-1\">Admin Access (Firebase Auth လိုအပ်):</label>\n              <input type=\"text\" id=\"adminPasscode\" placeholder=\"Firebase Auth ဖြင့် Admin စစ်ဆေးရန်\" readonly class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono outline-none\">\n            </div>\n          </div>\n\n          <div class=\"text-xs\">\n            <label class=\"text-[11px] font-semibold text-slate-400 block mb-1\">User ထံ ပြသမည့် အသိပေးစာသား:</label>\n            <textarea id=\"maintNoticeText\" rows=\"2\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-amber-500\">ဆာဗာအား ခေတ္တ ပြင်ဆင်ထိန်းသိမ်းနေပါသည်။ မကြာမီ ပြန်လည်ဖွင့်လှစ်ပေးပါမည်။</textarea>\n          </div>\n\n          <button onclick=\"savePreMaintConfig()\" class=\"w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-black font-black text-xs transition active:scale-95 shadow\">\n            Maintenance စာတန်း Cloud ပေါ်သို့ သိမ်းဆည်းမည်\n          </button>\n        </div>\n      </div>\n\n      <!-- ==================== 2. VERSION UPDATE PUSHER ==================== -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"flex items-center gap-2 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <i class=\"fa-solid fa-cloud-arrow-down text-sky-400\"></i>\n          <span class=\"text-xs font-black text-slate-900 dark:text-white\">Version Update Pusher (All Users ထံသို့ ဒေါင်းလုဒ် Bar လွှင့်တင်ရန်)</span>\n        </div>\n\n        <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs\">\n          <div>\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ဗားရှင်းအသစ် နံပါတ်:</label>\n            <input type=\"text\" id=\"newVerInput\" placeholder=\"ဥပမာ- 1.0.1\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono font-bold outline-none focus:border-sky-500\">\n          </div>\n          <div class=\"sm:col-span-2\">\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">Update စာတန်း:</label>\n            <input type=\"text\" id=\"updateMsgInput\" placeholder=\"ပိုမိုကောင်းမွန်မြန်ဆန်သော စနစ်သစ်သို့ အဆင့်မြှင့်တင်ရန် ဒေါင်းလုဒ်ရယူပါ။\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-sky-500\">\n          </div>\n        </div>\n\n        <button onclick=\"pushVersionUpdate()\" class=\"w-full py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 text-white font-black text-xs transition active:scale-95 shadow\">\n          <i class=\"fa-solid fa-rocket mr-1\"></i> Version Update အား All Users ထံ ချက်ချင်းလွှင့်မည်\n        </button>\n      </div>\n\n      <!-- ==================== 3. BRAND & LOGO MANAGER ==================== -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"flex items-center gap-2 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <i class=\"fa-solid fa-image text-emerald-400\"></i>\n          <span class=\"text-xs font-black text-slate-900 dark:text-white\">Brand Name & Logo Manager (အမည်နှင့် Logo ပြောင်းရန်)</span>\n        </div>\n\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n          <div>\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ဝက်ဘ်ဆိုက်အမည် (Name):</label>\n            <input type=\"text\" id=\"brandNameInput\" placeholder=\"KAVXY\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-bold outline-none focus:border-emerald-500\">\n          </div>\n          <div>\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">Logo ဓာတ်ပုံ Link (URL):</label>\n            <input type=\"text\" id=\"brandLogoInput\" placeholder=\"https://example.com/logo.png\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-emerald-500\">\n          </div>\n        </div>\n\n        <button onclick=\"saveBrandSettings()\" class=\"w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xs transition active:scale-95 shadow\">\n          Logo နှင့် အမည် သိမ်းဆည်းမည် (User အားလုံးထံ ချက်ချင်းပြောင်းမည်)\n        </button>\n      </div>\n\n      <!-- ==================== 4. DUAL CHARTS SECTION ==================== -->\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n        <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"text-xs font-bold text-slate-900 dark:text-white\">Order Overview (နမူနာဒေတာ)</h3>\n            <span class=\"text-[10px] text-slate-400 font-mono\">Demo Data</span>\n          </div>\n          <div class=\"h-44 relative\">\n            <canvas id=\"orderOverviewChart\"></canvas>\n          </div>\n        </div>\n\n        <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"text-xs font-bold text-slate-900 dark:text-white\">Game Market Share (နမူနာဒေတာ)</h3>\n            <span class=\"text-[10px] text-slate-400 font-mono\">Sample Data</span>\n          </div>\n          <div class=\"flex items-center gap-4\">\n            <div class=\"w-32 h-32 relative shrink-0\">\n              <canvas id=\"gameTypesChart\"></canvas>\n            </div>\n            <div class=\"space-y-1.5 text-[11px] flex-1\">\n              <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-blue-500\"></span> MLBB</span><span class=\"font-bold\">56%</span></div>\n              <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-yellow-500\"></span> PUBG</span><span class=\"font-bold\">25%</span></div>\n              <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-emerald-500\"></span> Free Fire</span><span class=\"font-bold\">11%</span></div>\n              <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-purple-500\"></span> Other</span><span class=\"font-bold\">8%</span></div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== MOBILE BOTTOM BAR (ဖုန်းဗားရှင်းအတွက် အောက်ခြေမီနူး) ==================== -->\n  <nav id=\"mobileBottomBar\" class=\"fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 py-2.5 px-4 lg:hidden\">\n    <div class=\"max-w-md mx-auto flex items-center justify-around text-center\">\n      <a href=\"admin.html\" class=\"flex flex-col items-center gap-0.5 text-blue-500\"><i class=\"fa-solid fa-house text-base\"></i><span class=\"text-[10px] font-bold\">Admin</span></a>\n      <a href=\"Aimage.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-images text-base\"></i><span class=\"text-[10px] font-semibold\">Banner</span></a>\n      <a href=\"APremiumemoji.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-crown text-base\"></i><span class=\"text-[10px] font-semibold\">Emoji</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"AEvent.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-wand-magic-sparkles text-base\"></i><span class=\"text-[10px] font-semibold\">Event</span></a>\n    </div>\n  </nav>\n\n  <!-- ==================== JAVASCRIPT: LAYOUT & CLOUD ENGINE ==================== -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n\n    let toastTimeout = null;\n\n    // ------------------------------------------------------------\n    // ၁။ ဖုန်းဗားရှင်း / PC ဗားရှင်း ပြောင်းလဲမှု\n    // ------------------------------------------------------------\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n        showToast(\"ကွန်ပြူတာဗားရှင်း\", \"Desktop View အပြည့်အစုံသို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n        showToast(\"ဖုန်းဗားရှင်း\", \"Mobile View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      const target = current === 'mobile' ? 'desktop' : 'mobile';\n      applyDeviceLayout(target);\n    }\n\n    // ------------------------------------------------------------\n    // ၂။ THEME ENGINE (DARK / LIGHT)\n    // ------------------------------------------------------------\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n\n      const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      if (savedLayout === 'desktop') {\n        applyDeviceLayout('desktop');\n      }\n    }\n\n    // ------------------------------------------------------------\n    // ၃။ TOAST ALERT\n    // ------------------------------------------------------------\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    // ------------------------------------------------------------\n    // ၄။ ALL-USERS FIREBASE REALTIME CLOUD CONTROLLER\n    // ------------------------------------------------------------\n    async function fetchCloudData() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}.json`);\n        const data = await res.json();\n        if (!data) return;\n\n        // Maintenance\n        if (data.site_maintenance !== undefined) {\n          const isMaint = data.site_maintenance === true || data.site_maintenance === 'true';\n          document.getElementById('preMaintToggle').checked = isMaint;\n          updateMaintUI(isMaint);\n        }\n        if (data.site_maintenance_msg) {\n          document.getElementById('maintNoticeText').value = data.site_maintenance_msg;\n        }\n        if (data.maint_est_time) {\n          document.getElementById('maintEstimatedTime').value = data.maint_est_time;\n        }\n\n        // Version Update\n        if (data.app_version_config) {\n          if (data.app_version_config.latestVersion) {\n            document.getElementById('newVerInput').value = data.app_version_config.latestVersion;\n          }\n          if (data.app_version_config.updateMessage) {\n            document.getElementById('updateMsgInput').value = data.app_version_config.updateMessage;\n          }\n        }\n\n        // Brand & Logo\n        if (data.site_platform_config) {\n          document.getElementById('brandNameInput').value = data.site_platform_config.name || 'KAVXY';\n          document.getElementById('brandLogoInput').value = data.site_platform_config.logo || '';\n          if (data.site_platform_config.name) {\n            document.getElementById('sidebarBrandName').innerText = data.site_platform_config.name;\n          }\n        }\n\n      } catch (err) {\n        showToast('Cloud ချိတ်ဆက်မှု မအောင်မြင်ပါ', 'Firebase ဒေတာ ဖတ်၍မရပါ: ' + err.message, 'error');\n      }\n    }\n\n    function updateMaintUI(status) {\n      const panel = document.getElementById('maintSettingsPanel');\n      const badge = document.getElementById('maintStatusBadge');\n      const icon = document.getElementById('maintStatusIcon');\n\n      if (status) {\n        panel.classList.remove('hidden');\n        badge.className = 'px-2 py-0.5 rounded-full text-[9px] font-bold bg-amber-500/15 text-amber-500 border border-amber-500/30 animate-pulse';\n        badge.innerText = 'MAINTENANCE ON';\n        icon.className = 'w-10 h-10 rounded-xl bg-amber-500/20 text-amber-500 flex items-center justify-center text-lg animate-bounce';\n      } else {\n        panel.classList.add('hidden');\n        badge.className = 'px-2 py-0.5 rounded-full text-[9px] font-bold bg-slate-100 dark:bg-white/5 text-slate-400';\n        badge.innerText = 'OFFLINE';\n        icon.className = 'w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-400 flex items-center justify-center text-lg';\n      }\n    }\n\n    // HTTP 4xx/5xx is not a network exception: explicitly reject failed writes.\n    async function cloudWrite(path, value) {\n      const response = await fetch(`${FIREBASE_DB_URL}${path}.json`, {\n        method: 'PUT',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(value)\n      });\n      if (!response.ok) throw new Error(`Firebase HTTP ${response.status}`);\n      return response;\n    }\n\n    async function togglePreMaint(status) {\n      updateMaintUI(status);\n      try {\n        await cloudWrite('site_maintenance', status);\n        showToast(status ? 'Maintenance ဖွင့်ပြီးပါပြီ' : 'Maintenance ပိတ်ပြီးပါပြီ', status ? 'User များ ဝင်မရတော့ပါ' : 'User များ ပုံမှန်သုံးနိုင်ပါပြီ');\n      } catch (e) {\n        document.getElementById('preMaintToggle').checked = !status;\n         updateMaintUI(!status);\n         showToast('အမှား', 'Cloud ပေါ်သို့ မပို့နိုင်ပါ', 'error');\n      }\n    }\n\n    async function savePreMaintConfig() {\n      const msg = document.getElementById('maintNoticeText').value.trim();\n      const time = document.getElementById('maintEstimatedTime').value.trim();\n      try {\n        await cloudWrite('site_maintenance_msg', msg);\n        await cloudWrite('maint_est_time', time);\n        showToast('အောင်မြင်ပါသည်', 'Maintenance အချက်အလက်များ သိမ်းဆည်းပြီးပါပြီ');\n      } catch (e) {\n        showToast('အမှား', 'မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    async function pushVersionUpdate() {\n      const ver = document.getElementById('newVerInput').value.trim();\n      const msg = document.getElementById('updateMsgInput').value.trim();\n      if (!ver) return showToast('လိုအပ်ချက်', 'ဗားရှင်းအသစ် နံပါတ် ထည့်ပေးပါ', 'error');\n\n      try {\n        await cloudWrite('app_version_config', { latestVersion: ver, updateMessage: msg });\n        showToast('Update လွှင့်တင်ပြီးပါပြီ', `All Users ထံ Version ${ver} Alert ပေါ်သွားပါပြီ`);\n      } catch (e) {\n        showToast('အမှား', 'မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    async function saveBrandSettings() {\n      const name = document.getElementById('brandNameInput').value.trim();\n      const logo = document.getElementById('brandLogoInput').value.trim();\n\n      try {\n        await cloudWrite('site_platform_config', { name: name || 'KAVXY', logo: logo || '' });\n        showToast('အောင်မြင်ပါသည်', 'Brand အမည်နှင့် Logo အား သိမ်းဆည်းပြီးပါပြီ');\n      } catch (e) {\n        showToast('အမှား', 'မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    // ------------------------------------------------------------\n    // ၅။ CHARTS INITIALIZATION\n    // ------------------------------------------------------------\n    function initCharts() {\n      const ctxOverview = document.getElementById('orderOverviewChart').getContext('2d');\n      new Chart(ctxOverview, {\n        type: 'line',\n        data: {\n          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],\n          datasets: [{\n            data: [45, 80, 95, 150, 130, 120, 190],\n            borderColor: '#38bdf8',\n            backgroundColor: 'rgba(56, 189, 248, 0.15)',\n            fill: true,\n            tension: 0.4,\n            borderWidth: 2\n          }]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: { legend: { display: false } },\n          scales: {\n            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },\n            y: { grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }\n          }\n        }\n      });\n\n      const ctxTypes = document.getElementById('gameTypesChart').getContext('2d');\n      new Chart(ctxTypes, {\n        type: 'doughnut',\n        data: {\n          labels: ['MLBB', 'PUBG', 'Free Fire', 'Other'],\n          datasets: [{\n            data: [56, 25, 11, 8],\n            backgroundColor: ['#3b82f6', '#eab308', '#10b981', '#a855f7'],\n            borderWidth: 0\n          }]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          cutout: '72%',\n          plugins: { legend: { display: false } }\n        }\n      });\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      if (typeof Chart !== 'undefined') initCharts();\n      else showToast('Chart မရနိုင်ပါ', 'Chart.js မတင်နိုင်သေးပါ', 'error');\n      fetchCloudData();\n    });\n  <\/script>\n</body>\n</html>", "Aimage.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - Banner Manager (AImage)</title>\n\n  <!-- Tailwind CSS CDN -->\n ght Toggle -->\n        <button onclick=\"toggleTheme()\" class=\"w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center active:scale-95 transition\">\n          <i id=\"themeToggleIcon\" class=\"fa-solid fa-moon text-blue-500\"></i>\n        </button>\n\n        <button onclick=\"saveAllBannersToCloud()\" class=\"px-3 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-black text-xs flex items-center gap-1.5 active:scale-95 transition shadow-md\">\n          <i class=\"fa-solid fa-cloud-arrow-up\"></i>\n          <span class=\"hidden sm:inline\">Save Cloud</span>\n        </button>\n      </div>\n    </header>\n\n    <!-- Main Content -->\n    <main class=\"p-4 sm:p-6 space-y-6\">\n\n      <!-- BANNER INTRO CARD -->\n      <div class=\"p-5 rounded-3xl bg-gradient-to-r from-blue-600/20 via-sky-500/10 to-transparent border border-sky-500/30 flex items-center justify-between shadow-sm\">\n        <div class=\"flex items-center gap-3.5\">\n          <div class=\"w-12 h-12 rounded-2xl bg-sky-500/20 text-sky-400 flex items-center justify-center text-2xl shrink-0 border border-sky-500/30\">\n            <i class=\"fa-solid fa-images\"></i>\n          </div>\n          <div>\n            <h3 class=\"text-sm font-black text-slate-900 dark:text-white\">Index 16:9 Banner ပုံ (၅) ပုံ စီမံခန့်ခွဲမှု</h3>\n            <p class=\"text-[11px] text-slate-400 mt-0.5\">ဓာတ်ပုံများကို ဖုန်း Gallery / Photos ထဲမှ တိုက်ရိုက်ရွေးချယ်တင်သွင်းနိုင်သလို Link ဖြင့်လည်း ပြင်နိုင်ပါသည်</p>\n          </div>\n        </div>\n        <button onclick=\"resetDefaultBanners()\" class=\"text-xs text-slate-400 hover:text-rose-500 font-bold transition flex items-center gap-1\">\n          <i class=\"fa-solid fa-rotate-left\"></i> မူလအတိုင်းထားမည်\n        </button>\n      </div>\n\n      <!-- 5 BANNERS EDITOR GRID -->\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\" id=\"bannersEditorContainer\">\n        <!-- Rendered via JavaScript -->\n      </div>\n\n      <!-- SAVE BOTTOM BAR -->\n      <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm\">\n        <div class=\"text-xs text-slate-400 text-center sm:text-left\">\n          <span class=\"text-emerald-400 font-bold\"><i class=\"fa-solid fa-circle-check\"></i> Live Sync:</span> Gallery မှ ပုံရွေးပြီးပါက Save Cloud ခလုတ်ကို နှိပ်လိုက်ရုံဖြင့် `index.html` ၏ Banner တွင် User အားလုံးထံ ချက်ချင်း ပြောင်းလဲသွားပါမည်။\n        </div>\n        <button onclick=\"saveAllBannersToCloud()\" class=\"w-full sm:w-auto px-6 py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 text-white font-black text-xs shadow-lg shadow-sky-500/30 transition active:scale-95 flex items-center justify-center gap-2\">\n          <i class=\"fa-solid fa-floppy-disk\"></i>\n          <span>Banner ပုံ (၅) ပုံလုံး သိမ်းဆည်းမည် (Save All)</span>\n        </button>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== MOBILE BOTTOM BAR ==================== -->\n  <nav id=\"mobileBottomBar\" class=\"fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 py-2.5 px-4 lg:hidden\">\n    <div class=\"max-w-md mx-auto flex items-center justify-around text-center\">\n      <a href=\"admin.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-sky-400 transition\"><i class=\"fa-solid fa-house text-base\"></i><span class=\"text-[10px] font-semibold\">Home</span></a>\n      <a href=\"Aimage.html\" class=\"flex flex-col items-center gap-0.5 text-sky-400\"><i class=\"fa-solid fa-images text-base\"></i><span class=\"text-[10px] font-bold\">Banner</span></a>\n      <a href=\"APremiumemoji.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-sky-400 transition\"><i class=\"fa-solid fa-crown text-base\"></i><span class=\"text-[10px] font-semibold\">Emoji</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-sky-400 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"AEvent.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-sky-400 transition\"><i class=\"fa-solid fa-wand-magic-sparkles text-base\"></i><span class=\"text-[10px] font-semibold\">Event</span></a>\n    </div>\n  </nav>\n\n  <!-- ==================== JAVASCRIPT LOGIC & FIREBASE SYNC ==================== -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n    const LOCAL_BANNERS_KEY = 'admin_carousel_banners_db';\n\n    let toastTimeout = null;\n\n    // Default 5 Banners Data\n    const DEFAULT_BANNERS = [\n      {\n        id: 0,\n        title: \"Mobile Legends: Bang Bang\",\n        tag: \"Moonton\",\n        image: \"https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop\"\n      },\n      {\n        id: 1,\n        title: \"PUBG Mobile (Battle Royale)\",\n        tag: \"Tencent\",\n        image: \"https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=800&auto=format&fit=crop\"\n      },\n      {\n        id: 2,\n        title: \"Honor of Kings (HOK)\",\n        tag: \"Level Infinite\",\n        image: \"https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=800&auto=format&fit=crop\"\n      },\n      {\n        id: 3,\n        title: \"Blood Strike (Fast FPS)\",\n        tag: \"NetEase\",\n        image: \"https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=800&auto=format&fit=crop\"\n      },\n      {\n        id: 4,\n        title: \"Free Fire: Booyah\",\n        tag: \"Garena\",\n        image: \"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop\"\n      }\n    ];\n\n    let currentBanners = [...DEFAULT_BANNERS];\n\n    // ------------------------------------------------------------\n    // ၁။ ဖုန်းဗားရှင်း / PC ဗားရှင်း ပြောင်းလဲမှု\n    // ------------------------------------------------------------\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n        showToast(\"ကွန်ပြူတာဗားရှင်း\", \"Desktop View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n        showToast(\"ဖုန်းဗားရှင်း\", \"Mobile View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      const target = current === 'mobile' ? 'desktop' : 'mobile';\n      applyDeviceLayout(target);\n    }\n\n    // ------------------------------------------------------------\n    // ၂။ THEME ENGINE (DARK / LIGHT)\n    // ------------------------------------------------------------\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n\n      const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      if (savedLayout === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    // ------------------------------------------------------------\n    // ၃။ TOAST ALERT\n    // ------------------------------------------------------------\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    // ------------------------------------------------------------\n    // ၄။ BANNERS RENDERING & GALLERY PICKER\n    // ------------------------------------------------------------\n    function renderBanners() {\n      const container = document.getElementById('bannersEditorContainer');\n      container.innerHTML = '';\n\n      currentBanners.forEach((b, index) => {\n        const card = document.createElement('div');\n        card.className = \"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\";\n        card.innerHTML = `\n          <div class=\"flex items-center justify-between border-b border-slate-100 dark:border-white/5 pb-2.5\">\n            <div class=\"flex items-center gap-2\">\n              <span class=\"w-6 h-6 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center text-xs font-mono font-bold\">${index + 1}</span>\n              <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">Banner Slide #${index + 1}</h4>\n            </div>\n            <span class=\"text-[10px] text-slate-400 font-mono\">16:9 Aspect Ratio</span>\n          </div>\n\n          <!-- Image Preview -->\n          <div class=\"w-full aspect-video rounded-xl overflow-hidden bg-slate-800 relative border border-slate-200 dark:border-white/10 shadow-inner group\">\n            <img id=\"previewImg_${index}\" src=\"${b.image}\" class=\"w-full h-full object-cover\" onerror=\"this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800'\">\n            <div class=\"absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent flex items-end p-2.5 text-white pointer-events-none\">\n              <div>\n                <span id=\"previewTag_${index}\" class=\"bg-blue-600 text-white text-[8px] font-black uppercase px-1.5 py-0.5 rounded\">${b.tag || 'Game'}</span>\n                <h5 id=\"previewTitle_${index}\" class=\"font-extrabold text-xs drop-shadow mt-0.5 truncate\">${b.title || 'Game Title'}</h5>\n              </div>\n            </div>\n            <!-- Overlay Camera Button -->\n            <button onclick=\"triggerFileInput(${index})\" class=\"absolute top-2 right-2 px-2.5 py-1.5 rounded-xl bg-black/60 hover:bg-sky-500 text-white text-xs font-bold transition flex items-center gap-1.5 shadow backdrop-blur-md\">\n              <i class=\"fa-solid fa-camera\"></i> ပုံပြောင်းမည်\n            </button>\n          </div>\n\n          <!-- Hidden File Input for Gallery -->\n          <input type=\"file\" id=\"fileInput_${index}\" accept=\"image/*\" onchange=\"handleGalleryImageSelect(event, ${index})\" class=\"hidden\">\n\n          <!-- Action Buttons & Inputs -->\n          <div class=\"space-y-2 text-xs\">\n            <div class=\"flex items-center gap-2\">\n              <button onclick=\"triggerFileInput(${index})\" class=\"flex-1 py-2 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 text-sky-400 border border-sky-500/30 font-bold flex items-center justify-center gap-2 transition active:scale-95\">\n                <i class=\"fa-solid fa-image\"></i>\n                <span>Gallery ထဲမှ ပုံရွေးချယ်တင်မည်</span>\n              </button>\n            </div>\n\n            <div>\n              <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">သို့မဟုတ် ဓာတ်ပုံ Link (Image URL):</label>\n              <input type=\"text\" id=\"urlInput_${index}\" value=\"${b.image.startsWith('data:image') ? '' : b.image}\" oninput=\"updateBannerValue(${index}, 'image', this.value)\" placeholder=\"https://...\" class=\"w-full px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-sky-500\">\n            </div>\n\n            <div class=\"grid grid-cols-2 gap-2\">\n              <div>\n                <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ခေါင်းစဉ် (Game Title):</label>\n                <input type=\"text\" value=\"${b.title}\" oninput=\"updateBannerValue(${index}, 'title', this.value)\" class=\"w-full px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-sky-500 font-bold\">\n              </div>\n              <div>\n                <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ထုတ်ဝေသူ (Publisher / Tag):</label>\n                <input type=\"text\" value=\"${b.tag}\" oninput=\"updateBannerValue(${index}, 'tag', this.value)\" class=\"w-full px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-sky-500 font-bold\">\n              </div>\n            </div>\n          </div>\n        `;\n        container.appendChild(card);\n      });\n    }\n\n    // Gallery File Picker Trigger\n    function triggerFileInput(index) {\n      document.getElementById(`fileInput_${index}`).click();\n    }\n\n    // Gallery မှ ဓာတ်ပုံရွေးပြီးချိန်တွင် Canvas ဖြင့် Compress ပြုလုပ်ကာ တင်သွင်းခြင်း\n    function handleGalleryImageSelect(event, index) {\n      const file = event.target.files[0];\n      if (!file) return;\n\n      const reader = new FileReader();\n      reader.onload = function(e) {\n        const img = new Image();\n        img.onload = function() {\n          // 16:9 Banner အတွက် သင့်လျော်သော Size သို့ Compress ပြုလုပ်ခြင်း\n          const canvas = document.createElement('canvas');\n          const maxW = 960;\n          const scale = maxW / img.width;\n          canvas.width = maxW;\n          canvas.height = img.height * scale;\n\n          const ctx = canvas.getContext('2d');\n          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);\n\n          // WebP/JPEG သို့ အရည်အသွေးမြင့် ကွန်ပရက်စ် လုပ်ခြင်း\n          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);\n\n          currentBanners[index].image = compressedBase64;\n          document.getElementById(`previewImg_${index}`).src = compressedBase64;\n          const urlField = document.getElementById(`urlInput_${index}`);\n          if (urlField) urlField.value = '';\n\n          showToast(\"ပုံရွေးချယ်ပြီးပါပြီ\", `Banner #${index + 1} အတွက် Gallery ပုံ ပြောင်းလဲပြီးပါပြီ။ Save Cloud နှိပ်ပါ`, \"success\");\n        };\n        img.src = e.target.result;\n      };\n      reader.readAsDataURL(file);\n    }\n\n    function updateBannerValue(index, field, val) {\n      currentBanners[index][field] = val;\n      if (field === 'title') {\n        const t = document.getElementById(`previewTitle_${index}`);\n        if (t) t.innerText = val;\n      } else if (field === 'tag') {\n        const tg = document.getElementById(`previewTag_${index}`);\n        if (tg) tg.innerText = val;\n      }\n    }\n\n    // ------------------------------------------------------------\n    // ၅။ FIREBASE REALTIME CLOUD SYNC\n    // ------------------------------------------------------------\n    async function fetchBannersFromCloud() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}admin_carousel_banners.json`);\n        const data = await res.json();\n        if (data && Array.isArray(data)) {\n          currentBanners = data;\n          localStorage.setItem(LOCAL_BANNERS_KEY, JSON.stringify(data));\n        } else {\n          const local = localStorage.getItem(LOCAL_BANNERS_KEY);\n          if (local) currentBanners = JSON.parse(local);\n        }\n      } catch (e) {\n        const local = localStorage.getItem(LOCAL_BANNERS_KEY);\n        if (local) currentBanners = JSON.parse(local);\n      }\n      renderBanners();\n    }\n\n    async function saveAllBannersToCloud() {\n      try {\n        const saveResponse = await fetch(`${FIREBASE_DB_URL}admin_carousel_banners.json`, {\n          method: 'PUT',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(currentBanners)\n        });\n        if (!saveResponse.ok) throw new Error('Firebase save failed: '+saveResponse.status);\n        localStorage.setItem(LOCAL_BANNERS_KEY, JSON.stringify(currentBanners));\n        showToast(\"အောင်မြင်ပါသည်\", \"Gallery မှ တင်လိုက်သော ပုံများ Cloud ပေါ်သို့ သိမ်းဆည်းပြီးပါပြီ (Index တွင် ချက်ချင်း ပြောင်းလဲမည်)\");\n      } catch (e) {\n        showToast(\"အမှား\", \"သိမ်းဆည်းမှု မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    function resetDefaultBanners() {\n      if (confirm(\"မူလ Banner ပုံ ၅ ပုံအတိုင်း ပြန်လည်ထားရှိရန် သေချာပါသလား?\")) {\n        currentBanners = JSON.parse(JSON.stringify(DEFAULT_BANNERS));\n        renderBanners();\n        saveAllBannersToCloud();\n      }\n    }\n\n    // Platform Brand Sync\n    async function syncPlatformName() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}site_platform_config.json`);\n        const data = await res.json();\n        if (data && data.name) {\n          document.getElementById('sidebarBrandName').innerText = data.name;\n        }\n      } catch (e) {}\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      syncPlatformName();\n      fetchBannersFromCloud();\n    });\n  <\/script>\n</body>\n</html>", "APremiumemoji.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - Premium Emoji & Owl Tiers Manager</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    /* Owl Sprite Preview Box
