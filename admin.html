ass=\"fa-solid fa-crown text-base\"></i><span class=\"text-[10px] font-bold\">Emoji</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-500 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"AEvent.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-500 transition\"><i class=\"fa-solid fa-wand-magic-sparkles text-base\"></i><span class=\"text-[10px] font-semibold\">Event</span></a>\n    </div>\n  </nav>\n\n  <!-- ==================== JAVASCRIPT LOGIC & FIREBASE SYNC ==================== -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n    const LOCAL_TIERS_KEY = 'admin_owl_sprite_tiers';\n\n    let toastTimeout = null;\n\n    // Default 11 Tiers Data\n    const DEFAULT_TIERS = [\n      { id: 1,  title: \"Level 1 (Bronze Owl)\",      min: 1000,   emoji: \"🥉\", customImg: \"\", cssClass: \"owl-lvl-1\" },\n      { id: 2,  title: \"Level 2 (Silver Owl)\",      min: 5000,   emoji: \"🥈\", customImg: \"\", cssClass: \"owl-lvl-2\" },\n      { id: 3,  title: \"Level 3 (Golden Owl)\",      min: 15000,  emoji: \"🥇\", customImg: \"\", cssClass: \"owl-lvl-3\" },\n      { id: 4,  title: \"Level 4 (Platinum Owl)\",    min: 30000,  emoji: \"💎\", customImg: \"\", cssClass: \"owl-lvl-4\" },\n      { id: 5,  title: \"Level 5 (Diamond Owl)\",     min: 50000,  emoji: \"💠\", customImg: \"\", cssClass: \"owl-lvl-5\" },\n      { id: 6,  title: \"Level 6 (Master Owl)\",      min: 75000,  emoji: \"🔮\", customImg: \"\", cssClass: \"owl-lvl-6\" },\n      { id: 7,  title: \"Level 7 (Grandmaster Owl)\", min: 100000, emoji: \"⚔️\", customImg: \"\", cssClass: \"owl-lvl-7\" },\n      { id: 8,  title: \"Level 8 (Epic Owl)\",        min: 150000, emoji: \"🛡️\", customImg: \"\", cssClass: \"owl-lvl-8\" },\n      { id: 9,  title: \"Level 9 (Legend Owl)\",      min: 200000, emoji: \"🦅\", customImg: \"\", cssClass: \"owl-lvl-9\" },\n      { id: 10, title: \"Level 10 (Mythic Owl)\",     min: 300000, emoji: \"👑\", customImg: \"\", cssClass: \"owl-lvl-10\" },\n      { id: 11, title: \"Level 11 (Immortal Owl)\",   min: 500000, emoji: \"🔥\", customImg: \"\", cssClass: \"owl-lvl-11\" }\n    ];\n\n    let currentTiers = [...DEFAULT_TIERS];\n\n    // ------------------------------------------------------------\n    // ၁။ ဖုန်းဗားရှင်း / PC ဗားရှင်း ပြောင်းလဲမှု\n    // ------------------------------------------------------------\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n        showToast(\"ကွန်ပြူတာဗားရှင်း\", \"Desktop View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n        showToast(\"ဖုန်းဗားရှင်း\", \"Mobile View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      const target = current === 'mobile' ? 'desktop' : 'mobile';\n      applyDeviceLayout(target);\n    }\n\n    // ------------------------------------------------------------\n    // ၂။ THEME ENGINE (DARK / LIGHT)\n    // ------------------------------------------------------------\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n\n      const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      if (savedLayout === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    // ------------------------------------------------------------\n    // ၃။ TOAST ALERT\n    // ------------------------------------------------------------\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-crown';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    // ------------------------------------------------------------\n    // ၄။ TIERS RENDERING & GALLERY IMAGE PICKER\n    // ------------------------------------------------------------\n    function renderTiers() {\n      const container = document.getElementById('tiersGridContainer');\n      container.innerHTML = '';\n\n      currentTiers.forEach((tier, index) => {\n        const card = document.createElement('div');\n        card.className = \"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm hover:border-amber-500/30 transition\";\n\n        const hasCustomImg = tier.customImg && tier.customImg.trim() !== '';\n        const badgeVisual = hasCustomImg \n          ? `<img id=\"badgeImg_${index}\" src=\"${tier.customImg}\" class=\"w-7 h-7 rounded-lg object-contain shadow border border-amber-500/30\" alt=\"Custom Badge\">`\n          : `<span id=\"badgeSprite_${index}\" class=\"owl-sprite ${tier.cssClass}\"></span>`;\n\n        card.innerHTML = `\n          <div class=\"flex items-center justify-between border-b border-slate-100 dark:border-white/5 pb-2.5\">\n            <div class=\"flex items-center gap-2.5\">\n              <div id=\"badgeVisualBox_${index}\" class=\"cursor-pointer\" onclick=\"triggerTierFileInput(${index})\" title=\"Gallery မှ ပုံပြောင်းရန် နှိပ်ပါ\">\n                ${badgeVisual}\n              </div>\n              <div>\n                <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">${tier.title}</h4>\n                <span class=\"text-[10px] text-slate-400 font-mono\">Tier ${tier.id}</span>\n              </div>\n            </div>\n            <span class=\"text-lg\" id=\"emojiPreview_${index}\">${tier.emoji || '💎'}</span>\n          </div>\n\n          <!-- Hidden File Input for Gallery Badge -->\n          <input type=\"file\" id=\"tierFileInput_${index}\" accept=\"image/*\" onchange=\"handleTierImageSelect(event, ${index})\" class=\"hidden\">\n\n          <div class=\"grid grid-cols-2 gap-2 text-xs\">\n            <div>\n              <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">သတ်မှတ်ငွေ (Min Spent):</label>\n              <div class=\"relative\">\n                <input type=\"number\" value=\"${tier.min}\" onchange=\"updateTierValue(${index}, 'min', this.value)\" class=\"w-full pl-2.5 pr-8 py-1.5 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono font-bold outline-none focus:border-amber-500\">\n                <span class=\"absolute right-2 top-1.5 text-[9px] text-slate-400 font-bold\">MMK</span>\n              </div>\n            </div>\n\n            <div>\n              <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">VIP Emoji သင်္ကေတ:</label>\n              <input type=\"text\" value=\"${tier.emoji || '💎'}\" oninput=\"updateTierValue(${index}, 'emoji', this.value)\" class=\"w-full px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white text-center text-sm outline-none focus:border-amber-500\">\n            </div>\n          </div>\n\n          <!-- Gallery Badge Upload & Remove Button -->\n          <div class=\"pt-1 flex items-center gap-2\">\n            <button onclick=\"triggerTierFileInput(${index})\" class=\"flex-1 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-500 border border-amber-500/30 text-[11px] font-bold flex items-center justify-center gap-1.5 transition active:scale-95\">\n              <i class=\"fa-solid fa-camera\"></i>\n              <span>Gallery မှ Badge တင်မည်</span>\n            </button>\n            ${hasCustomImg ? `\n              <button onclick=\"removeTierCustomImage(${index})\" class=\"px-2.5 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white text-[11px] font-bold transition active:scale-95\" title=\"မူလအတိုင်း ပြန်ပြောင်းမည်\">\n                <i class=\"fa-solid fa-trash\"></i>\n              </button>\n            ` : ''}\n          </div>\n        `;\n        container.appendChild(card);\n      });\n    }\n\n    // Trigger File Input\n    function triggerTierFileInput(index) {\n      document.getElementById(`tierFileInput_${index}`).click();\n    }\n\n    // Handle Gallery Image Selection & Compression\n    function handleTierImageSelect(event, index) {\n      const file = event.target.files[0];\n      if (!file) return;\n\n      const reader = new FileReader();\n      reader.onload = function(e) {\n        const img = new Image();\n        img.onload = function() {\n          const canvas = document.createElement('canvas');\n          const size = 128;\n          canvas.width = size;\n          canvas.height = size;\n\n          const ctx = canvas.getContext('2d');\n          ctx.drawImage(img, 0, 0, size, size);\n\n          const compressedBase64 = canvas.toDataURL('image/png', 0.85);\n\n          currentTiers[index].customImg = compressedBase64;\n          renderTiers();\n\n          showToast(\"Badge တင်ပြီးပါပြီ\", `Tier #${index + 1} အတွက် Gallery ပုံ ပြောင်းလဲပြီးပါပြီ။ Save Cloud နှိပ်ပါ`, \"success\");\n        };\n        img.src = e.target.result;\n      };\n      reader.readAsDataURL(file);\n    }\n\n    function removeTierCustomImage(index) {\n      currentTiers[index].customImg = \"\";\n      renderTiers();\n      showToast(\"မူလအတိုင်းထားပြီး\", `Tier #${index + 1} ကို မူရင်း Owl Sprite အဖြစ် ပြန်ထားလိုက်ပါပြီ`, \"info\");\n    }\n\n    function updateTierValue(index, field, val) {\n      if (field === 'min') {\n        currentTiers[index].min = Number(val) || 0;\n      } else if (field === 'emoji') {\n        currentTiers[index].emoji = val.trim();\n        const preview = document.getElementById(`emojiPreview_${index}`);\n        if (preview) preview.innerText = val.trim();\n      }\n    }\n\n    // ------------------------------------------------------------\n    // ၅။ FIREBASE REALTIME CLOUD SYNC\n    // ------------------------------------------------------------\n    async function fetchTiersFromCloud() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}admin_owl_sprite_tiers.json`);\n        const data = await res.json();\n        if (data && Array.isArray(data) && data.length > 0) {\n          currentTiers = data;\n          localStorage.setItem(LOCAL_TIERS_KEY, JSON.stringify(data));\n        } else {\n          const local = localStorage.getItem(LOCAL_TIERS_KEY);\n          if (local) currentTiers = JSON.parse(local);\n        }\n      } catch (err) {\n        const local = localStorage.getItem(LOCAL_TIERS_KEY);\n        if (local) currentTiers = JSON.parse(local);\n      }\n      renderTiers();\n    }\n\n    async function saveAllTiersToCloud() {\n      try {\n        await fetch(`${FIREBASE_DB_URL}admin_owl_sprite_tiers.json`, {\n          method: 'PUT',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(currentTiers)\n        });\n        localStorage.setItem(LOCAL_TIERS_KEY, JSON.stringify(currentTiers));\n        showToast(\"သိမ်းဆည်းပြီးပါပြီ\", \"11 Tiers ဇီးကွက် Badges များကို Cloud ပေါ်သို့ သိမ်းဆည်းပြီးပါပြီ (User အားလုံးထံ ချက်ချင်း ပြောင်းလဲမည်)\");\n      } catch (err) {\n        showToast(\"အမှား\", \"Cloud ပေါ်သို့ သိမ်းဆည်းမှု မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    function resetToDefaults() {\n      if (confirm(\"မူလ သတ်မှတ်ချက်အတိုင်း ပြန်လည်ထားရှိရန် သေချာပါသလား?\")) {\n        currentTiers = JSON.parse(JSON.stringify(DEFAULT_TIERS));\n        renderTiers();\n        saveAllTiersToCloud();\n      }\n    }\n\n    // Platform Brand Sync\n    async function syncPlatformName() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}site_platform_config.json`);\n        const data = await res.json();\n        if (data && data.name) {\n          document.getElementById('sidebarBrandName').innerText = data.name;\n        }\n      } catch (e) {}\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      syncPlatformName();\n      fetchTiersFromCloud();\n    });\n  <\/script>\n</body>\n</html>", "APayment.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - Payment & QR Code Manager (APayment)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    body.forced-desktop {\n      min-width: 1200px !important;\n      overflow-x: auto !important;\n    }\n    body.forced-desktop #desktopSidebar {\n      display: flex !important;\n    }\n    body.forced-desktop #mobileBottomBar {\n      display: none !important;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- TOAST ALERT -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-circle-check\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- EDIT PAYMENT METHOD MODAL (LOGO ပုံရော QR ပုံပါ ပါဝင်သည်) -->\n  <div id=\"paymentMethodModal\" class=\"fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4\">\n    <div class=\"bg-[#0e1629] border border-white/10 w-full max-w-md rounded-[32px] p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scroll\">\n      <div class=\"flex items-center justify-between pb-2 border-b border-white/10\">\n        <div class=\"flex items-center gap-2\">\n          <div class=\"w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs\">\n            <i class=\"fa-solid fa-credit-card\"></i>\n          </div>\n          <h3 class=\"font-bold text-sm text-white\" id=\"modalMethodTitle\">ငွေလက်ခံအကောင့် & ပုံများ ပြင်ဆင်ရန်</h3>\n        </div>\n        <button onclick=\"closeMethodModal()\" class=\"w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-white\">\n          <i class=\"fa-solid fa-xmark\"></i>\n        </button>\n      </div>\n\n      <input type=\"hidden\" id=\"editMethodKey\">\n\n      <div class=\"space-y-3.5 text-xs\">\n        \n        <p id=\"paymentUploadStatus\" role=\"status\" style=\"font-size:11px;color:#6ee7b7;margin:6px 0 10px\"></p>\n        <!-- Two Image Uploads: KPay/Provider Logo ပုံ & QR Code ပုံ -->\n        <div class=\"grid grid-cols-2 gap-3\">\n          \n          <!-- ၁။ Logo ပုံ တင်သည့်နေရာ -->\n          <div class=\"p-3 rounded-2xl bg-white/[0.02] border border-white/5 space-y-2 text-center\">\n            <span class=\"block text-[11px] font-bold text-blue-400\">KPay / Logo ပုံ</span>\n            <label for=\"logoFileInput\" class=\"w-20 h-20 mx-auto rounded-2xl bg-black/40 border-2 border-dashed border-white/20 flex items-center justify-center overflow-hidden cursor-pointer hover:border-blue-500 transition relative group\">\n              <img id=\"logoPreviewImg\" src=\"\" class=\"w-full h-full object-cover hidden\" alt=\"Logo\">\n              <div id=\"logoUploadPlaceholder\" class=\"text-slate-400 group-hover:text-blue-400\">\n                <i class=\"fa-solid fa-image text-xl\"></i>\n                <span class=\"block text-[8px] mt-1\">Logo တင်မည်</span>\n              </div>\n            </label>\n            <input type=\"file\" id=\"logoFileInput\" accept=\"image/*\" class=\"block w-full text-[10px] mt-2 text-blue-400\" style=\"font-size:12px;max-width:100%;\" onchange=\"handleLogoUpload(event)\">\n            <label for=\"logoFileInput\" class=\"text-[10px] text-blue-400 hover:underline font-bold\">\n              Gallery မှ Logo ပြောင်းမည်\n            </label>\n          </div>\n\n          <!-- ၂။ QR Code ပုံ တင်သည့်နေရာ -->\n          <div class=\"p-3 rounded-2xl bg-white/[0.02] border border-white/5 space-y-2 text-center\">\n            <span class=\"block text-[11px] font-bold text-emerald-400\">QR Code ဓာတ်ပုံ</span>\n            <label for=\"qrFileInput\" class=\"w-20 h-20 mx-auto rounded-2xl bg-black/40 border-2 border-dashed border-white/20 flex items-center justify-center overflow-hidden cursor-pointer hover:border-emerald-500 transition relative group\">\n              <img id=\"qrPreviewImg\" src=\"\" class=\"w-full h-full object-contain hidden\" alt=\"QR Code\">\n              <div id=\"qrUploadPlaceholder\" class=\"text-slate-400 group-hover:text-emerald-400\">\n                <i class=\"fa-solid fa-qrcode text-xl\"></i>\n                <span class=\"block text-[8px    </h3>\n            <p class=\"text-[10px] text-slate-400 mt-0.5\">Logo ပုံနှင့် QR ပုံများကို Gallery မှ ရွေးချယ်တင်သွင်းနိုင်ပါသည်</p>\n          </div>\n        </div>\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5\" id=\"paymentAccountsGrid\"></div>\n      </div>\n\n      <!-- SLIPS TABLE -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"flex flex-col sm:flex-row items-center justify-between gap-3 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <div>\n            <h3 class=\"text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2\">\n              <i class=\"fa-solid fa-receipt text-emerald-400\"></i> ငွေဖြည့်စလစ်ပြေစာများ (Wallet Top-Up Slips)\n            </h3>\n            <p class=\"text-[10px] text-slate-400 mt-0.5\">User များ payment.html မှ ပေးပို့ထားသော စလစ်များ</p>\n          </div>\n\n          <div class=\"flex items-center gap-1.5 text-xs font-bold\">\n            <button onclick=\"filterSlips('pending')\" id=\"tab-slip-pending\" class=\"px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition\">စစ်ဆေးဆဲ (Pending)</button>\n            <button onclick=\"filterSlips('completed')\" id=\"tab-slip-completed\" class=\"px-3 py-1.5 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/5 transition\">အတည်ပြုပြီး</button>\n            <button onclick=\"filterSlips('all')\" id=\"tab-slip-all\" class=\"px-3 py-1.5 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/5 transition\">အားလုံး</button>\n          </div>\n        </div>\n\n        <div class=\"overflow-x-auto\">\n          <table class=\"w-full text-left text-xs\">\n            <thead>\n              <tr class=\"text-slate-400 border-b border-slate-200 dark:border-white/5 text-[10px] font-bold uppercase\">\n                <th class=\"py-2.5 px-3\">Order ID</th>\n                <th class=\"py-2.5 px-3\">User</th>\n                <th class=\"py-2.5 px-3\">Phone</th>\n                <th class=\"py-2.5 px-3\">Payment Method</th>\n                <th class=\"py-2.5 px-3\">Date</th>\n                <th class=\"py-2.5 px-3\">Amount</th>\n                <th class=\"py-2.5 px-3\">Status</th>\n                <th class=\"py-2.5 px-3 text-right\">Actions</th>\n              </tr>\n            </thead>\n            <tbody id=\"slipsTableBody\" class=\"divide-y divide-slate-100 dark:divide-white/5\"></tbody>\n          </table>\n        </div>\n      </div>\n    </main>\n  </div>\n\n  <!-- JAVASCRIPT LOGIC & FIREBASE SYNC -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n\n    let currentSlipFilter = 'pending';\n    let tempLogoBase64 = null;\n    let tempQrBase64 = null;\n    let toastTimeout = null;\n    let cloudSlips = {};\n\n    let paymentMethods = [\n      {\n        key: 'kpay',\n        name: 'KBZPay',\n        number: '09 904 599 001',\n        accountName: 'U KYAW KYAW',\n        status: 'active',\n        color: 'from-blue-600 to-blue-700',\n        logoImg: '',\n        qrImg: 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=09904599001'\n      },\n      {\n        key: 'wave',\n        name: 'WavePay',\n        number: '09 904 599 002',\n        accountName: 'DAW HLA HLA',\n        status: 'active',\n        color: 'from-yellow-500 to-amber-600',\n        logoImg: '',\n        qrImg: 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=09904599002'\n      },\n      {\n        key: 'cb',\n        name: 'CBPay',\n        number: '09 904 599 003',\n        accountName: 'U MIN THU',\n        status: 'active',\n        color: 'from-rose-600 to-red-700',\n        logoImg: '',\n        qrImg: 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=09904599003'\n      },\n      {\n        key: 'aya',\n        name: 'AYAPay',\n        number: '09 904 599 004',\n        accountName: 'KAVXY SHOP',\n        status: 'active',\n        color: 'from-red-600 to-rose-700',\n        logoImg: '',\n        qrImg: 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=09904599004'\n      }\n    ];\n\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      applyDeviceLayout(current === 'mobile' ? 'desktop' : 'mobile');\n    }\n\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n      if ((localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile') === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    function renderPaymentAccounts() {\n      const container = document.getElementById('paymentAccountsGrid');\n      container.innerHTML = '';\n\n      paymentMethods.forEach(m => {\n        const card = document.createElement('div');\n        const isActive = m.status === 'active';\n        card.className = \"p-4 rounded-2xl bg-slate-50 dark:bg-white/[0.02] border border-slate-200 dark:border-white/5 space-y-3 relative hover:border-slate-300 dark:hover:border-white/10 transition flex flex-col justify-between shadow-sm\";\n\n        // Custom Logo Image သို့မဟုတ် Text Icon ပြသခြင်း\n        const logoVisual = (m.logoImg && m.logoImg.trim() !== '')\n          ? `<img src=\"${m.logoImg}\" class=\"w-8 h-8 rounded-xl object-cover shadow border border-white/10\">`\n          : `<div class=\"w-8 h-8 rounded-xl bg-gradient-to-tr ${m.color} text-white flex items-center justify-center font-bold text-xs shadow-md\">${m.name.slice(0, 3)}</div>`;\n\n        card.innerHTML = `\n          <div>\n            <div class=\"flex items-center justify-between pb-2 border-b border-slate-200 dark:border-white/5\">\n              <div class=\"flex items-center gap-2\">\n                ${logoVisual}\n                <div>\n                  <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">${m.name}</h4>\n                  <span class=\"text-[9px] ${isActive ? 'text-emerald-500' : 'text-amber-500'} font-semibold\">${isActive ? 'Active' : 'Maintenance'}</span>\n                </div>\n              </div>\n              <button onclick=\"openMethodModal('${m.key}')\" class=\"w-7 h-7 rounded-lg bg-slate-200 dark:bg-white/[0.03] hover:bg-blue-600 text-slate-600 dark:text-slate-400 hover:text-white flex items-center justify-center text-xs transition\">\n                <i class=\"fa-solid fa-pen\"></i>\n              </button>\n            </div>\n\n            <div class=\"flex items-center justify-between gap-2 pt-3\">\n              <div class=\"space-y-1 text-xs\">\n                <div class=\"text-slate-400 text-[10px]\">ဖုန်း / အကောင့်:</div>\n                <div class=\"font-mono font-bold text-slate-900 dark:text-white text-xs tracking-wider\">${m.number}</div>\n                <div class=\"text-slate-400 text-[10px] pt-0.5\">အကောင့်အမည်:</div>\n                <div class=\"font-bold text-blue-500 text-xs truncate max-w-[120px]\">${m.accountName}</div>\n              </div>\n              <div onclick=\"openQrZoomModal('${m.name}', '${m.qrImg}', '${m.number}')\" class=\"w-12 h-12 bg-white p-1 rounded-xl cursor-pointer hover:scale-105 transition border border-slate-200 dark:border-white/20 shadow-md shrink-0\">\n                <img src=\"${m.qrImg}\" class=\"w-full h-full object-contain\" alt=\"QR Code\">\n              </div>\n            </div>\n          </div>\n\n          <div class=\"pt-2 border-t border-slate-200 dark:border-white/5 flex items-center justify-between text-[10px]\">\n            <span class=\"text-slate-400\">QR စကန်ဖတ်ရန်</span>\n            <button onclick=\"openQrZoomModal('${m.name}', '${m.qrImg}', '${m.number}')\" class=\"text-emerald-500 font-bold hover:underline flex items-center gap-1\">\n              <i class=\"fa-solid fa-expand text-[9px]\"></i> Zoom QR\n            </button>\n          </div>\n        `;\n        container.appendChild(card);\n      });\n    }\n\n    function openMethodModal(key) {\n      const m = paymentMethods.find(item => item.key === key);\n      if (!m) return;\n\n      document.getElementById('editMethodKey').value = m.key;\n      document.getElementById('methodProvider').value = m.name;\n      document.getElementById('methodNumber').value = m.number;\n      document.getElementById('methodAccountName').value = m.accountName;\n      document.getElementById('methodStatus').value = m.status;\n\n      tempLogoBase64 = m.logoImg || null;\n      tempQrBase64 = m.qrImg || null;\n\n      // Logo Preview\n      const logoImg = document.getElementById('logoPreviewImg');\n      const logoHolder = document.getElementById('logoUploadPlaceholder');\n      if (m.logoImg) {\n        logoImg.src = m.logoImg;\n        logoImg.classList.remove('hidden');\n        logoHolder.classList.add('hidden');\n      } else {\n        logoImg.classList.add('hidden');\n        logoHolder.classList.remove('hidden');\n      }\n\n      // QR Preview\n      const qrImg = document.getElementById('qrPreviewImg');\n      const qrHolder = document.getElementById('qrUploadPlaceholder');\n      if (m.qrImg) {\n        qrImg.src = m.qrImg;\n        qrImg.classList.remove('hidden');\n        qrHolder.classList.add('hidden');\n      } else {\n        qrImg.classList.add('hidden');\n        qrHolder.classList.remove('hidden');\n      }\n\n      setPaymentUploadStatus('ပုံရွေးပြီးနောက် Save နှိပ်ပါ။ ဖုန်း Gallery မဖွင့်လျှင် အောက်က Choose File ကိုနှိပ်ပါ။');\n      document.getElementById('paymentMethodModal').classList.remove('hidden');\n    }\n\n    function closeMethodModal() {\n      document.getElementById('paymentMethodModal').classList.add('hidden');\n    }\n\n    function setPaymentUploadStatus(message, failed=false) {\n      const el = document.getElementById('paymentUploadStatus');\n      if (el) { el.textContent = message; el.style.color = failed ? '#fda4af' : '#6ee7b7'; }\n    }\n    // Android Gallery / file picker: image validation, compression, preview and explicit errors.\n    async function processPaymentImage(event, kind) {\n      const input = event.target;\n      const file = input.files && input.files[0];\n      if (!file) return;\n      const isLogo = kind === 'logo';\n      try {\n        if (!file.type.startsWith('image/')) throw new Error('ပုံဖိုင် JPG / PNG / WEBP ကိုသာ ရွေးပါ');\n        if (file.size > 12 * 1024 * 1024) throw new Error('ပုံဖိုင် 12MB ထက် မကြီးရပါ');\n        const dataUrl = await new Promise((resolve, reject) => {\n          const reader = new FileReader();\n          reader.onload = () => resolve(reader.result);\n          reader.onerror = () => reject(new Error('ဖိုင်ဖတ်မရပါ'));\n          reader.readAsDataURL(file);\n        });\n        const img = await new Promise((resolve, reject) => {\n          const image = new Image();\n          image.onload = () => resolve(image);\n          image.onerror = () => reject(new Error('ဓာတ်ပုံဖွင့်မရပါ'));\n          image.src = dataUrl;\n        });\n        const max = isLogo ? 220 : 480;\n        const scale = Math.min(max / img.width, max / img.height, 1);\n        const canvas = document.createElement('canvas');\n        canvas.width = Math.max(1, Math.round(img.width * scale));\n        canvas.height = Math.max(1, Math.round(img.height * scale));\n        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);\n        const encoded = canvas.toDataURL(isLogo ? 'image/jpeg' : 'image/png', isLogo ? 0.78 : undefined);\n        if (encoded.length > 950000) throw new Error('ပုံအရွယ်အစား ကြီးနေပါသည် — ပိုသေးသောပုံ ရွေးပါ');\n        if (isLogo) tempLogoBase64 = encoded;\n        else tempQrBase64 = encoded;\n        document.getElementById(isLogo ? 'logoPreviewImg' : 'qrPreviewImg').src = encoded;\n        document.getElementById(isLogo ? 'logoPreviewImg' : 'qrPreviewImg').classList.remove('hidden');\n        document.getElementById(isLogo ? 'logoUploadPlaceholder' : 'qrUploadPlaceholder').classList.add('hidden');\n        setPaymentUploadStatus((isLogo ? 'Logo' : 'QR') + ' ပုံရွေးပြီးပါပြီ (' + file.name + ') — Save ကို နှိပ်ပါ');\n        showToast('ပုံရွေးပြီးပါပြီ', 'Cloud မှာ သိမ်းရန် Save ကိုနှိပ်ပါ', 'success');\n      } catch (err) {\n        console.error('Payment image upload:', err);\n        setPaymentUploadStatus(err.message || 'ပုံရွေးမရပါ', true);\n        showToast('ပုံတင်မရပါ', err.message || 'ဖိုင်ပြဿနာရှိနေပါသည်', 'error');\n      } finally {\n        input.value = '';\n      }\n    }\n    function handleLogoUpload(event) { return processPaymentImage(event, 'logo'); }\n    function handleQrUpload(event) { return processPaymentImage(event, 'qr'); }\n\n    // FIREBASE REALTIME DB သို့ တိုက်ရိုက် SAVE လုပ်ခြင်း\n    async function savePaymentMethodChanges() {\n      const key = document.getElementById('editMethodKey').value;\n      const number = document.getElementById('methodNumber').value.trim();\n      const name = document.getElementById('methodAccountName').value.trim();\n      const status = document.getElementById('methodStatus').value;\n\n      if (!number || !name) {\n        showToast('မှားယွင်းမှု', 'အကောင့်နံပါတ်နှင့် အမည်ကို ဖြည့်သွင်းပါ', 'error');\n        return;\n      }\n\n      const btn = document.getElementById('btnSaveMethod');\n      btn.disabled = true;\n      btn.innerHTML = `<i class=\"fa-solid fa-spinner animate-spin\"></i> သိမ်းဆည်းနေပါသည်...`;\n\n      const idx = paymentMethods.findIndex(item => item.key === key);\n      if (idx !== -1) {\n        const previous = { ...paymentMethods[idx] };\n        paymentMethods[idx].number = number;\n        paymentMethods[idx].accountName = name;\n        paymentMethods[idx].status = status;\n        if (tempLogoBase64) paymentMethods[idx].logoImg = tempLogoBase64;\n        if (tempQrBase64) paymentMethods[idx].qrImg = tempQrBase64;\n\n        // payment.html နှင့် Key တူညီစွာ Firebase သို့ တင်ပို့ခြင်း\n        const paymentSettingsObj = {};\n        paymentMethods.forEach(m => {\n          paymentSettingsObj[m.key] = {\n            title: m.name,\n            name: m.accountName,\n            phone: m.number,\n            status: m.status,\n            logo: m.logoImg || '',\n            qr: m.qrImg || `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(m.number)}`\n          };\n        });\n\n        try {\n          const saveResponse = await fetch(`${FIREBASE_DB_URL}admin_payment_settings.json`, {\n            method: 'PUT',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify(paymentSettingsObj)\n          });\n          if (!saveResponse.ok) {\n            const detail = await saveResponse.text().catch(() => '');\n            throw new Error(saveResponse.status === 401 || saveResponse.status === 403 ? 'Firebase Rules / Admin Login ခွင့်ပြုချက် မရှိပါ (' + saveResponse.status + ')' : 'Firebase save failed (' + saveResponse.status + '): ' + detail.slice(0, 160));\n          }\n\n          closeMethodModal();\n          renderPaymentAccounts();\n          showToast('အောင်မြင်ပါသည်', `${paymentMethods[idx].name} အချက်အလက်များနှင့် ပုံများကို Cloud ပေါ်သို့ သိမ်းဆည်းပြီးပါပြီ`);\n        } catch (e) {\n          paymentMethods[idx] = previous;\n          console.error('Payment save error:', e);\n          setPaymentUploadStatus('Save မအောင်မြင်ပါ: ' + String(e.message || e).slice(0, 180), true);\n          showToast('Cloud Save မအောင်မြင်ပါ', String(e.message || e).slice(0, 180), 'error');\n        } finally {\n          btn.disabled = false;\n          btn.innerHTML = `<i class=\"fa-solid fa-floppy-disk\"></i> သိမ်းဆည်းမည် (Save)`;\n        }\n      }\n    }\n\n    function openQrZoomModal(name, qrUrl, number) {\n      document.getElementById('qrZoomTitle').innerText = name + ' - QR Code';\n      document.getElementById('qrZoomImg').src = qrUrl;\n      document.getElementById('qrZoomNumber').innerText = 'အကောင့်နံပါတ်: ' + number;\n      document.getElementById('qrZoomModal').classList.remove('hidden');\n    }\n\n    function closeQrZoomModal() {\n      document.getElementById('qrZoomModal').classList.add('hidden');\n    }\n\n    async function fetchSlipsFromCloud() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}wallet_topup_slips.json`);\n        const data = await res.json();\n        cloudSlips = data || {};\n      } catch (err) {\n        cloudSlips = {};\n      }\n      renderSlipsTable();\n      updateMetrics();\n    }\n\n    function filterSlips(status) {\n      currentSlipFilter = status;\n      ['pending', 'completed', 'all'].forEach(s => {\n        const btn = document.getElementById(`tab-slip-${s}`);\n        if (s === status) {\n          btn.className = 'px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition';\n        } else {\n          btn.className = 'px-3 py-1.5 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/5 transition';\n        }\n      });\n      renderSlipsTable();\n    }\n\n    function renderSlipsTable() {\n      const tbody = document.getElementById('slipsTableBody');\n      tbody.innerHTML = '';\n\n      const slipKeys = Object.keys(cloudSlips).reverse();\n\n      const filteredKeys = slipKeys.filter(k => {\n        const s = cloudSlips[k];\n        if (currentSlipFilter === 'all') return true;\n        return (s.status || 'pending') === currentSlipFilter;\n      });\n\n      if (filteredKeys.length === 0) {\n        tbody.innerHTML = `<tr><td colspan=\"8\" class=\"py-8 text-center text-slate-400 font-bold\">ငွေဖြည့်စလစ်မှတ်တမ်း မရှိသေးပါ</td></tr>`;\n        return;\n      }\n\n      filteredKeys.forEach(k => {\n        const s = cloudSlips[k];\n        const tr = document.createElement('tr');\n        tr.className = \"hover:bg-slate-50 dark:hover:bg-white/[0.02] transition\";\n\n        const isApproved = s.status === 'completed';\n        let badgeClass = 'bg-amber-500/20 text-amber-500 border border-amber-500/30';\n        let badgeText = 'စစ်ဆေးဆဲ';\n        if (isApproved) {\n          badgeClass = 'bg-emerald-500/20 text-emerald-500 border border-emerald-500/30';\n          badgeText = 'အတည်ပြုပြီး';\n        } else if (s.status === 'rejected') {\n          badgeClass = 'bg-rose-500/20 text-rose-500 border border-rose-500/30';\n          badgeText = 'ပယ်ဖျက်ပြီး';\n        }\n\n        const priceText = s.amount && s.amount !== 'စစ်ဆေးဆဲ' \n          ? `${Number(s.amount).toLocaleString()} MMK` \n          : 'စစ်ဆေးဆဲ';\n\n        tr.innerHTML = `\n          <td class=\"py-3 px-3 font-mono font-bold text-slate-400\">#${s.orderId || k}</td>\n          <td class=\"py-3 px-3 font-bold text-slate-900 dark:text-white\">${s.user || 'Player'}</td>\n          <td class=\"py-3 px-3 font-mono text-slate-500 dark:text-slate-300\">${s.phone || '-'}</td>\n          <td class=\"py-3 px-3\">\n            <span class=\"px-2 py-0.5 rounded-lg bg-blue-500/10 text-blue-500 font-bold text-[10px]\">${s.paymentMethod || 'KPay'}</span>\n          </td>\n          <td class=\"py-3 px-3 text-slate-400 text-[11px]\">${s.date || '--'}</td>\n          <td class=\"py-3 px-3 font-mono font-black text-emerald-500\">${priceText}</td>\n          <td class=\"py-3 px-3\"><span class=\"px-2 py-0.5 rounded-full text-[9px] font-bold ${badgeClass}\">${badgeText}</span></td>\n          <td class=\"py-3 px-3 text-right\">\n            <button onclick=\"openTopupModal('${k}')\" class=\"px-3 py-1 rounded-xl bg-blue-600/15 hover:bg-blue-600 text-blue-500 hover:text-white font-bold text-[10px] transition\">\n              စစ်ဆေးမည်\n            </button>\n          </td>\n        `;\n        tbody.appendChild(tr);\n      });\n    }\n\n    function openTopupModal(key) {\n      const s = cloudSlips[key];\n      if (!s) return;\n\n      document.getElementById('reviewOrderId').value = key;\n      document.getElementById('reviewOrderIdText').innerText = '#' + (s.orderId || key);\n      document.getElementById('reviewUserName').innerText = s.user || 'Player';\n      document.getElementById('reviewUserPhone').innerText = s.phone || '-';\n      document.getElementById('reviewPaymentMethod').innerText = s.paymentMethod || 'KPay';\n      document.getElementById('reviewDateText').innerText = s.date || '--';\n      document.getElementById('reviewSlipImg').src = s.slipImg || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500';\n      document.getElementById('reviewApproveAmount').value = s.amount && s.amount !== 'စစ်ဆေးဆဲ' ? s.amount : '';\n\n      document.getElementById('topupReviewModal').classList.remove('hidden');\n    }\n\n    function closeTopupModal() {\n      document.getElementById('topupReviewModal').classList.add('hidden');\n    }\n\n    async function handleApproveTopup() {\n      const key = document.getElementById('reviewOrderId').value;\n      const amount = parseFloat(document.getElementById('reviewApproveAmount').value) || 0;\n\n      if (amount <= 0) {\n        showToast('မှားယွင်းမှု', 'ဖြည့်သွင်းပေးမည့် ငွေပမာဏကို ရိုက်ထည့်ပါ', 'error');\n        return;\n      }\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}wallet_topup_slips/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ status: 'completed', amount: amount.toString() })\n        });\n\n        if (cloudSlips[key]) {\n          cloudSlips[key].status = 'completed';\n          cloudSlips[key].amount = amount.toString();\n        }\n\n        closeTopupModal();\n        renderSlipsTable();\n        updateMetrics();\n        showToast('ငွေဖြည့်ပြီးပါပြီ', `User ထံသို့ ${amount.toLocaleString()} MMK ဖြည့်သွင်းအတည်ပြုပြီးပါပြီ`);\n      } catch (e) {\n        showToast('အမှား', 'အတည်ပြုခြင်း မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    async function handleRejectTopup() {\n      const key = document.getElementById('reviewOrderId').value;\n      try {\n        await fetch(`${FIREBASE_DB_URL}wallet_topup_slips/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ status: 'rejected' })\n        });\n\n        if (cloudSlips[key]) cloudSlips[key].status = 'rejected';\n\n        closeTopupModal();\n        renderSlipsTable();\n        updateMetrics();\n        showToast('ပယ်ဖျက်ပြီး', `Slip Order #${key} ကို ပယ်ဖျက်လိုက်ပါပြီ`, 'error');\n      } catch (e) {\n        showToast('အမှား', 'မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    function updateMetrics() {\n      document.getElementById('metricActiveChannels').innerText = paymentMethods.filter(m => m.status === 'active').length;\n\n      const slipKeys = Object.keys(cloudSlips);\n      const pendingCount = slipKeys.filter(k => (cloudSlips[k].status || 'pending') === 'pending').length;\n      document.getElementById('metricPendingSlips').innerText = pendingCount;\n\n      const totalApproved = slipKeys\n        .filter(k => cloudSlips[k].status === 'completed' && cloudSlips[k].amount)\n        .reduce((sum, k) => sum + (Number(cloudSlips[k].amount) || 0), 0);\n      document.getElementById('metricApprovedTopup').innerText = `${totalApproved.toLocaleString()} MMK`;\n    }\n\n    async function fetchCloudPaymentSettings() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}admin_payment_settings.json`);\n        const data = await res.json();\n        if (data) {\n          ['kpay', 'wave', 'cb', 'aya'].forEach(k => {\n            if (data[k]) {\n              const idx = paymentMethods.findIndex(m => m.key === k);\n              if (idx !== -1) {\n                paymentMethods[idx].number = data[k].phone || paymentMethods[idx].number;\n                paymentMethods[idx].accountName = data[k].name || paymentMethods[idx].accountName;\n                paymentMethods[idx].status = data[k].status || paymentMethods[idx].status;\n                if (data[k].logo) paymentMethods[idx].logoImg = data[k].logo;\n                if (data[k].qr) paymentMethods[idx].qrImg = data[k].qr;\n              }\n            }\n          });\n        }\n      } catch (e) {}\n      renderPaymentAccounts();\n    }\n\n    function renderAllData() {\n      fetchCloudPaymentSettings();\n      fetchSlipsFromCloud();\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      renderAllData();\n      setInterval(fetchSlipsFromCloud, 10000);\n    });\n  <\/script>\n</body>\n</html>", "AEvent.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>Admin - Event & Seasons Manager (AEvent)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    /* Forced Desktop View Styles */\n    body.forced-desktop {\n      min-width: 1200px !important;\n      overflow-x: auto !important;\n    }\n    body.forced-desktop #desktopSidebar {\n      display: flex !important;\n    }\n    body.forced-desktop #mobileBottomBar {\n      display: none !important;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- ==================== TOAST ALERT ==================== -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-wand-magic-sparkles\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION (DESKTOP MODE) ==================== -->\n  <aside id=\"desktopSidebar\" class=\"w-64 bg-white dark:bg-[#080d19] border-r border-slate-200 dark:border-white/5 flex-col justify-between shrink-0 hidden lg:flex\">\n    <div>\n      <div class=\"px-6 py-5 flex items-center gap-3 border-b border-slate-200 dark:border-white/5\">\n        <div class=\"w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-400 text-slate-950 flex items-center justify-center text-lg shadow-lg font-black\">\n          🌼\n        </div>\n        <div>\n          <h1 class=\"text-base font-extrabold text-slate-900 dark:text-white tracking-wide\" id=\"sidebarBrandName\">GameAdmin</h1>\n          <p class=\"text-[10px] text-amber-500 font-mono\">Event Control</p>\n        </div>\n      </div>\n\n      <!-- Navigation Links: Banners (AImage) ကို Premium Emoji အထက်တွင် ထားရှိထားသည် -->\n      <nav class=\"p-4 space-y-1 text-xs font-semibold\">\n        <a href=\"admin.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-house text-sm w-4 text-center\"></i>\n          <span>Home Dashboard</span>\n        </a>\n        <a href=\"Aimage.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-images text-sm w-4 text-center text-sky-400\"></i>\n          <span>Banners (AImage)</span>\n        </a>\n        <a href=\"APremiumemoji.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-crown text-sm w-4 text-center text-amber-500\"></i>\n          <span>Premium Emoji (11 Tiers)</span>\n        </a>\n        <a href=\"APayment.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & Slips</span>\n        </a>\n        <a href=\"AEvent.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-amber-500 text-black shadow-lg font-bold transition\">\n          <i class=\"fa-solid fa-wand-magic-sparkles text-sm w-4 text-center\"></i>\n          <span>Events & Seasons (AEvent)</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders Management</span>\n        </a>\n        <a href=\"Asetting.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gear text-sm w-4 text-center\"></i>\n          <span>Settings</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"index.html\" target=\"_blank\" class=\"w-full py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-up-right-from-square text-xs text-amber-500\"></i>\n        <span>Live Index ကြည့်မည်</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN WORKSPACE ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll pb-20 lg:pb-6\">\n    \n    <!-- Top Header Bar -->\n    <header class=\"h-16 border-b border-slate-200 dark:border-white/5 bg-white/90 dark:bg-[#0a0f1d]/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30\">\n      <div class=\"flex items-center gap-3\">\n        <a href=\"admin.html\" class=\"lg:hidden w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-600 dark:text-slate-300\">\n          <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        </a>\n        <div>\n          <h2 class=\"text-sm font-extrabold text-slate-900 dark:text-white leading-tight\">Events & Seasons Manager</h2>\n          <span class=\"text-[10px] text-emerald-400 font-mono flex items-center gap-1\">\n            <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse\"></span> All-Users Cloud Sync\n          </span>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-2 sm:gap-3\">\n        <!-- Switcher: ဖုန်းဗားရှင်း / PC ဗားရှင်း -->\n        <button onclick=\"toggleDeviceLayout()\" id=\"deviceToggleBtn\" class=\"px-2.5 py-1.5 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-500 font-bold text-xs flex items-center gap-1.5 active:scale-95 transition\" title=\"ဗားရှင်းပြောင်းမည်\">\n          <i id=\"deviceToggleIcon\" class=\"fa-solid fa-desktop\"></i>\n          <span id=\"deviceToggleText\">PC ဗားရှင်း</span>\n        </button>\n\n        <!-- Dark / Light Toggle -->\n        <button onclick=\"toggleTheme()\" class=\"w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center active:scale-95 transition\">\n          <i id=\"themeToggleIcon\" class=\"fa-solid fa-moon text-blue-500\"></i>\n        </button>\n\n        <button onclick=\"saveActiveEventConfig()\" class=\"px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-black text-xs flex items-center gap-1.5 active:scale-95 transition shadow-md\">\n          <i class=\"fa-solid fa-cloud-arrow-up\"></i>\n          <span class=\"hidden sm:inline\">Save Cloud</span>\n        </button>\n      </div>\n    </header>\n\n    <!-- Main Content -->\n    <main class=\"p-4 sm:p-6 space-y-6 max-w-5xl\">\n\n      <!-- Active Mode Status Banner -->\n      <div class=\"p-5 rounded-3xl bg-slate-50 dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 flex items-center justify-between shadow-sm\">\n        <div class=\"flex items-center gap-3.5\">\n          <div class=\"w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-500 flex items-center justify-center text-2xl shadow-inner border border-amber-500/30\" id=\"currentModeIcon\">\n            🌼\n          </div>\n          <div>\n            <div class=\"flex items-center gap-2\">\n              <span class=\"text-xs font-bold text-slate-400\">လက်ရှိ ရွေးချယ်ထားသော Theme:</span>\n              <span class=\"px-2.5 py-0.5 rounded-full text-xs font-black uppercase bg-amber-500 text-black shadow-sm\" id=\"activeModeNameBadge\">\n                သင်္ကြန် ရေသဘင်\n              </span>\n            </div>\n            <p class=\"text-xs text-slate-500 dark:text-slate-400 mt-1\" id=\"activeModeDescText\">\n              User စာမျက်နှာ (index.html, payment.html, order.html, profile.html) အားလုံးတွင် Live အသက်ဝင်နေပါသည်\n            </p>\n          </div>\n        </div>\n      </div>\n\n      <!-- 5 Seasons Selection Cards -->\n      <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4\">\n        \n        <!-- 1. နွေရာသီ -->\n        <div onclick=\"selectEventMode('summer')\" id=\"card-summer\" class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 cursor-pointer transition relative flex flex-col justify-between space-y-3 hover:border-amber-400 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <span class=\"text-2xl\">🌴☀️</span>\n            <span class=\"status-indicator w-3 h-3 rounded-full border-2 border-slate-300 dark:border-white/20\"></span>\n          </div>\n          <div>\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">နွေရာသီ (Summer)</h4>\n            <p class=\"text-[10px] text-slate-400 mt-1\">အပူဒဏ်ပြေပျောက်စေမည့် နေရောင်ခြည် အလင်းမှုန်များ အပြင်အဆင်</p>\n          </div>\n        </div>\n\n        <!-- 2. မိုးရာသီ -->\n        <div onclick=\"selectEventMode('rainy')\" id=\"card-rainy\" class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 cursor-pointer transition relative flex flex-col justify-between space-y-3 hover:border-cyan-400 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <span class=\"text-2xl\">🌧️💧</span>\n            <span class=\"status-indicator w-3 h-3 rounded-full border-2 border-slate-300 dark:border-white/20\"></span>\n          </div>\n          <div>\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">မိုးရာသီ (Monsoon / Rain)</h4>\n            <p class=\"text-[10px] text-slate-400 mt-1\">စိမ်းလန်းစိုပြေသော မိုးပေါက်ကျဆင်းမှု သဘာဝဒီဇိုင်း</p>\n          </div>\n        </div>\n\n        <!-- 3. ဆောင်းရာသီ -->\n        <div onclick=\"selectEventMode('winter')\" id=\"card-winter\" class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 cursor-pointer transition relative flex flex-col justify-between space-y-3 hover:border-blue-400 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <span class=\"text-2xl\">❄️☃️</span>\n            <span class=\"status-indicator w-3 h-3 rounded-full border-2 border-slate-300 dark:border-white/20\"></span>\n          </div>\n          <div>\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">ဆောင်းရာသီ (Winter Frost)</h4>\n            <p class=\"text-[10px] text-slate-400 mt-1\">အေးမြသော နှင်းပွင့်စစ်စစ်များနှင့် ရေခဲစွယ် အပြင်အဆင်</p>\n          </div>\n        </div>\n\n        <!-- 4. သင်္ကြန် -->\n        <div onclick=\"selectEventMode('thingyan')\" id=\"card-thingyan\" class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 cursor-pointer transition relative flex flex-col justify-between space-y-3 hover:border-amber-400 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <span class=\"text-2xl\">🌼💦</span>\n            <span class=\"status-indicator w-3 h-3 rounded-full border-2 border-slate-300 dark:border-white/20\"></span>\n          </div>\n          <div>\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">သင်္ကြန်ပွဲတော် (Thingyan)</h4>\n            <p class=\"text-[10px] text-slate-400 mt-1\">ပိတောက်ပန်းဝါဝါနှင့် ရေပက်ဖျန်းမှု ပွဲတော်အပြင်အဆင်</p>\n          </div>\n        </div>\n\n        <!-- 5. သီတင်းကျွတ် -->\n        <div onclick=\"selectEventMode('thadingyut')\" id=\"card-thadingyut\" class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/5 cursor-pointer transition relative flex flex-col justify-between space-y-3 hover:border-amber-500 shadow-sm\">\n          <div class=\"flex items-center justify-between\">\n            <span class=\"text-2xl\">🏮🪔</span>\n            <span class=\"status-indicator w-3 h-3 rounded-full border-2 border-slate-300 dark:border-white/20\"></span>\n          </div>\n          <div>\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white\">သီတင်းကျွတ် (Thadingyut)</h4>\n            <p class=\"text-[10px] text-slate-400 mt-1\">ဆီမီးခွက်များ၊ ကြာပန်းနှင့် ကောင်းကင်မီးပုံးပျံများ</p>\n          </div>\n        </div>\n\n      </div>\n\n      <!-- SAVE BOTTOM BAR -->\n      <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm\">\n        <div class=\"text-xs text-slate-400 text-center sm:text-left\">\n          <span class=\"text-emerald-400 font-bold\"><i class=\"fa-solid fa-circle-check\"></i> Live Sync:</span> Save Cloud ခလုတ်ကို နှိပ်လိုက်ရုံဖြင့် အသုံးပြုသူအားလုံးထံတွင် ရာသီဥတု Animation နှင့် အပြင်အဆင် ချက်ချင်း ပြောင်းလဲသွားပါမည်။\n        </div>\n        <button onclick=\"saveActiveEventConfig()\" class=\"w-full sm:w-auto px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 text-black font-black text-xs shadow-lg shadow-amber-500/30 transition active:scale-95 flex items-center justify-center gap-2\">\n          <i class=\"fa-solid fa-floppy-disk\"></i>\n          <span>Theme အားလုံးထံ လွှင့်တင်သိမ်းဆည်းမည် (Save All)</span>\n        </button>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== MOBILE BOTTOM BAR ==================== -->\n  <nav id=\"mobileBottomBar\" class=\"fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 py-2.5 px-4 lg:hidden\">\n    <div class=\"max-w-md mx-auto flex items-center justify-around text-center\">\n      <a href=\"admin.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-500 transition\"><i class=\"fa-solid fa-house text-base\"></i><span class=\"text-[10px] font-semibold\">Home</span></a>\n      <a href=\"Aimage.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-500 transition\"><i class=\"fa-solid fa-images text-base\"></i><span class=\"text-[10px] font-semibold\">Banner</span></a>\n      <a href=\"APremiumemoji.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-500 transition\"><i class=\"fa-solid fa-crown text-base\"></i><span class=\"text-[10px] font-semibold\">Emoji</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-500 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"AEvent.html\" class=\"flex flex-col items-center gap-0.5 text-amber-500\"><i class=\"fa-solid fa-wand-magic-sparkles text-base\"></i><span class=\"text-[10px] font-bold\">Event</span></a>\n    </div>\n  </nav>\n\n  <!-- ==================== JAVASCRIPT LOGIC & FIREBASE SYNC ==================== -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n    const EVENT_CONFIG_KEY = 'site_event_theme_config';\n\n    let currentSelectedMode = 'thingyan';\n    let toastTimeout = null;\n\n    const MODE_DETAILS = {\n      summer: { name: \"နွေရာသီ (Summer)\", icon: \"🌴\", desc: \"နွေရာသီ နေရောင်ခြည် အလင်းမှုန်များ အပြင်အဆင်\" },\n      rainy: { name: \"မိုးရာသီ (Monsoon)\", icon: \"🌧️\", desc: \"စိမ်းလန်းစိုပြေသော မိုးပေါက်ကျဆင်းမှု သဘာဝဒီဇိုင်း\" },\n      winter: { name: \"ဆောင်းရာသီ (Winter)\", icon: \"❄️\", desc: \"အေးမြသော နှင်းပွင့်စစ်စစ်များနှင့် ရေခဲစွယ် အပြင်အဆင်\" },\n      thingyan: { name: \"သင်္ကြန်ပွဲတော် (Thingyan)\", icon: \"🌼\", desc: \"ပိတောက်ပန်းဝါဝါနှင့် ရေပက်ဖျန်းမှု ပွဲတော်အပြင်အဆင်\" },\n      thadingyut: { name: \"သီတင်းကျွတ် (Thadingyut)\", icon: \"🏮\", desc: \"ဆီမီးခွက်များ၊ ကြာပန်းနှင့် ကောင်းကင်မီးပုံးပျံများ\" }\n    };\n\n    // ------------------------------------------------------------\n    // ၁။ ဖုန်းဗားရှင်း / PC ဗားရှင်း ပြောင်းလဲမှု\n    // ------------------------------------------------------------\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n        showToast(\"ကွန်ပြူတာဗားရှင်း\", \"Desktop View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n        showToast(\"ဖုန်းဗားရှင်း\", \"Mobile View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      const target = current === 'mobile' ? 'desktop' : 'mobile';\n      applyDeviceLayout(target);\n    }\n\n    // ------------------------------------------------------------\n    // ၂။ THEME ENGINE (DARK / LIGHT)\n    // ------------------------------------------------------------\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n\n      const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      if (savedLayout === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    // ------------------------------------------------------------\n    // ၃။ TOAST ALERT\n    // ------------------------------------------------------------\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-wand-magic-sparkles';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    // ------------------------------------------------------------\n    // ၄။ EVENT MODES SELECTION & UI\n    // ------------------------------------------------------------\n    function selectEventMode(modeKey) {\n      currentSelectedMode = modeKey;\n      updateActiveModeUI(modeKey);\n      showToast('ရွေးချယ်ပြီး', `${MODE_DETAILS[modeKey].name} ကို ရွေးချယ်ထားပါသည် (Save Cloud နှိပ်ပါက အသက်ဝင်မည်)`, 'info');\n    }\n\n    function updateActiveModeUI(modeKey) {\n      const meta = MODE_DETAILS[modeKey] || MODE_DETAILS.thingyan;\n      document.getElementById('currentModeIcon').innerText = meta.icon;\n      document.getElementById('activeModeNameBadge').innerText = meta.name;\n      document.getElementById('activeModeDescText').innerText = meta.desc;\n\n      ['summer', 'rainy', 'winter', 'thingyan', 'thadingyut'].forEach(k => {\n        const card = document.getElementById(`card-${k}`);\n        if (!card) return;\n        const indicator = card.querySelector('.status-indicator');\n\n        if (k === modeKey) {\n          card.classList.add('ring-2', 'ring-amber-400', 'border-amber-400');\n          if (indicator) indicator.className = 'status-indicator w-3.5 h-3.5 rounded-full bg-emerald-500 ring-2 ring-emerald-400 animate-pulse';\n        } else {\n          card.classList.remove('ring-2', 'ring-amber-400', 'border-amber-400');\n          if (indicator) indicator.className = 'status-indicator w-3 h-3 rounded-full border-2 border-slate-300 dark:border-white/20';\n        }\n      });\n    }\n\n    // ------------------------------------------------------------\n    // ၅။ FIREBASE REALTIME CLOUD SYNC\n    // ------------------------------------------------------------\n    async function fetchActiveEventFromCloud() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}active_season.json`);\n        const data = await res.json();\n        if (data && MODE_DETAILS[data]) {\n          currentSelectedMode = data;\n          localStorage.setItem(EVENT_CONFIG_KEY, JSON.stringify({ activeMode: data }));\n        } else {\n          const raw = localStorage.getItem(EVENT_CONFIG_KEY);\n          if (raw) {\n            const parsed = JSON.parse(raw);\n            if (parsed.activeMode && MODE_DETAILS[parsed.activeMode]) {\n              currentSelectedMode = parsed.activeMode;\n            }\n          }\n        }\n      } catch (e) {\n        const raw = localStorage.getItem(EVENT_CONFIG_KEY);\n        if (raw) {\n          try {\n            const parsed = JSON.parse(raw);\n            if (parsed.activeMode && MODE_DETAILS[parsed.activeMode]) {\n              currentSelectedMode = parsed.activeMode;\n            }\n          } catch(err) {}\n        }\n      }\n      updateActiveModeUI(currentSelectedMode);\n    }\n\n    async function saveActiveEventConfig() {\n      try {\n        await fetch(`${FIREBASE_DB_URL}active_season.json`, {\n          method: 'PUT',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(currentSelectedMode)\n        });\n\n        localStorage.setItem(EVENT_CONFIG_KEY, JSON.stringify({ activeMode: currentSelectedMode }));\n        localStorage.setItem('home_saved_season', currentSelectedMode);\n\n        showToast('အောင်မြင်ပါသည်', `User စာမျက်နှာအားလုံးတွင် \"${MODE_DETAILS[currentSelectedMode].name}\" သို့ Live ပြောင်းလဲလိုက်ပါပြီ`);\n      } catch (e) {\n        showToast('အမှား', 'Cloud ပေါ်သို့ သိမ်းဆည်းမှု မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    // Platform Brand Sync\n    async function syncPlatformName() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}site_platform_config.json`);\n        const data = await res.json();\n        if (data && data.name) {\n          document.getElementById('sidebarBrandName').innerText = data.name;\n        }\n      } catch (e) {}\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      syncPlatformName();\n      fetchActiveEventFromCloud();\n    });\n  <\/script>\n</body>\n</html>", "AGame.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Admin - Games Hub (AGame)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons CDN -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n\n  <!-- Google Fonts CDN -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- ==================== 1. TOAST NOTIFICATION ALERT ==================== -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-
