-xs flex items-center gap-1.5 transition shadow\">\n          <i class=\"fa-solid fa-rotate-right text-xs\"></i>\n          <span class=\"hidden sm:inline\">Refresh</span>\n        </button>\n      </div>\n    </header>\n\n    <!-- Main Content -->\n    <main class=\"p-4 sm:p-6 space-y-6 max-w-4xl\">\n\n      <!-- 1. BRAND NAME & LOGO MANAGER (GALLERY UPLOAD INCLUDED) -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-4 shadow-sm\">\n        <div class=\"flex items-center gap-2 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <i class=\"fa-solid fa-image text-emerald-500\"></i>\n          <h3 class=\"text-xs font-black text-slate-900 dark:text-white\">Brand Name & Platform Logo (အမည်နှင့် Logo ပုံ)</h3>\n        </div>\n\n        <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-4 items-center\">\n          <!-- Logo Preview Box -->\n          <div class=\"flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-50 dark:bg-black/30 border border-slate-200 dark:border-white/10 space-y-2\">\n            <div class=\"w-20 h-20 rounded-2xl overflow-hidden bg-slate-800 border-2 border-blue-500/40 relative group cursor-pointer\" onclick=\"document.getElementById('siteLogoInput').click()\" title=\"Gallery မှ ပုံတင်ရန် နှိပ်ပါ\">\n              <img id=\"brandLogoPreview\" src=\"\" class=\"w-full h-full object-cover hidden\" alt=\"Logo\">\n              <div id=\"brandLogoPlaceholder\" class=\"w-full h-full flex flex-col items-center justify-center text-slate-400 group-hover:text-blue-400\">\n                <i class=\"fa-solid fa-camera text-xl\"></i>\n                <span class=\"text-[9px] mt-1 font-bold\">Logo တင်မည်</span>\n              </div>\n            </div>\n            <input type=\"file\" id=\"siteLogoInput\" accept=\"image/*\" class=\"hidden\" onchange=\"handleLogoGalleryUpload(event)\">\n            <button type=\"button\" onclick=\"document.getElementById('siteLogoInput').click()\" class=\"text-[10px] text-blue-500 font-bold hover:underline\">\n              Gallery မှ Logo ရွေးမည်\n            </button>\n          </div>\n\n          <!-- Text Inputs -->\n          <div class=\"sm:col-span-2 space-y-3 text-xs\">\n            <div>\n              <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ဝက်ဘ်ဆိုက်အမည် (Platform Title):</label>\n              <input type=\"text\" id=\"siteNameInput\" placeholder=\"KAVXY\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-bold outline-none focus:border-blue-500\">\n            </div>\n\n            <div>\n              <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">သို့မဟုတ် Logo ဓာတ်ပုံ Link (Image URL):</label>\n              <input type=\"text\" id=\"siteLogoUrlInput\" placeholder=\"https://...\" oninput=\"previewLogoFromUrl(this.value)\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-blue-500 font-mono text-xs\">\n            </div>\n          </div>\n        </div>\n\n        <button onclick=\"saveBrandSettingsCloud()\" class=\"w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xs transition active:scale-95 shadow\">\n          <i class=\"fa-solid fa-floppy-disk mr-1\"></i> Logo နှင့် အမည် Cloud ပေါ် သိမ်းမည် (User အားလုံးထံ ချက်ချင်းပြောင်းမည်)\n        </button>\n      </div>\n\n      <!-- 2. VERSION UPDATE PUSHER (DOWNLOAD PROGRESS BAR) -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"flex items-center gap-2 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <i class=\"fa-solid fa-cloud-arrow-down text-sky-400\"></i>\n          <h3 class=\"text-xs font-black text-slate-900 dark:text-white\">Version Update Pusher (All Users ထံသို့ Update Bar လွှင့်တင်ရန်)</h3>\n        </div>\n\n        <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs\">\n          <div>\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ဗားရှင်းအသစ် နံပါတ်:</label>\n            <input type=\"text\" id=\"appVersionInput\" placeholder=\"1.0.1\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono font-bold outline-none focus:border-sky-500\">\n          </div>\n          <div class=\"sm:col-span-2\">\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">Update စာတန်း:</label>\n            <input type=\"text\" id=\"appUpdateMsgInput\" placeholder=\"ပိုမိုကောင်းမွန်သော စနစ်သစ်သို့ ကူးပြောင်းရန် ဒေါင်းလုဒ်ရယူပါ။\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-sky-500\">\n          </div>\n        </div>\n\n        <button onclick=\"pushVersionUpdateCloud()\" class=\"w-full py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 text-white font-black text-xs transition active:scale-95 shadow\">\n          <i class=\"fa-solid fa-rocket mr-1\"></i> Version Update အား All Users ထံ ချက်ချင်းလွှင့်မည်\n        </button>\n      </div>\n\n      <!-- 3. PRE-MAINTENANCE PASSCODE & NOTICE -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"flex items-center gap-2 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <i class=\"fa-solid fa-key text-amber-500\"></i>\n          <h3 class=\"text-xs font-black text-slate-900 dark:text-white\">Admin Passcode & Maintenance စာတန်း</h3>\n        </div>\n\n        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n          <div>\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">Admin ဝင်စစ်ရန် Secret Passcode:</label>\n            <input type=\"text\" id=\"adminSecretPassInput\" value=\"admin777\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono font-bold outline-none focus:border-amber-500\">\n          </div>\n          <div>\n            <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ပြီးစီးမည့် ခန့်မှန်းရက်/အချိန်:</label>\n            <input type=\"text\" id=\"maintTimeInput\" placeholder=\"ဥပမာ: 08:30 PM (MST)\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-amber-500\">\n          </div>\n        </div>\n\n        <div class=\"text-xs\">\n          <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">User ထံ ပြသမည့် အသိပေးစာသား:</label>\n          <textarea id=\"maintMsgInput\" rows=\"2\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-amber-500\">ဆာဗာအား ခေတ္တ ပြင်ဆင်ထိန်းသိမ်းနေပါသည်။ မကြာမီ ပြန်လည်ဖွင့်လှစ်ပေးပါမည်။</textarea>\n        </div>\n\n        <button onclick=\"saveMaintenanceSettingsCloud()\" class=\"w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-black font-black text-xs transition active:scale-95 shadow\">\n          <i class=\"fa-solid fa-floppy-disk mr-1\"></i> Maintenance အချက်အလက်များ သိမ်းဆည်းမည်\n        </button>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== MOBILE BOTTOM BAR ==================== -->\n  <nav id=\"mobileBottomBar\" class=\"fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 py-2.5 px-4 lg:hidden\">\n    <div class=\"max-w-md mx-auto flex items-center justify-around text-center\">\n      <a href=\"admin.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-house text-base\"></i><span class=\"text-[10px] font-semibold\">Home</span></a>\n      <a href=\"Aimage.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-images text-base\"></i><span class=\"text-[10px] font-semibold\">Banner</span></a>\n      <a href=\"APremiumemoji.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-crown text-base\"></i><span class=\"text-[10px] font-semibold\">Emoji</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"Asetting.html\" class=\"flex flex-col items-center gap-0.5 text-blue-500\"><i class=\"fa-solid fa-gear text-base\"></i><span class=\"text-[10px] font-bold\">Settings</span></a>\n    </div>\n  </nav>\n\n  <!-- ==================== JAVASCRIPT LOGIC & FIREBASE SYNC ==================== -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n\n    let currentLogoBase64 = null;\n    let toastTimeout = null;\n\n    // ------------------------------------------------------------\n    // ၁။ ဖုန်းဗားရှင်း / PC ဗားရှင်း ပြောင်းလဲမှု\n    // ------------------------------------------------------------\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n        showToast(\"ကွန်ပြူတာဗားရှင်း\", \"Desktop View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n        showToast(\"ဖုန်းဗားရှင်း\", \"Mobile View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      const target = current === 'mobile' ? 'desktop' : 'mobile';\n      applyDeviceLayout(target);\n    }\n\n    // ------------------------------------------------------------\n    // ၂။ THEME ENGINE (DARK / LIGHT)\n    // ------------------------------------------------------------\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n\n      const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      if (savedLayout === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    // ------------------------------------------------------------\n    // ၃။ TOAST ALERT\n    // ------------------------------------------------------------\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    // ------------------------------------------------------------\n    // ၄။ LOGO GALLERY UPLOAD & COMPRESSION\n    // ------------------------------------------------------------\n    function handleLogoGalleryUpload(event) {\n      const file = event.target.files[0];\n      if (!file) return;\n\n      const reader = new FileReader();\n      reader.onload = function(e) {\n        const img = new Image();\n        img.onload = function() {\n          const canvas = document.createElement('canvas');\n          const size = 180;\n          canvas.width = size;\n          canvas.height = size;\n          const ctx = canvas.getContext('2d');\n          ctx.drawImage(img, 0, 0, size, size);\n\n          currentLogoBase64 = canvas.toDataURL('image/png', 0.9);\n          setLogoPreview(currentLogoBase64);\n          document.getElementById('siteLogoUrlInput').value = '';\n          showToast(\"Logo ရွေးချယ်ပြီး\", \"Gallery မှ ပုံကို ရွေးချယ်ပြီးပါပြီ။ Cloud သိမ်းဆည်းရန် Save နှိပ်ပါ\", \"success\");\n        };\n        img.src = e.target.result;\n      };\n      reader.readAsDataURL(file);\n    }\n\n    function previewLogoFromUrl(url) {\n      if (url && url.trim() !== '') {\n        currentLogoBase64 = url.trim();\n        setLogoPreview(currentLogoBase64);\n      }\n    }\n\n    function setLogoPreview(src) {\n      const preview = document.getElementById('brandLogoPreview');\n      const placeholder = document.getElementById('brandLogoPlaceholder');\n      if (src && src.trim() !== '') {\n        preview.src = src;\n        preview.classList.remove('hidden');\n        placeholder.classList.add('hidden');\n      } else {\n        preview.classList.add('hidden');\n        placeholder.classList.remove('hidden');\n      }\n    }\n\n    // ------------------------------------------------------------\n    // ၅။ FIREBASE CLOUD SAVE & FETCH FUNCTIONS\n    // ------------------------------------------------------------\n    async function loadAllSettingsFromCloud() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}.json`);\n        const data = await res.json();\n        if (!data) return;\n\n        // Platform Brand & Logo\n        if (data.site_platform_config) {\n          const cfg = data.site_platform_config;\n          document.getElementById('siteNameInput').value = cfg.name || 'KAVXY';\n          document.getElementById('sidebarBrandName').innerText = cfg.name || 'GameAdmin';\n          if (cfg.logo) {\n            currentLogoBase64 = cfg.logo;\n            setLogoPreview(cfg.logo);\n            if (!cfg.logo.startsWith('data:image')) {\n              document.getElementById('siteLogoUrlInput').value = cfg.logo;\n            }\n          }\n        }\n\n        // Version Config\n        if (data.app_version_config) {\n          document.getElementById('appVersionInput').value = data.app_version_config.latestVersion || '1.0.0';\n          document.getElementById('appUpdateMsgInput').value = data.app_version_config.updateMessage || '';\n        }\n\n        // Maintenance Settings\n        if (data.maint_admin_pass) {\n          document.getElementById('adminSecretPassInput').value = data.maint_admin_pass;\n        }\n        if (data.maint_est_time) {\n          document.getElementById('maintTimeInput').value = data.maint_est_time;\n        }\n        if (data.site_maintenance_msg) {\n          document.getElementById('maintMsgInput').value = data.site_maintenance_msg;\n        }\n\n      } catch (err) {}\n    }\n\n    async function saveBrandSettingsCloud() {\n      const name = document.getElementById('siteNameInput').value.trim() || 'KAVXY';\n      const logo = currentLogoBase64 || document.getElementById('siteLogoUrlInput').value.trim() || '';\n\n      const config = { name: name, logo: logo };\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}site_platform_config.json`, {\n          method: 'PUT',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(config)\n        });\n\n        localStorage.setItem('site_platform_config', JSON.stringify(config));\n        document.getElementById('sidebarBrandName').innerText = name;\n        showToast(\"အောင်မြင်ပါသည်\", \"Logo နှင့် Platform အမည်ကို Cloud ပေါ်သို့ သိမ်းဆည်းပြီးပါပြီ (User အားလုံးထံ ချက်ချင်းပြောင်းမည်)\");\n      } catch (e) {\n        showToast(\"အမှား\", \"သိမ်းဆည်းမှု မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    async function pushVersionUpdateCloud() {\n      const ver = document.getElementById('appVersionInput').value.trim();\n      const msg = document.getElementById('appUpdateMsgInput').value.trim();\n\n      if (!ver) return alert(\"ဗားရှင်းနံပါတ် ရိုက်ထည့်ပေးပါ\");\n\n      const updateConfig = {\n        latestVersion: ver,\n        updateMessage: msg || \"ပိုမိုကောင်းမွန်မြန်ဆန်သော စနစ်သစ်သို့ အဆင့်မြှင့်တင်ရန် ဒေါင်းလုဒ်ရယူပါ။\"\n      };\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}app_version_config.json`, {\n          method: 'PUT',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(updateConfig)\n        });\n\n        showToast(\"Update လွှင့်ပြီး\", `All Users ထံ Version ${ver} Alert ပေါ်သွားပါပြီ`);\n      } catch (e) {\n        showToast(\"အမှား\", \"လွှင့်တင်မှု မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    async function saveMaintenanceSettingsCloud() {\n      const pass = document.getElementById('adminSecretPassInput').value.trim() || 'admin777';\n      const time = document.getElementById('maintTimeInput').value.trim();\n      const msg = document.getElementById('maintMsgInput').value.trim();\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}maint_admin_pass.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pass) });\n        await fetch(`${FIREBASE_DB_URL}maint_est_time.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(time) });\n        await fetch(`${FIREBASE_DB_URL}site_maintenance_msg.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });\n\n        localStorage.setItem('maint_admin_pass', pass);\n        localStorage.setItem('maint_est_time', time);\n        localStorage.setItem('site_maintenance_msg', msg);\n\n        showToast(\"အောင်မြင်ပါသည်\", \"Maintenance အချက်အလက်များကို သိမ်းဆည်းပြီးပါပြီ\");\n      } catch (e) {\n        showToast(\"အမှား\", \"သိမ်းဆည်းမှု မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      loadAllSettingsFromCloud();\n    });\n  <\/script>\n</body>\n</html>", "AMlbb.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n  <title>Admin - MLBB Price & Package Manager</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },\n            admin: { 500: '#6366f1', 600: '#4f46e5' },\n            reseller: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons CDN -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n\n  <!-- Google Fonts CDN -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body { font-family: 'Outfit', 'Padauk', sans-serif; -webkit-tap-highlight-color: transparent; }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#090d16] text-slate-800 dark:text-gray-100 min-h-screen transition-colors duration-300 pb-20 select-none\">\n\n  <!-- TOAST ALERT -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4\">\n    <div class=\"flex items-center gap-3 p-4 rounded-2xl bg-white dark:bg-[#131b2e] border border-brand-500 shadow-2xl\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-circle-check\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-sm font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-xs text-slate-500 dark:text-gray-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- HEADER -->\n  <header class=\"sticky top-0 z-30 bg-white/90 dark:bg-[#090d16]/90 backdrop-blur-md border-b border-slate-200 dark:border-white/10 px-4 py-3\">\n    <div class=\"max-w-md mx-auto flex items-center justify-between\">\n      <div class=\"flex items-center gap-2\">\n        <a href=\"admin.html\" class=\"w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-600 dark:text-gray-300 active:scale-95 transition\">\n          <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        </a>\n        <div class=\"flex items-center gap-2\">\n          <div class=\"w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xs font-black shadow-md\">ML</div>\n          <div>\n            <h1 class=\"font-extrabold text-sm tracking-wide text-blue-500 block leading-tight\">MLBB Package & Price</h1>\n            <span class=\"text-[9px] text-slate-400 font-mono\">Custom Coin Cost & Packages</span>\n          </div>\n        </div>\n      </div>\n      <div class=\"flex items-center gap-2\">\n        <button onclick=\"toggleThemeManual()\" class=\"w-9 h-9 rounded-xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-700 dark:text-gray-200 active:scale-95 transition\">\n          <i id=\"themeIcon\" class=\"fa-solid fa-moon text-sm\"></i>\n        </button>\n        <a href=\"admin.html\" class=\"px-2.5 py-1.5 rounded-xl bg-admin-500/10 text-admin-500 border border-admin-500/20 text-xs font-bold hover:bg-admin-500 hover:text-white transition\">Admin Hub</a>\n      </div>\n    </div>\n  </header>\n\n  <!-- MAIN CONTENT -->\n  <main class=\"max-w-md mx-auto px-4 pt-4 space-y-4\">\n\n    <!-- 1. PACKAGE FORM (ADD & EDIT WITH CUSTOM COIN COST) -->\n    <div class=\"bg-white dark:bg-[#131b2e] border border-slate-200/80 dark:border-white/5 rounded-[26px] p-4 shadow-sm space-y-3\">\n      <div class=\"flex items-center justify-between\">\n        <h3 class=\"text-xs font-bold text-slate-800 dark:text-gray-200 flex items-center gap-1.5\" id=\"formHeaderTitle\">\n          <i class=\"fa-solid fa-circle-plus text-blue-500\"></i> Package အသစ်ထည့်သွင်းရန်\n        </h3>\n        <button id=\"cancelEditBtn\" onclick=\"resetPackageForm()\" class=\"text-[10px] text-rose-500 font-bold hover:underline hidden\">\n          မလုပ်တော့ပါ (Cancel)\n        </button>\n      </div>\n\n      <div class=\"space-y-2 text-xs\">\n        <div class=\"grid grid-cols-2 gap-2\">\n          <div>\n            <label class=\"block text-[11px] font-semibold text-slate-500 mb-1\">အမျိုးအစား (Category)</label>\n            <select id=\"inputPkgCat\" class=\"w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] text-slate-700 dark:text-gray-200 focus:outline-none focus:border-blue-500\">\n              <option value=\"double\">Double 2×</option>\n              <option value=\"standard\">Diamond Package</option>\n              <option value=\"pass\">Weekly Pass</option>\n            </select>\n          </div>\n          <div>\n            <label class=\"block text-[11px] font-semibold text-slate-500 mb-1\">Tag / အမှတ်အသား</label>\n            <input type=\"text\" id=\"inputPkgBadge\" placeholder=\"ဥပမာ: 2X BONUS / HOT\" class=\"w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03]\">\n          </div>\n        </div>\n\n        <div>\n          <label class=\"block text-[11px] font-semibold text-slate-500 mb-1\">Package အမည်</label>\n          <input type=\"text\" id=\"inputPkgTitle\" placeholder=\"ဥပမာ: 50 + 50 Diamonds\" class=\"w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] font-bold\">\n        </div>\n\n        <div class=\"grid grid-cols-2 gap-2\">\n          <div>\n            <label class=\"block text-[11px] font-semibold text-slate-500 mb-1\">စုစုပေါင်းစိန် (Total)</label>\n            <input type=\"text\" id=\"inputPkgTotal\" placeholder=\"ဥပမာ: 100 💎\" class=\"w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03]\">\n          </div>\n          <div>\n            <label class=\"block text-[11px] font-semibold text-slate-500 mb-1\">Coin အရင်းတန်ဖိုး (Coin Cost)</label>\n            <input type=\"number\" id=\"inputPkgCoin\" step=\"0.1\" min=\"0\" placeholder=\"ဥပမာ: 39\" class=\"w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] font-bold text-amber-500 focus:outline-none focus:border-amber-500\">\n          </div>\n        </div>\n\n        <p class=\"text-[10px] text-slate-400\">\n          * ရောင်းစျေးများကို Admin ၏ 1 Coin စျေးနှုန်းအတိုင်း အလိုအလျောက် တွက်ချက်ပေးပါမည်။ အမြတ် 0 ထားပါက အရင်းစျေးအတိုင်း ရောင်းစျေးဖြစ်ပါမည်။\n        </p>\n      </div>\n\n      <button onclick=\"saveCustomPackage()\" id=\"savePackageBtn\" class=\"w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-1.5 active:scale-95\">\n        <i class=\"fa-solid fa-floppy-disk\"></i> Package အသစ် သိမ်းဆည်းမည်\n      </button>\n    </div>\n\n    <!-- Package backup / import -->\n    <section class=\"bg-white dark:bg-[#131b2e] border border-slate-200 dark:border-white/10 rounded-[26px] p-4 space-y-3\">\n      <h3 class=\"text-xs font-bold\"><i class=\"fa-solid fa-file-arrow-up text-blue-500\"></i> MLBB Package ဖိုင် ထည့်ရန် / သိမ်းရန်</h3>\n      <p class=\"text-[11px] text-slate-500 dark:text-slate-400\">JSON ဖိုင်ဖြင့် Package စာရင်းကို Import လုပ်နိုင်ပြီး Backup ပြန်ထုတ်နိုင်ပါသည်။ Import လုပ်လျှင် လက်ရှိစာရင်းကို အစားထိုးပါမည်။</p>\n      <input id=\"mlbbImportFile\" type=\"file\" accept=\".json,application/json\" class=\"block w-full text-xs text-slate-500 file:mr-3 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white file:px-3 file:py-2\" />\n      <div class=\"grid grid-cols-2 gap-2\">\n        <button type=\"button\" onclick=\"importMlbbFile()\" class=\"rounded-xl bg-blue-600 py-2.5 text-white font-bold text-xs\">ဖိုင်ထည့်မည်</button>\n        <button type=\"button\" onclick=\"exportMlbbFile()\" class=\"rounded-xl bg-emerald-600 py-2.5 text-white font-bold text-xs\">Backup ထုတ်မည်</button>\n      </div>\n    </section>\n\n    <!-- 2. ROLE VIEW SWITCHER & CATEGORY TABS -->\n    <div class=\"space-y-2\">\n      <!-- Role Switcher -->\n      <div class=\"grid grid-cols-2 gap-2\">\n        <button onclick=\"switchRoleView('user')\" id=\"btnViewUser\" class=\"py-2 rounded-xl bg-brand-500 text-white text-xs font-bold transition flex items-center justify-center gap-1.5 shadow\">\n          <i class=\"fa-solid fa-user text-[11px]\"></i> User စျေး (လက်လီ)\n        </button>\n        <button onclick=\"switchRoleView('reseller')\" id=\"btnViewReseller\" class=\"py-2 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-500 dark:text-gray-400 text-xs font-bold transition flex items-center justify-center gap-1.5\">\n          <i class=\"fa-solid fa-crown text-[11px] text-reseller-500\"></i> Reseller စျေး (VIP)\n        </button>\n      </div>\n\n      <!-- Category Filter Tabs -->\n      <div class=\"flex items-center gap-1.5 p-1 bg-slate-200/60 dark:bg-white/5 rounded-2xl border border-slate-300/40 dark:border-white/5 text-xs font-bold\">\n        <button onclick=\"switchCategory('double')\" id=\"tabDouble\" class=\"flex-1 py-1.5 rounded-xl bg-white dark:bg-[#131b2e] text-blue-500 shadow-sm transition\">Double 2×</button>\n        <button onclick=\"switchCategory('standard')\" id=\"tabStandard\" class=\"flex-1 py-1.5 rounded-xl text-slate-500 dark:text-gray-400 hover:text-white transition\">Diamond Packages</button>\n        <button onclick=\"switchCategory('pass')\" id=\"tabPass\" class=\"flex-1 py-1.5 rounded-xl text-slate-500 dark:text-gray-400 hover:text-white transition\">Weekly Pass</button>\n      </div>\n    </div>\n\n    <!-- 3. PACKAGES LIST CONTAINER -->\n    <div class=\"space-y-2.5\" id=\"packagesContainer\"></div>\n\n  </main>\n\n  <script>\n    const MLBB_PRICE_KEY = 'mlbb_price_list_db';\n\n    // မူလသတ်မှတ်ထားသော တရားဝင် PACKAGES\n    const DEFAULT_PACKAGES = [\n      { id: 101, category: 'double', title: '50 + 50 Diamonds', total: '100 💎', bonus: 'Double 2× Event', coinCost: 39, badge: '2X BONUS' },\n      { id: 102, category: 'double', title: '150 + 150 Diamonds', total: '300 💎', bonus: 'Double 2× Event', coinCost: 166.9, badge: '2X BONUS' },\n      { id: 103, category: 'double', title: '250 + 250 Diamonds', total: '500 💎', bonus: 'Double 2× Event', coinCost: 176.7, badge: '2X BONUS' },\n      { id: 104, category: 'double', title: '500 + 500 Diamonds', total: '1000 💎', bonus: 'Double 2× Event', coinCost: 565, badge: 'BEST VALUE' },\n\n      { id: 201, category: 'standard', title: '50 + 5 Diamonds', total: '55 💎', bonus: '+5 Bonus', coinCost: 39, badge: 'POPULAR' },\n      { id: 202, category: 'standard', title: '78 + 8 Diamonds', total: '86 💎', bonus: '+8 Bonus', coinCost: 61.5, badge: 'HOT' },\n      { id: 203, category: 'standard', title: '156 + 16 Diamonds', total: '172 💎', bonus: '+16 Bonus', coinCost: 122, badge: '' },\n      { id: 204, category: 'standard', title: '234 + 23 Diamonds', total: '257 💎', bonus: '+23 Bonus', coinCost: 176.7, badge: '' },\n      { id: 205, category: 'standard', title: '625 + 81 Diamonds', total: '706 💎', bonus: '+81 Bonus', coinCost: 480, badge: 'BEST VALUE' },\n      { id: 206, category: 'standard', title: '1860 + 335 Diamonds', total: '2195 💎', bonus: '+335 Bonus', coinCost: 1453, badge: '' },\n      { id: 207, category: 'standard', title: '3099 + 589 Diamonds', total: '3688 💎', bonus: '+589 Bonus', coinCost: 2424, badge: '' },\n      { id: 208, category: 'standard', title: '4649 + 883 Diamonds', total: '5532 💎', bonus: '+883 Bonus', coinCost: 3660, badge: '' },\n      { id: 209, category: 'standard', title: '7740 + 1548 Diamonds', total: '9288 💎', bonus: '+1548 Bonus', coinCost: 6079, badge: 'VIP MEGA' },\n\n      { id: 301, category: 'pass', title: 'Weekly Diamond Pass', total: '1 Week Pass', bonus: 'Daily Claims (Total 220 💎)', coinCost: 76, badge: 'MOST POPULAR' }\n    ];\n\n    let currentRole = 'user';\n    let currentCategory = 'double';\n    let editingPackageId = null;\n\n    function getStoredPackages() {\n      const raw = localStorage.getItem(MLBB_PRICE_KEY);\n      if (raw) {\n        try {\n          const parsed = JSON.parse(raw);\n          if (Array.isArray(parsed)) return validateMlbbPackages(parsed);\n        } catch (e) {}\n      }\n      localStorage.setItem(MLBB_PRICE_KEY, JSON.stringify(DEFAULT_PACKAGES));\n      return DEFAULT_PACKAGES;\n    }\n\n    // 0 ထားပါက အရင်းအတိုင်းတွက်ချက်ပေးမည့် ENGINE\n    function calculatePrice(coins, targetRole) {\n      const savedRate = Number(localStorage.getItem('admin_base_coin_rate'));\n      const baseRate = Number.isFinite(savedRate) && savedRate > 0 ? savedRate : 75;\n      const profitType = localStorage.getItem('admin_profit_type') || 'percent';\n      const userMargin = parseFloat(localStorage.getItem('admin_user_profit_margin')) || 0;\n      const resellerMargin = parseFloat(localStorage.getItem('admin_reseller_profit_margin')) || 0;\n\n      const margin = targetRole === 'reseller' ? resellerMargin : userMargin;\n      const baseCost = coins * baseRate;\n\n      // အကယ်၍ margin = 0 ဖြစ်နေပါက အရင်းစျေးအတိုင်း သတ်မှတ်မည်\n      if (margin === 0) {\n        return Math.ceil(baseCost / 100) * 100;\n      }\n\n      let finalPrice = baseCost;\n      if (profitType === 'percent') {\n        finalPrice = baseCost + (baseCost * (margin / 100));\n      } else {\n        finalPrice = baseCost + margin;\n      }\n      return Math.ceil(finalPrice / 100) * 100;\n    }\n\n    function switchRoleView(role) {\n      currentRole = role;\n      document.getElementById('btnViewUser').className = role === 'user' \n        ? 'py-2 rounded-xl bg-brand-500 text-white text-xs font-bold transition flex items-center justify-center gap-1.5 shadow'\n        : 'py-2 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-500 dark:text-gray-400 text-xs font-bold transition flex items-center justify-center gap-1.5';\n\n      document.getElementById('btnViewReseller').className = role === 'reseller'\n        ? 'py-2 rounded-xl bg-reseller-500 text-black text-xs font-bold transition flex items-center justify-center gap-1.5 shadow'\n        : 'py-2 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-500 dark:text-gray-400 text-xs font-bold transition flex items-center justify-center gap-1.5';\n\n      renderPackages();\n    }\n\n    function switchCategory(cat) {\n      currentCategory = cat;\n      ['double', 'standard', 'pass'].forEach(c => {\n        const btn = document.getElementById(`tab${c.charAt(0).toUpperCase() + c.slice(1)}`);\n        if (c === cat) {\n          btn.className = 'flex-1 py-1.5 rounded-xl bg-white dark:bg-[#131b2e] text-blue-500 shadow-sm transition';\n        } else {\n          btn.className = 'flex-1 py-1.5 rounded-xl text-slate-500 dark:text-gray-400 hover:text-white transition';\n        }\n      });\n      renderPackages();\n    }\n\n    function escapeMlbbHtml(value) {\n      return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n    }\n\n    function validateMlbbPackages(data) {\n      if (!Array.isArray(data) || data.length > 1000) throw new Error('JSON ဖိုင်ထဲတွင် Package စာရင်း မမှန်ပါ');\n      const ids = new Set();\n      return data.map((p, i) => {\n        if (!p || typeof p !== 'object' || !['double','standard','pass'].includes(p.category)) throw new Error('Package category မမှန်ပါ (row ' + (i + 1) + ')');\n        const title = String(p.title ?? '').trim(), total = String(p.total ?? '').trim();\n        const coinCost = Number(p.coinCost);\n        if (!title || !total || title.length > 150 || total.length > 150 || !Number.isFinite(coinCost) || coinCost < 0) throw new Error('Package အချက်အလက် မမှန်ပါ (row ' + (i + 1) + ')');\n        let id = Number(p.id);\n        if (!Number.isSafeInteger(id) || id <= 0 || ids.has(id)) id = Date.now() + i;\n        while (ids.has(id)) id++;\n        ids.add(id);\n        return { id, category:p.category, title, total, coinCost, badge:String(p.badge ?? '').slice(0,80), bonus:String(p.bonus ?? '').slice(0,150) };\n      });\n    }\n\n    async function importMlbbFile() {\n      const file = document.getElementById('mlbbImportFile').files[0];\n      if (!file) return showAlert('ဖိုင်ရွေးပါ', 'JSON ဖိုင်တစ်ခု အရင်ရွေးပါ', 'error');\n      if (file.size > 2 * 1024 * 1024) return showAlert('ဖိုင်ကြီးနေသည်', '2 MB အောက် JSON ဖိုင်ရွေးပါ', 'error');\n      try {\n        const packages = validateMlbbPackages(JSON.parse(await file.text()));\n        if (!confirm(`Package ${packages.length} ခုဖြင့် လက်ရှိစာရင်းကို အစားထိုးမလား?`)) return;\n        localStorage.setItem(MLBB_PRICE_KEY, JSON.stringify(packages));\n        resetPackageForm(); renderPackages();\n        document.getElementById('mlbbImportFile').value = '';\n        showAlert('အောင်မြင်ပါသည်', `Package ${packages.length} ခု Import လုပ်ပြီးပါပြီ`);\n      } catch (err) { showAlert('Import မအောင်မြင်ပါ', err.message || 'JSON ဖိုင်ကို စစ်ဆေးပါ', 'error'); }\n    }\n\n    function exportMlbbFile() {\n      try {\n        const blob = new Blob([JSON.stringify(getStoredPackages(), null, 2)], {type:'application/json'});\n        const url = URL.createObjectURL(blob);\n        const a = document.createElement('a'); a.href = url; a.download = 'KAVXY_MLBB_Packages.json';\n        document.body.appendChild(a); a.click(); a.remove();\n        setTimeout(() => URL.revokeObjectURL(url), 1000);\n        showAlert('Backup', 'Package JSON ဖိုင်ကို Download လုပ်ထားပါ');\n      } catch (err) { showAlert('Backup မအောင်မြင်ပါ', err.message, 'error'); }\n    }\n\n    function renderPackages() {\n      const container = document.getElementById('packagesContainer');\n      const all = getStoredPackages();\n      const filtered = all.filter(p => p.category === currentCategory);\n      const isReseller = currentRole === 'reseller';\n\n      container.innerHTML = '';\n\n      if (!filtered.length) container.innerHTML = '<div class=\"text-center py-8 text-xs text-slate-400\">ဤအမျိုးအစားတွင် Package မရှိသေးပါ</div>';\n      filtered.forEach(pkg => {\n        const card = document.createElement('div');\n        card.className = \"p-3.5 rounded-2xl bg-white dark:bg-[#131b2e] border border-slate-200/80 dark:border-white/5 shadow-sm space-y-2\";\n\n        const calculatedPrice = calculatePrice(pkg.coinCost, currentRole);\n        const badgeHtml = pkg.badge ? `<span class=\"bg-blue-600/15 border border-blue-500/30 text-blue-500 text-[9px] font-black uppercase px-2 py-0.5 rounded-md\">${escapeMlbbHtml(pkg.badge)}</span>` : '';\n\n        card.innerHTML = `\n          <div class=\"flex items-center justify-between\">\n            <div class=\"flex items-center gap-2\">\n              <span class=\"w-8 h-8 rounded-xl bg-blue-600/10 text-blue-500 flex items-center justify-center text-xs font-bold\">\n                <i class=\"fa-solid fa-gem\"></i>\n              </span>\n              <div>\n                <h4 class=\"font-black text-xs text-slate-900 dark:text-white\">${escapeMlbbHtml(pkg.title)}</h4>\n                <div class=\"text-[10px] text-slate-400 font-semibold\">Total: <span class=\"text-amber-500 font-bold\">${escapeMlbbHtml(pkg.total)}</span></div>\n              </div>\n            </div>\n            ${badgeHtml}\n          </div>\n\n          <!-- Price & Actions -->\n          <div class=\"flex items-center justify-between pt-2 border-t border-slate-100 dark:border-white/5 text-xs\">\n            <div>\n              <span class=\"text-[9px] text-slate-400 block font-semibold uppercase\">${isReseller ? 'RESELLER PRICE' : 'USER PRICE'}</span>\n              <span class=\"font-mono font-black ${isReseller ? 'text-reseller-500' : 'text-blue-500'} text-sm\">${calculatedPrice.toLocaleString()} MMK</span>\n            </div>\n            <div class=\"flex items-center gap-1.5\">\n              <button onclick=\"startEditPackage(${pkg.id})\" class=\"px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-white/5 hover:bg-blue-600 hover:text-white text-slate-400 font-bold transition flex items-center gap-1 text-[11px]\">\n                <i class=\"fa-solid fa-pen\"></i> ပြင်မည်\n              </button>\n              <button onclick=\"deletePackage(${pkg.id})\" class=\"w-8 h-8 rounded-xl bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white transition flex items-center justify-center text-xs\">\n                <i class=\"fa-solid fa-trash\"></i>\n              </button>\n            </div>\n          </div>\n        `;\n        container.appendChild(card);\n      });\n    }\n\n    // PACKAGE အသစ်ထည့်ခြင်း နှင့် ပြင်ဆင်ခြင်း (Coin Cost အပါအဝင်)\n    function saveCustomPackage() {\n      const cat = document.getElementById('inputPkgCat').value;\n      const title = document.getElementById('inputPkgTitle').value.trim();\n      const total = document.getElementById('inputPkgTotal').value.trim();\n      const coin = parseFloat(document.getElementById('inputPkgCoin').value);\n      const badge = document.getElementById('inputPkgBadge').value.trim();\n\n      if (!title || !total || isNaN(coin) || coin < 0) {\n        showAlert('မှားယွင်းမှု', 'Package အချက်အလက်များနှင့် Coin တန်ဖိုးကို မှန်ကန်စွာ ဖြည့်ပါ', 'error');\n        return;\n      }\n\n      const list = getStoredPackages();\n\n      if (editingPackageId) {\n        // UPDATE\n        const idx = list.findIndex(p => p.id === editingPackageId);\n        if (idx !== -1) {\n          list[idx].category = cat;\n          list[idx].title = title;\n          list[idx].total = total;\n          list[idx].coinCost = coin;\n          list[idx].badge = badge;\n          showAlert('အောင်မြင်ပါသည်', `\"${title}\" Package ကို ပြင်ဆင်ပြီးပါပြီ`, 'success');\n        }\n      } else {\n        // ADD NEW\n        const newPkg = {\n          id: Date.now(),\n          category: cat,\n          title: title,\n          total: total,\n          bonus: 'Special Pack',\n          coinCost: coin,\n          badge: badge\n        };\n        list.push(newPkg);\n        showAlert('အောင်မြင်ပါသည်', `\"${title}\" Package အသစ်ကို ထည့်သွင်းပြီးပါပြီ`, 'success');\n      }\n\n      try { localStorage.setItem(MLBB_PRICE_KEY, JSON.stringify(list)); } catch (e) { showAlert('သိမ်းမရပါ', 'Browser Storage ပြည့်နေပါသည်', 'error'); return; }\n      resetPackageForm();\n      renderPackages();\n    }\n\n    function startEditPackage(id) {\n      const list = getStoredPackages();\n      const pkg = list.find(p => p.id === id);\n      if (!pkg) return;\n\n      editingPackageId = id;\n      document.getElementById('formHeaderTitle').innerHTML = `<i class=\"fa-solid fa-pen-to-square text-amber-500\"></i> Package ပြင်ဆင်ရန်`;\n      document.getElementById('cancelEditBtn').classList.remove('hidden');\n      document.getElementById('savePackageBtn').innerHTML = `<i class=\"fa-solid fa-check\"></i> အပြောင်းအလဲ သိမ်းဆည်းမည်`;\n\n      document.getElementById('inputPkgCat').value = pkg.category;\n      document.getElementById('inputPkgTitle').value = pkg.title;\n      document.getElementById('inputPkgTotal').value = pkg.total;\n      document.getElementById('inputPkgCoin').value = pkg.coinCost;\n      document.getElementById('inputPkgBadge').value = pkg.badge || '';\n\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    }\n\n    function resetPackageForm() {\n      editingPackageId = null;\n      document.getElementById('formHeaderTitle').innerHTML = `<i class=\"fa-solid fa-circle-plus text-blue-500\"></i> Package အသစ်ထည့်သွင်းရန်`;\n      document.getElementById('cancelEditBtn').classList.add('hidden');\n      document.getElementById('savePackageBtn').innerHTML = `<i class=\"fa-solid fa-floppy-disk\"></i> Package အသစ် သိမ်းဆည်းမည်`;\n\n      document.getElementById('inputPkgTitle').value = '';\n      document.getElementById('inputPkgTotal').value = '';\n      document.getElementById('inputPkgCoin').value = '';\n      document.getElementById('inputPkgBadge').value = '';\n    }\n\n    function deletePackage(id) {\n      if (confirm('ဤ Package ကို ဖျက်ပစ်ရန် သေချာပါသလား?')) {\n        let list = getStoredPackages();\n        list = list.filter(p => p.id !== id);\n        localStorage.setItem(MLBB_PRICE_KEY, JSON.stringify(list));\n        renderPackages();\n        showAlert('ဖျက်ပြီးပါပြီ', 'Package ကို ဖျက်ပစ်လိုက်ပါပြီ', 'info');\n      }\n    }\n\n    // THEME & TOAST\n    function toggleThemeManual() {\n      const isDark = document.documentElement.classList.contains('dark');\n      document.documentElement.classList.toggle('dark', !isDark);\n      localStorage.setItem('user_theme_preference', !isDark ? 'dark' : 'light');\n    }\n\n    function showAlert(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n      toast.classList.remove('translate-x-full');\n      setTimeout(() => toast.classList.add('translate-x-full'), 3500);\n    }\n\n    // Init\n    renderPackages();\n  <\/script>\n</body>\n</html>"};
