auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-circle-check\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== 2. CUSTOM ACTION CONFIRM ALERT MODAL ==================== -->\n  <div id=\"actionConfirmModal\" class=\"fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4\">\n    <div class=\"bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 w-full max-w-sm rounded-[32px] p-6 shadow-2xl text-center space-y-4\">\n      <div class=\"w-16 h-16 mx-auto rounded-2xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-2xl shadow-inner\" id=\"confirmIconBox\">\n        <i class=\"fa-solid fa-triangle-exclamation\" id=\"confirmIcon\"></i>\n      </div>\n      <div>\n        <h3 class=\"text-sm font-black text-slate-900 dark:text-white\" id=\"confirmTitle\">အတည်ပြုရန် လိုအပ်သည်</h3>\n        <p class=\"text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed\" id=\"confirmDesc\">\n          ဤလုပ်ဆောင်ချက်ကို ဆက်လက်လုပ်ဆောင်ရန် သေချာပါသလား?\n        </p>\n      </div>\n\n      <div class=\"flex gap-2 pt-1\">\n        <button onclick=\"closeConfirmModal()\" class=\"flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 text-xs font-bold hover:bg-slate-100 dark:hover:bg-white/[0.03] text-slate-700 dark:text-slate-300 transition\">\n          မလုပ်တော့ပါ\n        </button>\n        <button onclick=\"executeConfirmAction()\" id=\"confirmAcceptBtn\" class=\"flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-md transition\">\n          အတည်ပြုမည်\n        </button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== 3. ADD / CONFIG GAME MODAL ==================== -->\n  <div id=\"gameModal\" class=\"fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4\">\n    <div class=\"bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 w-full max-w-md rounded-[32px] p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scroll\">\n      <div class=\"flex items-center justify-between pb-2 border-b border-slate-100 dark:border-white/10\">\n        <h3 class=\"font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2\" id=\"modalHeaderTitle\">\n          <i class=\"fa-solid fa-gamepad text-blue-500\"></i> အသစ်ထပ်ထည့်ပါ (Add New Game)\n        </h3>\n        <button onclick=\"closeGameModal()\" class=\"w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-white\">\n          <i class=\"fa-solid fa-xmark\"></i>\n        </button>\n      </div>\n\n      <input type=\"hidden\" id=\"editGameId\">\n\n      <div class=\"space-y-3.5 text-xs\">\n        <!-- Gallery File Upload for Game Image -->\n        <div class=\"p-3.5 rounded-2xl bg-slate-50 dark:bg-white/[0.02] border border-slate-200 dark:border-white/5 space-y-2 text-center\">\n          <span class=\"block text-[11px] font-bold text-slate-700 dark:text-slate-300\">Gallery မှ ဂိမ်းဓာတ်ပုံရွေးရန်</span>\n          <div onclick=\"document.getElementById('gameFileInput').click()\" class=\"w-full h-32 rounded-2xl bg-slate-100 dark:bg-black/40 border border-dashed border-slate-300 dark:border-white/20 flex items-center justify-center overflow-hidden cursor-pointer hover:border-blue-500 transition relative group\">\n            <img id=\"gameImgPreview\" src=\"\" class=\"w-full h-full object-cover hidden\" alt=\"Game Cover\">\n            <div id=\"gameImgPlaceholder\" class=\"text-slate-400 group-hover:text-blue-500\">\n              <i class=\"fa-solid fa-images text-2xl\"></i>\n              <span class=\"block text-[10px] mt-1 font-semibold\">Gallery ထဲမှ ဓာတ်ပုံရွေးမည်</span>\n            </div>\n          </div>\n          <input type=\"file\" id=\"gameFileInput\" accept=\"image/*\" class=\"hidden\" onchange=\"handleImageUpload(event)\">\n        </div>\n\n        <div>\n          <label class=\"block text-slate-500 dark:text-slate-400 mb-1 font-semibold\">ဂိမ်းအမည် (Game Title)</label>\n          <input type=\"text\" id=\"gameTitleInput\" placeholder=\"ဥပမာ: Mobile Legends, PUBG Mobile...\" class=\"w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-bold focus:outline-none focus:border-blue-500\">\n        </div>\n\n        <div class=\"grid grid-cols-2 gap-2.5\">\n          <div>\n            <label class=\"block text-slate-500 dark:text-slate-400 mb-1 font-semibold\">Tag / အမျိုးအစား</label>\n            <input type=\"text\" id=\"gameTagInput\" placeholder=\"MOBA, BR, FPS\" class=\"w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-bold focus:outline-none focus:border-blue-500\">\n          </div>\n          <div>\n            <label class=\"block text-slate-500 dark:text-slate-400 mb-1 font-semibold\">ငွေကြေး (Currency)</label>\n            <input type=\"text\" id=\"gameCurrencyInput\" placeholder=\"Diamonds, UC\" class=\"w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-bold focus:outline-none focus:border-blue-500\">\n          </div>\n        </div>\n\n        <div>\n          <label class=\"block text-slate-500 dark:text-slate-400 mb-1 font-semibold\">ချိတ်ဆက်မည့် HTML စာမျက်နှာ (Target Route)</label>\n          <input type=\"text\" id=\"gameRouteInput\" value=\"AMlbb.html\" placeholder=\"ဥပမာ: AMlbb.html\" class=\"w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-emerald-500 font-mono font-bold focus:outline-none focus:border-emerald-500\">\n          <p class=\"text-[10px] text-slate-400 mt-1\">* 'ပြင်မည်' ကို နှိပ်ပါက တိုက်ရိုက်ရောက်ရှိမည့် ဖိုင်အမည် (ဥပမာ: <span class=\"text-blue-500 font-mono\">AMlbb.html</span>)။</p>\n        </div>\n\n        <div class=\"flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-white/[0.02] border border-slate-200 dark:border-white/5\">\n          <div>\n            <span class=\"block text-slate-800 dark:text-slate-200 font-bold\">Maintenance Mode</span>\n            <span class=\"text-[10px] text-slate-400\">ပြင်ဆင်နေစဥ် ခေတ္တပိတ်ထားမည်</span>\n          </div>\n          <label class=\"relative inline-flex items-center cursor-pointer\">\n            <input type=\"checkbox\" id=\"gameMaintenanceToggle\" class=\"sr-only peer\">\n            <div class=\"w-11 h-6 bg-slate-300 dark:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500\"></div>\n          </label>\n        </div>\n      </div>\n\n      <div class=\"flex gap-2 pt-2\">\n        <button onclick=\"closeGameModal()\" class=\"flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 text-xs font-bold hover:bg-slate-100 dark:hover:bg-white/[0.03] text-slate-700 dark:text-slate-300 transition\">\n          မလုပ်တော့ပါ\n        </button>\n        <button onclick=\"saveGameData()\" class=\"flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-md transition\">\n          သိမ်းဆည်းမည်\n        </button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION (GAME TOP UP ဖြုတ်ထားသည်) ==================== -->\n  <aside class=\"w-64 bg-white dark:bg-[#080d19] border-r border-slate-200 dark:border-white/5 flex flex-col justify-between shrink-0 hidden lg:flex\">\n    <div>\n      <div class=\"px-6 py-5 flex items-center gap-3 border-b border-slate-200 dark:border-white/5\">\n        <div class=\"w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-lg shadow-lg shadow-blue-500/20\">\n          <i class=\"fa-solid fa-gamepad\"></i>\n        </div>\n        <div>\n          <h1 class=\"text-base font-extrabold text-slate-900 dark:text-white tracking-wide\" id=\"sidebarBrandName\">GameAdmin</h1>\n          <p class=\"text-[10px] text-slate-400 font-mono\">Games Management</p>\n        </div>\n      </div>\n\n      <nav class=\"p-4 space-y-1 text-xs font-semibold\">\n        <a href=\"admin.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-house text-sm w-4 text-center\"></i>\n          <span>Home Dashboard</span>\n        </a>\n        <a href=\"AUser.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-users text-sm w-4 text-center\"></i>\n          <span>Users Management</span>\n        </a>\n        <a href=\"AGame.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition\">\n          <i class=\"fa-solid fa-gamepad text-sm w-4 text-center\"></i>\n          <span>Games (AGame)</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders Management</span>\n        </a>\n        <a href=\"APayment.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & Slips</span>\n        </a>\n        <a href=\"Aimage.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-images text-sm w-4 text-center\"></i>\n          <span>Banners (Aimage)</span>\n        </a>\n        <a href=\"AReport.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-chart-column text-sm w-4 text-center\"></i>\n          <span>Reports & Sales</span>\n        </a>\n        <a href=\"Asetting.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gear text-sm w-4 text-center\"></i>\n          <span>Settings (Asetting)</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"admin.html\" class=\"w-full py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        <span>Back to Admin Home</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN CONTENT ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll\">\n    \n    <!-- Top Header Bar (With Light/Dark Toggle) -->\n    <header class=\"h-16 border-b border-slate-200 dark:border-white/5 bg-white/90 dark:bg-[#0a0f1d]/90 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-30\">\n      <div class=\"flex items-center gap-3\">\n        <a href=\"admin.html\" class=\"lg:hidden w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-600 dark:text-slate-300\">\n          <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        </a>\n        <div>\n          <h2 class=\"text-sm font-extrabold text-slate-900 dark:text-white leading-tight\">Game Boxes Management</h2>\n          <span class=\"text-[10px] text-slate-400 font-mono\">'ပြင်မည်' နှိပ်ပါက AMlbb.html သို့ တိုက်ရိုက်ရောက်ရှိမည်</span>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-3\">\n        <!-- Light / Dark Toggle -->\n        <button onclick=\"toggleTheme()\" class=\"px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 active:scale-95 transition\" title=\"အလင်း/အမှောင် ပြောင်းမည်\">\n          <i id=\"themeToggleIcon\" class=\"fa-solid fa-moon text-blue-500\"></i>\n          <span id=\"themeToggleText\" class=\"hidden sm:inline\">Dark</span>\n        </button>\n\n        <button onclick=\"openAddGameModal()\" class=\"px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-md transition flex items-center gap-1.5 active:scale-95\">\n          <i class=\"fa-solid fa-plus text-xs\"></i>\n          <span>အသစ်ထပ်ထည့်ပါ</span>\n        </button>\n      </div>\n    </header>\n\n    <main class=\"p-6 space-y-6\">\n\n      <!-- Status Header Bar -->\n      <div class=\"p-4 rounded-2xl bg-gradient-to-r from-blue-900/10 via-slate-100 to-slate-100 dark:from-blue-900/30 dark:via-[#0e1629] dark:to-[#0e1629] border border-blue-500/20 flex items-center justify-between\">\n        <div class=\"flex items-center gap-3\">\n          <div class=\"w-10 h-10 rounded-xl bg-blue-500/20 text-blue-500 flex items-center justify-center text-lg\">\n            <i class=\"fa-solid fa-cubes\"></i>\n          </div>\n          <div>\n            <h4 class=\"text-xs font-bold text-slate-900 dark:text-white\">Active Game Boxes</h4>\n            <p class=\"text-[11px] text-slate-600 dark:text-slate-400\">ပြင်ဆင်လိုသော Game box ရှိ <span class=\"text-blue-500 font-bold\">'ပြင်မည်'</span> ခလုတ်ကို နှိပ်ပါက <span class=\"text-emerald-500 font-mono font-bold\">AMlbb.html</span> သို့ သွားပါမည်</p>\n          </div>\n        </div>\n        <span class=\"text-xs font-mono font-bold text-slate-500 dark:text-slate-400\" id=\"gameCountPill\">0 Games</span>\n      </div>\n\n      <!-- ==================== GAME BOXES GRID ==================== -->\n      <div class=\"grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4\" id=\"gameBoxesGrid\">\n        <!-- Rendered via JavaScript -->\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== JAVASCRIPT ==================== -->\n  <script>\n    const GAMES_DB_KEY = 'admin_games';\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const PLATFORM_CONFIG_KEY = 'site_platform_config';\n\n    let tempImageBase64 = null;\n    let toastTimeout = null;\n    let pendingConfirmAction = null;\n\n    // Default Games List\n    const DEFAULT_GAMES_LIST = [\n      {\n        id: 0,\n        title: \"Mobile Legends\",\n        tag: \"MOBA\",\n        currency: \"Diamonds\",\n        route: \"AMlbb.html\",\n        status: \"active\",\n        image: \"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&auto=format&fit=crop\"\n      },\n      {\n        id: 1,\n        title: \"PUBG Mobile\",\n        tag: \"BR\",\n        currency: \"UC\",\n        route: \"AMlbb.html\",\n        status: \"active\",\n        image: \"https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400&auto=format&fit=crop\"\n      },\n      {\n        id: 2,\n        title: \"Honor of Kings\",\n        tag: \"MOBA\",\n        currency: \"Tokens\",\n        route: \"AMlbb.html\",\n        status: \"active\",\n        image: \"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&auto=format&fit=crop\"\n      },\n      {\n        id: 3,\n        title: \"Blood Strike\",\n        tag: \"FPS\",\n        currency: \"Gold\",\n        route: \"AMlbb.html\",\n        status: \"active\",\n        image: \"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&auto=format&fit=crop\"\n      },\n      {\n        id: 4,\n        title: \"Free Fire\",\n        tag: \"BR\",\n        currency: \"Diamonds\",\n        route: \"AMlbb.html\",\n        status: \"active\",\n        image: \"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop\"\n      }\n    ];\n\n    // 1. THEME ENGINE\n    function applyThemeMode(mode) {\n      const html = document.documentElement;\n      const themeIcon = document.getElementById('themeToggleIcon');\n      const themeText = document.getElementById('themeToggleText');\n\n      if (mode === 'light') {\n        html.classList.remove('dark');\n        themeIcon.className = \"fa-solid fa-sun text-amber-500\";\n        themeText.innerText = \"Light\";\n      } else {\n        html.classList.add('dark');\n        themeIcon.className = \"fa-solid fa-moon text-blue-400\";\n        themeText.innerText = \"Dark\";\n      }\n      localStorage.setItem(THEME_STORAGE_KEY, mode);\n    }\n\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.contains('dark');\n      const targetMode = isDark ? 'light' : 'dark';\n      applyThemeMode(targetMode);\n      showToast('Theme ပြောင်းလဲပြီး', `${targetMode === 'dark' ? 'Dark Mode' : 'Light Mode'} သို့ ပြောင်းလိုက်ပါပြီ`, 'info');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      applyThemeMode(savedTheme);\n\n      try {\n        const rawPlatform = localStorage.getItem(PLATFORM_CONFIG_KEY);\n        if (rawPlatform) {\n          const cfg = JSON.parse(rawPlatform);\n          if (cfg.name) document.getElementById('sidebarBrandName').innerText = cfg.name;\n        }\n      } catch (e) {}\n    }\n\n    // 2. DATA MANAGEMENT\n    let cloudGames = null;\n    function getAllGames() {\n      if (Array.isArray(cloudGames)) return cloudGames;\n      try { const saved = JSON.parse(localStorage.getItem(GAMES_DB_KEY)); if (Array.isArray(saved)) return saved; } catch (_) {}\n      return []; // No automatic restore of deleted default games\n    }\n    async function syncGamesFromCloud() {\n      try {\n        const response = await fetch('https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/admin_games.json', {cache:'no-store'});\n        if (!response.ok) throw new Error('Read failed: '+response.status);\n        const data = await response.json();\n        if (Array.isArray(data)) cloudGames = data.filter(Boolean);\n        else if (data && typeof data === 'object') cloudGames = Object.values(data).filter(Boolean);\n        else cloudGames = [];\n        localStorage.setItem(GAMES_DB_KEY, JSON.stringify(cloudGames));\n        renderGameBoxes();\n      } catch(e) { console.warn('Game cloud sync:',e); }\n    }\n    async function saveGames(games) {\n      try {\n        const response = await fetch('https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/admin_games.json', {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(games)});\n        if (!response.ok) throw new Error('Firebase write failed: '+response.status+' '+await response.text());\n        cloudGames = games;\n        localStorage.setItem(GAMES_DB_KEY, JSON.stringify(games));\n        renderGameBoxes();\n      } catch(e) { console.error(e); alert('Firebase မှာ Game သိမ်းမရပါ: '+e.message); throw e; }\n    }\n    window.addEventListener('load',syncGamesFromCloud);\n\n    // 3. RENDER GAME BOXES\n    function renderGameBoxes() {\n      const container = document.getElementById('gameBoxesGrid');\n      const games = getAllGames();\n      document.getElementById('gameCountPill').innerText = `${games.length} Games Available`;\n      container.innerHTML = '';\n\n      games.forEach(game => {\n        const isMaintenance = game.status === 'maintenance';\n        const box = document.createElement('div');\n\n        box.className = \"p-3 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 hover:border-blue-500/40 transition flex flex-col justify-between group relative overflow-hidden shadow-sm\";\n\n        box.innerHTML = `\n          <!-- Game Image & Info -->\n          <div>\n            <div class=\"relative aspect-video rounded-xl overflow-hidden bg-slate-800 border border-slate-200 dark:border-white/10 mb-2.5\">\n              <img src=\"${game.image}\" class=\"w-full h-full object-cover group-hover:scale-105 transition duration-300\">\n              \n              <span class=\"absolute top-1.5 left-1.5 bg-blue-600 text-white text-[8px] font-black uppercase px-2 py-0.5 rounded shadow\">\n                ${game.tag}\n              </span>\n\n              ${isMaintenance ? `\n                <div class=\"absolute inset-0 bg-black/80 backdrop-blur-[2px] flex flex-col items-center justify-center text-center p-2\">\n                  <i class=\"fa-solid fa-screwdriver-wrench text-amber-400 text-base mb-1 animate-bounce\"></i>\n                  <span class=\"text-[10px] text-amber-400 font-bold leading-tight\">ခေတ္တပိတ်ထားသည်</span>\n                </div>\n              ` : ''}\n            </div>\n\n            <h4 class=\"font-bold text-xs text-slate-900 dark:text-white truncate group-hover:text-blue-500 transition\">${game.title}</h4>\n            \n            <div class=\"flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 mt-1\">\n              <span>💎 ${game.currency}</span>\n              <span class=\"text-[9px] text-emerald-500 font-mono\">${game.route || 'AMlbb.html'}</span>\n            </div>\n          </div>\n\n          <!-- Bottom Action Buttons: 'ပြင်မည်' redirects directly to AMlbb.html -->\n          <div class=\"pt-2.5 mt-2 border-t border-slate-100 dark:border-white/5 flex items-center justify-between gap-1.5\">\n            \n            <!-- 'ပြင်မည်' Button: Redirects to AMlbb.html -->\n            <button onclick=\"goToEditGame('${game.route || 'AMlbb.html'}', '${game.title}')\" class=\"flex-1 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-[10px] transition flex items-center justify-center gap-1 shadow active:scale-95\">\n              <i class=\"fa-solid fa-pen-to-square text-[9px]\"></i> ပြင်မည်\n            </button>\n\n            <!-- Maintenance Toggle Button with Modal Alert -->\n            <button onclick=\"promptToggleMaintenance(${game.id})\" class=\"px-2.5 py-1.5 rounded-xl ${isMaintenance ? 'bg-amber-500/20 text-amber-500 hover:bg-amber-500 hover:text-black' : 'bg-slate-100 dark:bg-white/[0.03] text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-white/10'} font-bold text-[10px] transition\" title=\"ခေတ္တပိတ်မည်/ဖွင့်မည်\">\n              <i class=\"fa-solid ${isMaintenance ? 'fa-lock' : 'fa-lock-open'} text-[10px]\"></i>\n            </button>\n\n            <!-- Delete Button with Modal Alert -->\n            <button onclick=\"promptDeleteGame(${game.id})\" class=\"px-2.5 py-1.5 rounded-xl bg-rose-500/15 text-rose-500 hover:bg-rose-500 hover:text-white font-bold text-[10px] transition\" title=\"ဖျက်ပစ်မည်\">\n              <i class=\"fa-solid fa-trash text-[10px]\"></i>\n            </button>\n          </div>\n        `;\n        container.appendChild(box);\n      });\n    }\n\n    // 4. 'ပြင်မည်' CLICK REDIRECTION TO AMLBB.HTML\n    function goToEditGame(targetRoute, gameTitle) {\n      showToast('လုပ်ဆောင်နေပါသည်', `\"${gameTitle}\" စျေးနှုန်းပြင်ဆင်ရန် ${targetRoute} သို့ သွားရောက်နေပါသည်...`, 'info');\n      setTimeout(() => {\n        window.location.href = targetRoute;\n      }, 500);\n    }\n\n    // 5. ACTION CONFIRMATION ALERT MODAL\n    function promptToggleMaintenance(gameId) {\n      const games = getAllGames();\n      const game = games.find(g => g.id === gameId);\n      if (!game) return;\n\n      const isMaint = game.status === 'maintenance';\n      document.getElementById('confirmTitle').innerText = isMaint ? 'ဂိမ်းပြန်လည်ဖွင့်လှစ်မည်လား?' : 'ဂိမ်းခေတ္တပိတ်ထားမည်လား?';\n      document.getElementById('confirmDesc').innerText = isMaint \n        ? `\"${game.title}\" အား User များ ပြန်လည်အသုံးပြုနိုင်ရန် ဖွင့်လှစ်ပေးမည် ဖြစ်ပါသည်။` \n        : `\"${game.title}\" အား ပြင်ဆင်နေစဥ် အသုံးပြုသူများထံတွင် ခေတ္တပိတ်ထားကြောင်း ပြသမည် ဖြစ်ပါသည်။`;\n\n      document.getElementById('confirmIconBox').className = isMaint ? 'w-16 h-16 mx-auto rounded-2xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-2xl shadow-inner' : 'w-16 h-16 mx-auto rounded-2xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-2xl shadow-inner';\n      document.getElementById('confirmIcon').className = isMaint ? 'fa-solid fa-lock-open' : 'fa-solid fa-screwdriver-wrench';\n\n      pendingConfirmAction = () => {\n        game.status = isMaint ? 'active' : 'maintenance';\n        saveGames(games);\n        showToast('အောင်မြင်ပါသည်', `\"${game.title}\" အား ${game.status === 'maintenance' ? 'ခေတ္တပိတ်ထားလိုက်ပါပြီ' : 'ပြန်လည်ဖွင့်လှစ်လိုက်ပါပြီ'}`, 'success');\n      };\n\n      document.getElementById('actionConfirmModal').classList.remove('hidden');\n    }\n\n    function promptDeleteGame(gameId) {\n      const games = getAllGames();\n      const game = games.find(g => g.id === gameId);\n      if (!game) return;\n\n      document.getElementById('confirmTitle').innerText = 'ဂိမ်းဖျက်ပစ်ရန် သေချာပါသလား?';\n      document.getElementById('confirmDesc').innerText = `\"${game.title}\" ဂိမ်းကို စာရင်းမှ လုံးဝဖျက်ပစ်မည် ဖြစ်ပါသည်။ ပြန်လည်ရယူ၍ မရနိုင်ပါ။`;\n      document.getElementById('confirmIconBox').className = 'w-16 h-16 mx-auto rounded-2xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-2xl shadow-inner';\n      document.getElementById('confirmIcon').className = 'fa-solid fa-trash';\n\n      pendingConfirmAction = () => {\n        let updated = getAllGames();\n        updated = updated.filter(g => g.id !== gameId);\n        saveGames(updated).then(() => {\n          showToast('ဖျက်ပြီးပါပြီ', `\"${game.title}\" အား Firebase မှ ဖျက်ပြီးပါပြီ`, 'success');\n        }).catch(err => {\n          showToast('ဖျက်မရပါ', err.message, 'error');\n        });\n      };\n\n      document.getElementById('actionConfirmModal').classList.remove('hidden');\n    }\n\n    function executeConfirmAction() {\n      if (typeof pendingConfirmAction === 'function') {\n        pendingConfirmAction();\n      }\n      closeConfirmModal();\n    }\n\n    function closeConfirmModal() {\n      document.getElementById('actionConfirmModal').classList.add('hidden');\n      pendingConfirmAction = null;\n    }\n\n    // 6. ADD NEW GAME WITH GALLERY UPLOAD\n    function openAddGameModal() {\n      document.getElementById('editGameId').value = '';\n      document.getElementById('modalHeaderTitle').innerHTML = `<i class=\"fa-solid fa-plus-circle text-blue-500\"></i> အသစ်ထပ်ထည့်ပါ`;\n      document.getElementById('gameTitleInput').value = '';\n      document.getElementById('gameTagInput').value = 'MOBA';\n      document.getElementById('gameCurrencyInput').value = 'Diamonds';\n      document.getElementById('gameRouteInput').value = 'AMlbb.html';\n      document.getElementById('gameMaintenanceToggle').checked = false;\n\n      tempImageBase64 = null;\n      document.getElementById('gameImgPreview').classList.add('hidden');\n      document.getElementById('gameImgPlaceholder').classList.remove('hidden');\n\n      document.getElementById('gameModal').classList.remove('hidden');\n    }\n\n    function closeGameModal() {\n      document.getElementById('gameModal').classList.add('hidden');\n    }\n\n    function handleImageUpload(event) {\n      const file = event.target.files[0];\n      if (file && file.type.startsWith('image/')) {\n        const reader = new FileReader();\n        reader.onload = function(e) {\n          tempImageBase64 = e.target.result;\n          const previewImg = document.getElementById('gameImgPreview');\n          const placeholder = document.getElementById('gameImgPlaceholder');\n\n          previewImg.src = tempImageBase64;\n          previewImg.classList.remove('hidden');\n          placeholder.classList.add('hidden');\n          showToast('ရွေးချယ်ပြီး', 'ဂိမ်းမျက်နှာဖုံးပုံ ရွေးချယ်ပြီးပါပြီ', 'info');\n        };\n        reader.readAsDataURL(file);\n      }\n    }\n\n    function saveGameData() {\n      const editId = document.getElementById('editGameId').value;\n      const title = document.getElementById('gameTitleInput').value.trim();\n      const tag = document.getElementById('gameTagInput').value.trim() || 'GAME';\n      const currency = document.getElementById('gameCurrencyInput').value.trim() || 'Diamonds';\n      const route = document.getElementById('gameRouteInput').value.trim() || 'AMlbb.html';\n      const isMaintenance = document.getElementById('gameMaintenanceToggle').checked;\n\n      if (!title) {\n        showToast('မှားယွင်းမှု', 'ဂိမ်းအမည်ကို ဖြည့်သွင်းပါ', 'error');\n        return;\n      }\n\n      const coverImg = tempImageBase64 || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400';\n      const games = getAllGames();\n\n      const newGame = {\n        id: Date.now(),\n        title: title,\n        tag: tag,\n        currency: currency,\n        route: route,\n        status: isMaintenance ? 'maintenance' : 'active',\n        image: coverImg\n      };\n\n      games.push(newGame);\n      saveGames(games);\n      closeGameModal();\n      showToast('အောင်မြင်ပါသည်', `\"${title}\" ဂိမ်းအသစ်ကို ထည့်သွင်းပြီးပါပြီ`, 'success');\n    }\n\n    // 7. TOAST ENGINE\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'warning') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-triangle-exclamation';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3500);\n    }\n\n    // Initialize Page\n    initTheme();\n    renderGameBoxes();\n  <\/script>\n</body>\n</html>", "AOrder.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - Game Orders Hub (AOrder)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    /* Forced Desktop View Styles */\n    body.forced-desktop {\n      min-width: 1200px !important;\n      overflow-x: auto !important;\n    }\n    body.forced-desktop #desktopSidebar {\n      display: flex !important;\n    }\n    body.forced-desktop #mobileBottomBar {\n      display: none !important;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- ==================== TOAST ALERT ==================== -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-gamepad\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n board('copyUserId', 'User ID')\" class=\"px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition active:scale-95 flex items-center gap-1 shrink-0\">\n              <i class=\"fa-regular fa-copy\"></i> Copy\n            </button>\n          </div>\n        </div>\n\n        <!-- Zone / Server ID -->\n        <div>\n          <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">Server / Zone ID:</label>\n          <div class=\"flex items-center gap-2\">\n            <input type=\"text\" id=\"copyServerId\" readonly class=\"flex-1 px-3 py-2 rounded-xl bg-white dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono font-bold text-xs select-all outline-none\">\n            <button onclick=\"copyToClipboard('copyServerId', 'Server ID')\" class=\"px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition active:scale-95 flex items-center gap-1 shrink-0\">\n              <i class=\"fa-regular fa-copy\"></i> Copy\n            </button>\n          </div>\n        </div>\n\n        <!-- Combined ID (ID + Server ID) -->\n        <div>\n          <label class=\"text-[10px] text-slate-400 font-bold block mb-1\">ID (Server ID) ပေါင်းလျက် Copy ယူရန်:</label>\n          <div class=\"flex items-center gap-2\">\n            <input type=\"text\" id=\"copyCombinedId\" readonly class=\"flex-1 px-3 py-2 rounded-xl bg-white dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-amber-500 font-mono font-bold text-xs select-all outline-none\">\n            <button onclick=\"copyToClipboard('copyCombinedId', 'Combined ID')\" class=\"px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-black text-xs transition active:scale-95 flex items-center gap-1 shrink-0\">\n              <i class=\"fa-regular fa-copy\"></i> Copy All\n            </button>\n          </div>\n        </div>\n      </div>\n\n      <!-- Order Details Summary -->\n      <div class=\"p-3.5 rounded-2xl bg-white/[0.02] border border-slate-200 dark:border-white/5 space-y-2 text-xs\">\n        <div class=\"flex justify-between\"><span class=\"text-slate-400\">Order ID:</span><span class=\"font-mono font-bold text-slate-900 dark:text-white\" id=\"modalOrderIdText\">-</span></div>\n        <div class=\"flex justify-between\"><span class=\"text-slate-400\">ဂိမ်းအမည်:</span><span class=\"font-bold text-blue-500\" id=\"modalGameTitle\">-</span></div>\n        <div class=\"flex justify-between\"><span class=\"text-slate-400\">Package:</span><span class=\"font-bold text-slate-900 dark:text-white\" id=\"modalPackage\">-</span></div>\n        <div class=\"flex justify-between\"><span class=\"text-slate-400\">ကျသင့်ငွေ:</span><span class=\"font-mono font-black text-emerald-500\" id=\"modalPrice\">-</span></div>\n        <div class=\"flex justify-between\"><span class=\"text-slate-400\">မှာယူသူ:</span><span class=\"font-bold text-slate-900 dark:text-white\" id=\"modalUserName\">-</span></div>\n        <div class=\"flex justify-between\"><span class=\"text-slate-400\">မှာယူချိန်:</span><span class=\"text-slate-400 font-mono\" id=\"modalDate\">-</span></div>\n      </div>\n\n      <div class=\"flex gap-2 pt-2\">\n        <button onclick=\"handleRejectGameOrder()\" class=\"flex-1 py-2.5 rounded-xl bg-rose-500/15 hover:bg-rose-500 text-rose-500 hover:text-white border border-rose-500/30 text-xs font-bold transition flex items-center justify-center gap-1.5\">\n          <i class=\"fa-solid fa-ban\"></i> ပယ်ဖျက်မည်\n        </button>\n        <button onclick=\"handleApproveGameOrder()\" class=\"flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5\">\n          <i class=\"fa-solid fa-check\"></i> စိန်ဖြည့်ပြီး (Completed)\n        </button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION (DESKTOP MODE) ==================== -->\n  <aside id=\"desktopSidebar\" class=\"w-64 bg-white dark:bg-[#080d19] border-r border-slate-200 dark:border-white/5 flex-col justify-between shrink-0 hidden lg:flex\">\n    <div>\n      <div class=\"px-6 py-5 flex items-center gap-3 border-b border-slate-200 dark:border-white/5\">\n        <div class=\"w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-lg shadow-lg shadow-blue-500/20 font-black\">\n          <i class=\"fa-solid fa-gamepad\"></i>\n        </div>\n        <div>\n          <h1 class=\"text-base font-extrabold text-slate-900 dark:text-white tracking-wide\" id=\"sidebarBrandName\">GameAdmin</h1>\n          <p class=\"text-[10px] text-blue-500 font-mono\">Game Orders Hub</p>\n        </div>\n      </div>\n\n      <!-- Navigation Links: Banners (AImage) ကို Premium Emoji အထက်တွင် ထားရှိသည် -->\n      <nav class=\"p-4 space-y-1 text-xs font-semibold\">\n        <a href=\"admin.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-house text-sm w-4 text-center\"></i>\n          <span>Home Dashboard</span>\n        </a>\n        <a href=\"Aimage.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-images text-sm w-4 text-center text-sky-400\"></i>\n          <span>Banners (AImage)</span>\n        </a>\n        <a href=\"APremiumemoji.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-crown text-sm w-4 text-center text-amber-500\"></i>\n          <span>Premium Emoji (11 Tiers)</span>\n        </a>\n        <a href=\"APayment.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & Slips</span>\n        </a>\n        <a href=\"AEvent.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-wand-magic-sparkles text-sm w-4 text-center text-amber-400\"></i>\n          <span>Events & Seasons</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders Management (AOrder)</span>\n        </a>\n        <a href=\"Asetting.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gear text-sm w-4 text-center\"></i>\n          <span>Settings</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"index.html\" target=\"_blank\" class=\"w-full py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-up-right-from-square text-xs text-blue-500\"></i>\n        <span>Live Index ကြည့်မည်</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN WORKSPACE ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll pb-20 lg:pb-6\">\n    \n    <!-- Top Header -->\n    <header class=\"h-16 border-b border-slate-200 dark:border-white/5 bg-white/90 dark:bg-[#0a0f1d]/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30\">\n      <div class=\"flex items-center gap-3\">\n        <a href=\"admin.html\" class=\"lg:hidden w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-600 dark:text-slate-300\">\n          <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        </a>\n        <div>\n          <h2 class=\"text-sm font-extrabold text-slate-900 dark:text-white leading-tight\">Game Orders Management</h2>\n          <span class=\"text-[10px] text-emerald-400 font-mono flex items-center gap-1\">\n            <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse\"></span> ဂိမ်းစိန်မှာယူမှုများ Live Sync\n          </span>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-2 sm:gap-3\">\n        <!-- Switcher: ဖုန်းဗားရှင်း / PC ဗားရှင်း -->\n        <button onclick=\"toggleDeviceLayout()\" id=\"deviceToggleBtn\" class=\"px-2.5 py-1.5 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-500 font-bold text-xs flex items-center gap-1.5 active:scale-95 transition\" title=\"ဗားရှင်းပြောင်းမည်\">\n          <i id=\"deviceToggleIcon\" class=\"fa-solid fa-desktop\"></i>\n          <span id=\"deviceToggleText\">PC ဗားရှင်း</span>\n        </button>\n\n        <!-- Light / Dark Mode Toggle Button -->\n        <button onclick=\"toggleTheme()\" class=\"w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center active:scale-95 transition\">\n          <i id=\"themeToggleIcon\" class=\"fa-solid fa-moon text-blue-500\"></i>\n        </button>\n\n        <button onclick=\"fetchGameOrdersFromCloud()\" class=\"px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs flex items-center gap-1.5 transition shadow\">\n          <i class=\"fa-solid fa-rotate-right text-xs\"></i>\n          <span class=\"hidden sm:inline\">Refresh</span>\n        </button>\n      </div>\n    </header>\n\n    <!-- Main Content -->\n    <main class=\"p-4 sm:p-6 space-y-6\">\n\n      <!-- Metrics Row -->\n      <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-4\">\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 flex items-center justify-between shadow-sm\">\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-bold uppercase\">Pending Game Orders</span>\n            <div class=\"text-xl font-black text-amber-500 font-mono mt-0.5\" id=\"metricPendingGameOrders\">0</div>\n          </div>\n          <div class=\"w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-base\">\n            <i class=\"fa-solid fa-clock\"></i>\n          </div>\n        </div>\n\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 flex items-center justify-between shadow-sm\">\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-bold uppercase\">Completed Orders</span>\n            <div class=\"text-xl font-black text-emerald-500 font-mono mt-0.5\" id=\"metricCompletedGameOrders\">0</div>\n          </div>\n          <div class=\"w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-base\">\n            <i class=\"fa-solid fa-circle-check\"></i>\n          </div>\n        </div>\n\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 flex items-center justify-between shadow-sm\">\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-bold uppercase\">Total Game Sales</span>\n            <div class=\"text-xl font-black text-blue-500 font-mono mt-0.5\" id=\"metricTotalGameSales\">0 MMK</div>\n          </div>\n          <div class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-base\">\n            <i class=\"fa-solid fa-wallet\"></i>\n          </div>\n        </div>\n      </div>\n\n      <!-- GAME ORDERS TABLE SECTION -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"flex flex-col sm:flex-row items-center justify-between gap-3 border-b border-slate-100 dark:border-white/5 pb-2.5\">\n          <div>\n            <h3 class=\"text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2\">\n              <i class=\"fa-solid fa-gamepad text-blue-500\"></i> ဂိမ်းစိန်မှာယူမှု အော်ဒါစာရင်းများ (Game Orders)\n            </h3>\n            <p class=\"text-[10px] text-slate-400 mt-0.5\">User ID / Server ID များကို ကလစ်တစ်ချက်ဖြင့် Copy ယူ၍ စိန်ဖြည့်သွင်းပေးနိုင်ပါသည်</p>\n          </div>\n\n          <div class=\"flex items-center gap-1.5 text-xs font-bold\">\n            <button onclick=\"filterGameOrders('pending')\" id=\"tab-order-pending\" class=\"px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition\">စစ်ဆေးဆဲ (Pending)</button>\n            <button onclick=\"filterGameOrders('completed')\" id=\"tab-order-completed\" class=\"px-3 py-1.5 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/5 transition\">ဖြည့်ပြီး (Completed)</button>\n            <button onclick=\"filterGameOrders('all')\" id=\"tab-order-all\" class=\"px-3 py-1.5 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/5 transition\">အားလုံး</button>\n          </div>\n        </div>\n\n        <div class=\"overflow-x-auto\">\n          <table class=\"w-full text-left text-xs\">\n            <thead>\n              <tr class=\"text-slate-400 border-b border-slate-200 dark:border-white/5 text-[10px] font-bold uppercase\">\n                <th class=\"py-2.5 px-3\">Order ID</th>\n                <th class=\"py-2.5 px-3\">Game</th>\n                <th class=\"py-2.5 px-3\">Player ID (Server)</th>\n                <th class=\"py-2.5 px-3\">Package</th>\n                <th class=\"py-2.5 px-3\">Amount</th>\n                <th class=\"py-2.5 px-3\">User</th>\n                <th class=\"py-2.5 px-3\">Date</th>\n                <th class=\"py-2.5 px-3\">Status</th>\n                <th class=\"py-2.5 px-3 text-right\">Actions</th>\n              </tr>\n            </thead>\n            <tbody id=\"gameOrdersTableBody\" class=\"divide-y divide-slate-100 dark:divide-white/5\">\n              <!-- Injected via JavaScript -->\n            </tbody>\n          </table>\n        </div>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== MOBILE BOTTOM BAR ==================== -->\n  <nav id=\"mobileBottomBar\" class=\"fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 py-2.5 px-4 lg:hidden\">\n    <div class=\"max-w-md mx-auto flex items-center justify-around text-center\">\n      <a href=\"admin.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-house text-base\"></i><span class=\"text-[10px] font-semibold\">Home</span></a>\n      <a href=\"Aimage.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-images text-base\"></i><span class=\"text-[10px] font-semibold\">Banner</span></a>\n      <a href=\"APremiumemoji.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-crown text-base\"></i><span class=\"text-[10px] font-semibold\">Emoji</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"AOrder.html\" class=\"flex flex-col items-center gap-0.5 text-blue-500\"><i class=\"fa-solid fa-file-lines text-base\"></i><span class=\"text-[10px] font-bold\">Orders</span></a>\n    </div>\n  </nav>\n\n  <!-- ==================== JAVASCRIPT LOGIC & FIREBASE SYNC ==================== -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n\n    let currentOrderFilter = 'pending';\n    let cloudGameOrders = {};\n    let toastTimeout = null;\n\n    // ------------------------------------------------------------\n    // ၁။ ဖုန်းဗားရှင်း / PC ဗားရှင်း ပြောင်းလဲမှု\n    // ------------------------------------------------------------\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n        showToast(\"ကွန်ပြူတာဗားရှင်း\", \"Desktop View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n        showToast(\"ဖုန်းဗားရှင်း\", \"Mobile View သို့ ပြောင်းလိုက်ပါပြီ\", \"info\");\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      const target = current === 'mobile' ? 'desktop' : 'mobile';\n      applyDeviceLayout(target);\n    }\n\n    // ------------------------------------------------------------\n    // ၂။ THEME ENGINE (DARK / LIGHT)\n    // ------------------------------------------------------------\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n\n      const savedLayout = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      if (savedLayout === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    // ------------------------------------------------------------\n    // ၃။ TOAST ALERT & COPY FUNCTION\n    // ------------------------------------------------------------\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    function copyToClipboard(elementId, label) {\n      const input = document.getElementById(elementId);\n      input.select();\n      input.setSelectionRange(0, 99999);\n      navigator.clipboard.writeText(input.value);\n      showToast(\"Copied!\", `${label}: \"${input.value}\" ကို Copy ယူပြီးပါပြီ`, \"success\");\n    }\n\n    function quickCopy(text, label) {\n      navigator.clipboard.writeText(text);\n      showToast(\"Copied!\", `${label}: \"${text}\" ကို ကော်ပီကူးယူပြီးပါပြီ`, \"success\");\n    }\n\n    // ------------------------------------------------------------\n    // ၄။ FIREBASE REALTIME GAME ORDERS FETCH\n    // ------------------------------------------------------------\n    async function fetchGameOrdersFromCloud() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}user_game_orders.json`);\n        const data = await res.json();\n        cloudGameOrders = data || {};\n      } catch (e) {\n        cloudGameOrders = {};\n      }\n      renderGameOrdersTable();\n      updateOrderMetrics();\n    }\n\n    function filterGameOrders(status) {\n      currentOrderFilter = status;\n      ['pending', 'completed', 'all'].forEach(s => {\n        const btn = document.getElementById(`tab-order-${s}`);\n        if (s === status) {\n          btn.className = 'px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition';\n        } else {\n          btn.className = 'px-3 py-1.5 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/5 transition';\n        }\n      });\n      renderGameOrdersTable();\n    }\n\n    function renderGameOrdersTable() {\n      const tbody = document.getElementById('gameOrdersTableBody');\n      tbody.innerHTML = '';\n\n      const orderKeys = Object.keys(cloudGameOrders).reverse();\n\n      const filteredKeys = orderKeys.filter(k => {\n        const o = cloudGameOrders[k];\n        if (currentOrderFilter === 'all') return true;\n        return (o.status || 'pending') === currentOrderFilter;\n      });\n\n      if (filteredKeys.length === 0) {\n        tbody.innerHTML = `\n          <tr>\n            <td colspan=\"9\" class=\"py-8 text-center text-slate-400 font-bold\">\n              ဂိမ်းအော်ဒါမှတ်တမ်း မရှိသေးပါ\n            </td>\n          </tr>\n        `;\n        return;\n      }\n\n      filteredKeys.forEach(k => {\n        const o = cloudGameOrders[k];\n        const tr = document.createElement('tr');\n        tr.className = \"hover:bg-slate-50 dark:hover:bg-white/[0.02] transition\";\n\n        const isCompleted = o.status === 'completed';\n        const isRejected = o.status === 'rejected';\n\n        let badgeClass = 'bg-amber-500/20 text-amber-500 border border-amber-500/30';\n        let badgeText = 'စစ်ဆေးဆဲ';\n        if (isCompleted) {\n          badgeClass = 'bg-emerald-500/20 text-emerald-500 border border-emerald-500/30';\n          badgeText = 'ဖြည့်ပြီး';\n        } else if (isRejected) {\n          badgeClass = 'bg-rose-500/20 text-rose-500 border border-rose-500/30';\n          badgeText = 'ပယ်ဖျက်ပြီး';\n        }\n\n        const userId = o.userId || o.gameId || '-';\n        const serverId = o.serverId || o.zoneId || '';\n        const combinedDisplay = serverId ? `${userId} (${serverId})` : userId;\n\n        tr.innerHTML = `\n          <td class=\"py-3 px-3 font-mono font-bold text-slate-400\">#${o.orderId || k}</td>\n          <td class=\"py-3 px-3\">\n            <span class=\"inline-flex items-center gap-1.5 font-bold text-blue-500\">\n              <i class=\"fa-solid fa-gamepad text-xs\"></i> ${o.gameTitle || 'Mobile Legends'}\n            </span>\n          </td>\n          <td class=\"py-3 px-3 font-mono\">\n            <div class=\"flex items-center gap-1.5\">\n              <span class=\"font-bold text-slate-900 dark:text-white\">${combinedDisplay}</span>\n              <button onclick=\"quickCopy('${userId}', 'Game ID')\" class=\"w-6 h-6 rounded bg-slate-100 dark:bg-white/5 hover:bg-blue-600 hover:text-white flex items-center justify-center text-[10px] text-slate-400 transition\" title=\"ID ကော်ပီယူမည်\">\n                <i class=\"fa-regular fa-copy\"></i>\n              </button>\n            </div>\n          </td>\n          <td class=\"py-3 px-3 text-slate-600 dark:text-slate-300 font-semibold\">${o.package || '-'}</td>\n          <td class=\"py-3 px-3 font-mono font-black text-emerald-500\">${(Number(o.price) || 0).toLocaleString()} MMK</td>\n          <td class=\"py-3 px-3 font-bold text-slate-900 dark:text-white\">${o.userName || 'Player'}</td>\n          <td class=\"py-3 px-3 text-slate-400 text-[11px] font-mono\">${o.date || '--'}</td>\n          <td class=\"py-3 px-3\">\n            <span class=\"px-2 py-0.5 rounded-full text-[9px] font-bold ${badgeClass}\">\n              ${badgeText}\n            </span>\n          </td>\n          <td class=\"py-3 px-3 text-right\">\n            <button onclick=\"openOrderModal('${k}')\" class=\"px-3 py-1 rounded-xl bg-blue-600/15 hover:bg-blue-600 text-blue-500 hover:text-white font-bold text-[10px] transition\">\n              စစ်ဆေး / ID Copy\n            </button>\n          </td>\n        `;\n        tbody.appendChild(tr);\n      });\n    }\n\n    // ------------------------------------------------------------\n    // ၅။ MODAL WITH COPY BOX LOGIC\n    // ------------------------------------------------------------\n    function openOrderModal(key) {\n      const o = cloudGameOrders[key];\n      if (!o) return;\n\n      const userId = o.userId || o.gameId || '-';\n      const serverId = o.serverId || o.zoneId || '';\n\n      document.getElementById('modalOrderId').value = key;\n      document.getElementById('modalOrderIdText').innerText = '#' + (o.orderId || key);\n      document.getElementById('modalGameTitle').innerText = o.gameTitle || 'Mobile Legends';\n      document.getElementById('modalPackage').innerText = o.package || '-';\n      document.getElementById('modalPrice').innerText = `${(Number(o.price) || 0).toLocaleString()} MMK`;\n      document.getElementById('modalUserName').innerText = o.userName || 'Player';\n      document.getElementById('modalDate').innerText = o.date || '--';\n\n      // Setting Values for Copy Boxes\n      document.getElementById('copyUserId').value = userId;\n      document.getElementById('copyServerId').value = serverId || '-';\n      document.getElementById('copyCombinedId').value = serverId ? `${userId} (${serverId})` : userId;\n\n      document.getElementById('gameOrderModal').classList.remove('hidden');\n    }\n\n    function closeOrderModal() {\n      document.getElementById('gameOrderModal').classList.add('hidden');\n    }\n\n    async function handleApproveGameOrder() {\n      const key = document.getElementById('modalOrderId').value;\n      try {\n        await fetch(`${FIREBASE_DB_URL}user_game_orders/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ status: 'completed' })\n        });\n\n        if (cloudGameOrders[key]) {\n          cloudGameOrders[key].status = 'completed';\n        }\n\n        closeOrderModal();\n        renderGameOrdersTable();\n        updateOrderMetrics();\n        showToast('အောင်မြင်ပါသည်', `Order #${key} အား စိန်ဖြည့်သွင်းပြီးအဖြစ် အတည်ပြုလိုက်ပါပြီ`, 'success');\n      } catch (e) {\n        showToast('အမှား', 'အတည်ပြုခြင်း မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    async function handleRejectGameOrder() {\n      const key = document.getElementById('modalOrderId').value;\n      try {\n        await fetch(`${FIREBASE_DB_URL}user_game_orders/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ status: 'rejected' })\n        });\n\n        if (cloudGameOrders[key]) {\n          cloudGameOrders[key].status = 'rejected';\n        }\n\n        closeOrderModal();\n        renderGameOrdersTable();\n        updateOrderMetrics();\n        showToast('ပယ်ဖျက်ပြီး', `Order #${key} ကို ပယ်ဖျက်လိုက်ပါပြီ`, 'error');\n      } catch (e) {\n        showToast('အမှား', 'ပယ်ဖျက်ခြင်း မအောင်မြင်ပါ', 'error');\n      }\n    }\n\n    function updateOrderMetrics() {\n      const orderKeys = Object.keys(cloudGameOrders);\n      const pendingCount = orderKeys.filter(k => (cloudGameOrders[k].status || 'pending') === 'pending').length;\n      const completedCount = orderKeys.filter(k => cloudGameOrders[k].status === 'completed').length;\n\n      document.getElementById('metricPendingGameOrders').innerText = pendingCount;\n      document.getElementById('metricCompletedGameOrders').innerText = completedCount;\n\n      const totalSales = orderKeys\n        .filter(k => cloudGameOrders[k].status === 'completed' && cloudGameOrders[k].price)\n        .reduce((sum, k) => sum + (Number(cloudGameOrders[k].price) || 0), 0);\n\n      document.getElementById('metricTotalGameSales').innerText = `${totalSales.toLocaleString()} MMK`;\n    }\n\n    async function syncPlatformName() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}site_platform_config.json`);\n        const data = await res.json();\n        if (data && data.name) {\n          document.getElementById('sidebarBrandName').innerText = data.name;\n        }\n      } catch (e) {}\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      syncPlatformName();\n      fetchGameOrdersFromCloud();\n      setInterval(fetchGameOrdersFromCloud, 10000);\n    });\n  <\/script>\n</body>\n</html>", "AUser.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - User Accounts Control (AUser)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    body.forced-desktop {\n      min-width: 1200px !important;\n      overflow-x: auto !important;\n    }\n    body.forced-desktop #desktopSidebar {\n      display: flex !important;\n    }\n    body.forced-desktop #mobileBottomBar {\n      display: none !important;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- TOAST ALERT -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-circle-check\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== BALANCE ADJUST MODAL (+ / -) ==================== -->\n  <div id=\"balanceModal\" class=\"fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4\">\n    <div class=\"bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 w-full max-w-sm rounded-[32px] p-6 shadow-2xl space-y-4\">\n      <div class=\"flex items-center justify-between pb-2 border-b border-slate-100 dark:border-white/10\">\n        <div class=\"flex items-center gap-2\">\n          <div class=\"w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-500 flex items-center justify-center text-xs\">\n            <i class=\"fa-solid fa-coins\"></i>\n          </div>\n          <h3 class=\"font-bold text-sm text-slate-900 dark:text-white\">လက်ကျန်ငွေ နှုတ်/ပေါင်း ပြင်ဆင်ရန်</h3>\n        </div>\n        <button onclick=\"closeBalanceModal()\" class=\"w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-white\">\n          <i class=\"fa-solid fa-xmark\"></i>\n        </button>\n      </div>\n\n      <input type=\"hidden\" id=\"balanceTargetUserId\">\n\n      <div class=\"space-y-3 text-xs\">\n        <div class=\"p-3 rounded-2xl bg-slate-50 dark:bg-white/[0.02] border border-slate-200 dark:border-white/5 space-y-1\">\n          <div class=\"text-slate-400 text-[10px]\">အကောင့်အမည်: <span id=\"balanceModalUserName\" class=\"text-slate-900 dark:text-white font-bold\"></span></div>\n          <div class=\"text-slate-400 text-[10px]\">လက်ရှိငွေ: <span id=\"balanceModalCurrent\" class=\"text-emerald-500 font-bold font-mono\"></span></div>\n        </div>\n\n        <div>\n          <label class=\"block text-slate-400 mb-1 font-semibold\">လုပ်ဆောင်ချက် ရွေးချယ်ပါ:</label>\n          <div class=\"grid grid-cols-2 gap-2\">\n            <button type=\"button\" onclick=\"setBalanceAction('add')\" id=\"btnActionAdd\" class=\"py-2 rounded-xl bg-emerald-500 text-white font-bold flex items-center justify-center gap-1.5 transition\">\n              <i class=\"fa-solid fa-plus\"></i> ငွေပေါင်းထည့်မည်\n            </button>\n            <button type=\"button\" onclick=\"setBalanceAction('deduct')\" id=\"btnActionDeduct\" class=\"py-2 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold flex items-center justify-center gap-1.5 transition\">\n              <i class=\"fa-solid fa-minus\"></i> ငွေနှုတ်ယူမည်\n            </button>\n          </div>\n        </div>\n\n        <div>\n          <label class=\"block text-slate-400 mb-1 font-semibold\">ငွေပမာဏ (MMK):</label>\n          <input type=\"number\" id=\"inputBalanceAmount\" placeholder=\"ဥပမာ: 5000\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white font-mono font-bold outline-none focus:border-emerald-500\">\n        </div>\n      </div>\n\n      <div class=\"flex gap-2 pt-2\">\n        <button onclick=\"closeBalanceModal()\" class=\"flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-600 dark:text-slate-300\">\n          မလုပ်တော့ပါ\n        </button>\n        <button onclick=\"submitBalanceAdjust()\" class=\"flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition\">\n          အတည်ပြုမည်\n        </button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== DEPOSIT FREEZE / LOCK MODAL ==================== -->\n  <div id=\"freezeModal\" class=\"fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4\">\n    <div class=\"bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 w-full max-w-sm rounded-[32px] p-6 shadow-2xl space-y-4\">\n      <div class=\"flex items-center justify-between pb-2 border-b border-slate-100 dark:border-white/10\">\n        <div class=\"flex items-center gap-2\">\n          <div class=\"w-8 h-8 rounded-xl bg-amber-500/20 text-amber-500 flex items-center justify-center text-xs\">\n            <i class=\"fa-solid fa-clock\"></i>\n          </div>\n          <h3 class=\"font-bold text-sm text-slate-900 dark:text-white\">ငွေဖြည့်သွင်းခွင့် ကန့်သတ်ခြင်း</h3>\n        </div>\n        <button onclick=\"closeFreezeModal()\" class=\"w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-white\">\n          <i class=\"fa-solid fa-xmark\"></i>\n        </button>\n      </div>\n\n      <input type=\"hidden\" id=\"freezeTargetUserId\">\n\n      <div class=\"space-y-3 text-xs\">\n        <p class=\"text-slate-400 text-[11px]\">\n          ဤ User အား သတ်မှတ်အချိန်အတွင်း ငွေဖြည့်သွင်းမှု (payment.html) အသုံးပြုခွင့်ကို ပိတ်ပင်ထားပါမည်။\n        </p>\n\n        <div>\n          <label class=\"block text-slate-400 mb-1 font-semibold\">ပိတ်ထားမည့် အချိန်သတ်မှတ်ပါ:</label>\n          <select id=\"freezeDurationSelect\" class=\"w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white outline-none focus:border-amber-500 font-bold\">\n            <option value=\"1\">၁ နာရီ (1 Hour)</option>\n            <option value=\"6\">၆ နာရီ (6 Hours)</option>\n            <option value=\"24\">၂၄ နာရီ (1 Day)</option>\n            <option value=\"72\">၃ ရက် (3 Days)</option>\n            <option value=\"168\">၇ ရက် (1 Week)</option>\n            <option value=\"999999\">အပြီးပိတ်ထားမည် (Permanent)</option>\n            <option value=\"0\">ကန့်သတ်ချက် ပြန်ဖွင့်ပေးမည် (Unfreeze)</option>\n          </select>\n        </div>\n      </div>\n\n      <div class=\"flex gap-2 pt-2\">\n        <button onclick=\"closeFreezeModal()\" class=\"flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-600 dark:text-slate-300\">\n          မလုပ်တော့ပါ\n        </button>\n        <button onclick=\"submitDepositFreeze()\" class=\"flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-black font-bold text-xs shadow-md transition\">\n          သိမ်းဆည်းမည်\n        </button>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION (DESKTOP MODE) ==================== -->\n  <aside id=\"desktopSidebar\" class=\"w-64 bg-white dark:bg-[#080d19] border-r border-slate-200 dark:border-white/5 flex-col justify-between shrink-0 hidden lg:flex\">\n    <div>\n      <div class=\"px-6 py-5 flex items-center gap-3 border-b border-slate-200 dark:border-white/5\">\n        <div class=\"w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 text-white flex items-center justify-center text-lg shadow-lg shadow-blue-500/20 font-black\">\n          <i class=\"fa-solid fa-gamepad\"></i>\n        </div>\n        <div>\n          <h1 class=\"text-base font-extrabold text-slate-900 dark:text-white tracking-wide\" id=\"sidebarBrandName\">GameAdmin</h1>\n          <p class=\"text-[10px] text-blue-500 font-mono\">User Control Hub</p>\n        </div>\n      </div>\n\n      <nav class=\"p-4 space-y-1 text-xs font-semibold\">\n        <a href=\"admin.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-house text-sm w-4 text-center\"></i>\n          <span>Home Dashboard</span>\n        </a>\n        <a href=\"AUser.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition\">\n          <i class=\"fa-solid fa-users text-sm w-4 text-center\"></i>\n          <span>Users Management (AUser)</span>\n        </a>\n        <a href=\"Aimage.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-images text-sm w-4 text-center text-sky-400\"></i>\n          <span>Banners (AImage)</span>\n        </a>\n        <a href=\"APremiumemoji.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-crown text-sm w-4 text-center text-amber-500\"></i>\n          <span>Premium Emoji (11 Tiers)</span>\n        </a>\n        <a href=\"APayment.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & Slips</span>\n        </a>\n        <a href=\"AEvent.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-wand-magic-sparkles text-sm w-4 text-center text-amber-400\"></i>\n          <span>Events & Seasons</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders Management</span>\n
