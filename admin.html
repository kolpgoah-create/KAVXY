   </a>\n        <a href=\"Asetting.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gear text-sm w-4 text-center\"></i>\n          <span>Settings</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"index.html\" target=\"_blank\" class=\"w-full py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-up-right-from-square text-xs text-blue-500\"></i>\n        <span>Live Index ကြည့်မည်</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN WORKSPACE ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll pb-20 lg:pb-6\">\n    \n    <!-- Header -->\n    <header class=\"h-16 border-b border-slate-200 dark:border-white/5 bg-white/90 dark:bg-[#0a0f1d]/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30\">\n      <div class=\"flex items-center gap-3\">\n        <a href=\"admin.html\" class=\"lg:hidden w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-600 dark:text-slate-300\">\n          <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        </a>\n        <div>\n          <h2 class=\"text-sm font-extrabold text-slate-900 dark:text-white leading-tight\">Users Management (AUser)</h2>\n          <span class=\"text-[10px] text-emerald-400 font-mono flex items-center gap-1\">\n            <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse\"></span> Live Activity Monitor\n          </span>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-2 sm:gap-3\">\n        <button onclick=\"toggleDeviceLayout()\" id=\"deviceToggleBtn\" class=\"px-2.5 py-1.5 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-500 font-bold text-xs flex items-center gap-1.5 active:scale-95 transition\" title=\"ဗားရှင်းပြောင်းမည်\">\n          <i id=\"deviceToggleIcon\" class=\"fa-solid fa-desktop\"></i>\n          <span id=\"deviceToggleText\">PC ဗားရှင်း</span>\n        </button>\n\n        <button onclick=\"toggleTheme()\" class=\"w-8 h-8 rounded-xl bg-slate-100 dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center active:scale-95 transition\">\n          <i id=\"themeToggleIcon\" class=\"fa-solid fa-moon text-blue-500\"></i>\n        </button>\n\n        <button onclick=\"fetchUsersData()\" class=\"px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs flex items-center gap-1.5 transition shadow\">\n          <i class=\"fa-solid fa-rotate-right text-xs\"></i>\n          <span class=\"hidden sm:inline\">Refresh</span>\n        </button>\n      </div>\n    </header>\n\n    <!-- Main Content -->\n    <main class=\"p-4 sm:p-6 space-y-6\">\n\n      <!-- Metrics Row -->\n      <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-1 shadow-sm\">\n          <span class=\"text-[10px] text-slate-400 font-bold uppercase\">Total Users</span>\n          <div class=\"text-xl font-black text-slate-900 dark:text-white font-mono\" id=\"metricTotalUsers\">0</div>\n        </div>\n\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-1 shadow-sm\">\n          <span class=\"text-[10px] text-emerald-400 font-bold uppercase flex items-center gap-1\">\n            <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse\"></span> Active Online\n          </span>\n          <div class=\"text-xl font-black text-emerald-500 font-mono\" id=\"metricActiveUsers\">0</div>\n        </div>\n\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-1 shadow-sm\">\n          <span class=\"text-[10px] text-rose-400 font-bold uppercase\">Banned Accounts</span>\n          <div class=\"text-xl font-black text-rose-500 font-mono\" id=\"metricBannedUsers\">0</div>\n        </div>\n\n        <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-1 shadow-sm\">\n          <span class=\"text-[10px] text-amber-400 font-bold uppercase\">Deposit Locked</span>\n          <div class=\"text-xl font-black text-amber-500 font-mono\" id=\"metricFrozenUsers\">0</div>\n        </div>\n      </div>\n\n      <!-- SEARCH BOX WITH MAGNIFYING GLASS -->\n      <div class=\"p-4 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 shadow-sm space-y-3\">\n        <div class=\"flex items-center justify-between\">\n          <h3 class=\"text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2\">\n            <i class=\"fa-solid fa-magnifying-glass text-blue-500\"></i> အကောင့်ရှာဖွေခြင်း (Search Accounts)\n          </h3>\n          <span class=\"text-[10px] text-slate-400\" id=\"searchResultsCount\">0 accounts</span>\n        </div>\n\n        <div class=\"relative\">\n          <div class=\"absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400\">\n            <i class=\"fa-solid fa-magnifying-glass text-xs\"></i>\n          </div>\n          <input type=\"text\" id=\"userSearchInput\" oninput=\"handleSearch(this.value)\" placeholder=\"Username, ဖုန်းနံပါတ် သို့မဟုတ် အီးမေးလ်ဖြင့် ရှာပါ...\" class=\"w-full pl-9 pr-8 py-2 rounded-xl bg-slate-50 dark:bg-[#080d19] border border-slate-200 dark:border-white/10 text-xs text-slate-900 dark:text-white font-semibold outline-none focus:border-blue-500 transition\">\n          <button id=\"clearSearchBtn\" onclick=\"clearSearch()\" class=\"absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white hidden\">\n            <i class=\"fa-solid fa-circle-xmark text-xs\"></i>\n          </button>\n        </div>\n      </div>\n\n      <!-- USERS TABLE CONTAINER -->\n      <div class=\"p-4 sm:p-5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200/80 dark:border-white/5 space-y-3 shadow-sm\">\n        <div class=\"overflow-x-auto\">\n          <table class=\"w-full text-left text-xs\">\n            <thead>\n              <tr class=\"text-slate-400 border-b border-slate-200 dark:border-white/5 text-[10px] font-bold uppercase\">\n                <th class=\"py-2.5 px-3\">Status</th>\n                <th class=\"py-2.5 px-3\">Username</th>\n                <th class=\"py-2.5 px-3\">Phone</th>\n                <th class=\"py-2.5 px-3\">Balance</th>\n                <th class=\"py-2.5 px-3\">Deposit Access</th>\n                <th class=\"py-2.5 px-3\">Account State</th>\n                <th class=\"py-2.5 px-3 text-right\">Actions</th>\n              </tr>\n            </thead>\n            <tbody id=\"usersTableBody\" class=\"divide-y divide-slate-100 dark:divide-white/5\">\n              <!-- Rendered via JS -->\n            </tbody>\n          </table>\n        </div>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- MOBILE BOTTOM BAR -->\n  <nav id=\"mobileBottomBar\" class=\"fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 py-2.5 px-4 lg:hidden\">\n    <div class=\"max-w-md mx-auto flex items-center justify-around text-center\">\n      <a href=\"admin.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-house text-base\"></i><span class=\"text-[10px] font-semibold\">Home</span></a>\n      <a href=\"AUser.html\" class=\"flex flex-col items-center gap-0.5 text-blue-500\"><i class=\"fa-solid fa-users text-base\"></i><span class=\"text-[10px] font-bold\">Users</span></a>\n      <a href=\"APayment.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-credit-card text-base\"></i><span class=\"text-[10px] font-semibold\">Payment</span></a>\n      <a href=\"AOrder.html\" class=\"flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-500 transition\"><i class=\"fa-solid fa-file-lines text-base\"></i><span class=\"text-[10px] font-semibold\">Orders</span></a>\n    </div>\n  </nav>\n\n  <!-- JAVASCRIPT LOGIC & FIREBASE REALTIME ENGINE -->\n  <script>\n    const FIREBASE_DB_URL = \"https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/\";\n    const THEME_STORAGE_KEY = 'admin_theme_mode';\n    const LAYOUT_MODE_KEY = 'admin_device_layout_mode';\n\n    let allUsersList = [];\n    let currentBalanceAction = 'add';\n    let toastTimeout = null;\n\n    // ၁။ PC / MOBILE LAYOUT\n    function applyDeviceLayout(mode) {\n      const text = document.getElementById('deviceToggleText');\n      const icon = document.getElementById('deviceToggleIcon');\n      const meta = document.getElementById('viewportMeta');\n\n      if (mode === 'desktop') {\n        document.body.classList.add('forced-desktop');\n        text.innerText = \"Phone ဗားရှင်း\";\n        icon.className = \"fa-solid fa-mobile-screen\";\n        meta.setAttribute('content', 'width=1200, user-scalable=yes');\n      } else {\n        document.body.classList.remove('forced-desktop');\n        text.innerText = \"PC ဗားရှင်း\";\n        icon.className = \"fa-solid fa-desktop\";\n        meta.setAttribute('content', 'width=device-width, initial-scale=1.0');\n      }\n      localStorage.setItem(LAYOUT_MODE_KEY, mode);\n    }\n\n    function toggleDeviceLayout() {\n      const current = localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile';\n      applyDeviceLayout(current === 'mobile' ? 'desktop' : 'mobile');\n    }\n\n    // ၂။ THEME (DARK / LIGHT)\n    function toggleTheme() {\n      const isDark = document.documentElement.classList.toggle('dark');\n      const icon = document.getElementById('themeToggleIcon');\n      icon.className = isDark ? \"fa-solid fa-moon text-blue-500\" : \"fa-solid fa-sun text-amber-500\";\n      localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');\n    }\n\n    function initTheme() {\n      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';\n      if (savedTheme === 'light') {\n        document.documentElement.classList.remove('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-sun text-amber-500\";\n      } else {\n        document.documentElement.classList.add('dark');\n        document.getElementById('themeToggleIcon').className = \"fa-solid fa-moon text-blue-500\";\n      }\n      if ((localStorage.getItem(LAYOUT_MODE_KEY) || 'mobile') === 'desktop') applyDeviceLayout('desktop');\n    }\n\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'info') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-info';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3000);\n    }\n\n    // ၃။ FIREBASE မှ USER အချက်အလက်များ ဆွဲယူခြင်း\n    async function fetchUsersData() {\n      try {\n        const res = await fetch(`${FIREBASE_DB_URL}registered_users_db.json`);\n        const data = await res.json();\n\n        if (data) {\n          // Object သို့မဟုတ် Array ပုံစံဖြင့် လာသောအခါ ချိန်ညှိခြင်း\n          if (Array.isArray(data)) {\n            allUsersList = data.filter(u => u !== null).map((u, i) => ({ ...u, key: i }));\n          } else {\n            allUsersList = Object.keys(data).map(k => ({ ...data[k], key: k }));\n          }\n        } else {\n          // Cloud တွင်မရှိပါက LocalStorage မှ ယာယီဆွဲယူခြင်း\n          const local = localStorage.getItem('registered_users_db');\n          allUsersList = local ? JSON.parse(local).map((u, i) => ({ ...u, key: i })) : [];\n        }\n\n        renderUsersTable(allUsersList);\n        updateUserMetrics();\n      } catch (err) {\n        const local = localStorage.getItem('registered_users_db');\n        allUsersList = local ? JSON.parse(local).map((u, i) => ({ ...u, key: i })) : [];\n        renderUsersTable(allUsersList);\n        updateUserMetrics();\n      }\n    }\n\n    // ၄။ USERS TABLE ပြသခြင်း & ONLINE STATUS\n    function renderUsersTable(list) {\n      const tbody = document.getElementById('usersTableBody');\n      tbody.innerHTML = '';\n      document.getElementById('searchResultsCount').innerText = `${list.length} accounts`;\n\n      if (list.length === 0) {\n        tbody.innerHTML = `<tr><td colspan=\"7\" class=\"py-8 text-center text-slate-400 font-bold\">အကောင့်မရှိသေးပါ</td></tr>`;\n        return;\n      }\n\n      const now = Date.now();\n\n      list.forEach(u => {\n        const tr = document.createElement('tr');\n        tr.className = \"hover:bg-slate-50 dark:hover:bg-white/[0.02] transition\";\n\n        // Online Status: နောက်ဆုံး Active ဖြစ်သည့်အချိန် (၃ မိနစ်အတွင်း) ရှိပါက Online ဟု သတ်မှတ်မည်\n        const lastActive = u.lastActiveTime || 0;\n        const isOnline = (now - lastActive) < (3 * 60 * 1000);\n        const statusBadge = isOnline \n          ? `<span class=\"inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500 border border-emerald-500/30 text-[10px] font-black\"><span class=\"w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse\"></span> Active</span>`\n          : `<span class=\"inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-slate-200 dark:bg-white/5 text-slate-400 text-[10px] font-semibold\"><span class=\"w-1.5 h-1.5 rounded-full bg-slate-400\"></span> Offline</span>`;\n\n        // Banned Status\n        const isBanned = u.isBanned === true;\n        const banBadge = isBanned\n          ? `<span class=\"px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-500 border border-rose-500/30 text-[9px] font-black\">BANNED</span>`\n          : `<span class=\"px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 text-[9px] font-bold\">NORMAL</span>`;\n\n        // Deposit Lock / Freeze Status\n        const freezeUntil = u.depositFrozenUntil || 0;\n        const isFrozen = freezeUntil > now;\n        let freezeDisplay = `<span class=\"text-emerald-500 font-bold text-[10px]\">ခွင့်ပြုထားသည်</span>`;\n        if (isFrozen) {\n          const remainingMinutes = Math.round((freezeUntil - now) / 60000);\n          freezeDisplay = `<span class=\"text-amber-500 font-bold text-[10px] flex items-center gap-1\"><i class=\"fa-solid fa-lock\"></i> ပိတ်ထားသည် (${remainingMinutes > 1440 ? Math.round(remainingMinutes/1440) + 'ရက်' : remainingMinutes + 'မိနစ်'})</span>`;\n        }\n\n        const balance = Number(u.balance || 0);\n\n        tr.innerHTML = `\n          <td class=\"py-3 px-3\">${statusBadge}</td>\n          <td class=\"py-3 px-3\">\n            <div class=\"font-bold text-slate-900 dark:text-white\">${u.username || 'User'}</div>\n            <div class=\"text-[9px] text-slate-400 font-mono\">${u.email || '-'}</div>\n          </td>\n          <td class=\"py-3 px-3 font-mono font-bold text-slate-600 dark:text-slate-300\">${u.phone || '-'}</td>\n          <td class=\"py-3 px-3\">\n            <div class=\"font-mono font-black text-emerald-500\">${balance.toLocaleString()} MMK</div>\n          </td>\n          <td class=\"py-3 px-3\">${freezeDisplay}</td>\n          <td class=\"py-3 px-3\">${banBadge}</td>\n          <td class=\"py-3 px-3 text-right\">\n            <div class=\"flex items-center justify-end gap-1.5\">\n              <!-- ငွေပြင်ဆင်သည့် ခလုတ် (+ / -) -->\n              <button onclick=\"openBalanceModal('${u.key}', '${u.username}', ${balance})\" class=\"w-7 h-7 rounded-lg bg-emerald-500/15 hover:bg-emerald-500 text-emerald-500 hover:text-white flex items-center justify-center transition active:scale-95\" title=\"ငွေ နှုတ်/ပေါင်း မည်\">\n                <i class=\"fa-solid fa-coins text-xs\"></i>\n              </button>\n\n              <!-- ငွေဖြည့်ခွင့် ကန့်သတ်ခလုတ် -->\n              <button onclick=\"openFreezeModal('${u.key}')\" class=\"w-7 h-7 rounded-lg bg-amber-500/15 hover:bg-amber-500 text-amber-500 hover:text-black flex items-center justify-center transition active:scale-95\" title=\"ငွေဖြည့်ခွင့် ပိတ်မည်\">\n                <i class=\"fa-solid fa-lock text-xs\"></i>\n              </button>\n\n              <!-- ဖြုတ်ချမည့် ခလုတ် (Kick / Force Logout) -->\n              <button onclick=\"kickUser('${u.key}')\" class=\"w-7 h-7 rounded-lg bg-blue-500/15 hover:bg-blue-500 text-blue-500 hover:text-white flex items-center justify-center transition active:scale-95\" title=\"အကောင့် ဖြုတ်ချမည် (Kick)\">\n                <i class=\"fa-solid fa-right-from-bracket text-xs\"></i>\n              </button>\n\n              <!-- Ban / Unban ခလုတ် -->\n              <button onclick=\"toggleBanUser('${u.key}', ${isBanned})\" class=\"w-7 h-7 rounded-lg ${isBanned ? 'bg-emerald-500/20 text-emerald-500 hover:bg-emerald-500 hover:text-white' : 'bg-rose-500/15 text-rose-500 hover:bg-rose-500 hover:text-white'} flex items-center justify-center transition active:scale-95\" title=\"${isBanned ? 'Unban မည်' : 'Ban မည်'}\">\n                <i class=\"fa-solid ${isBanned ? 'fa-unlock' : 'fa-ban'} text-xs\"></i>\n              </button>\n            </div>\n          </td>\n        `;\n        tbody.appendChild(tr);\n      });\n    }\n\n    // ၅။ SEARCH LOGIC\n    function handleSearch(query) {\n      const q = query.trim().toLowerCase();\n      const clearBtn = document.getElementById('clearSearchBtn');\n      if (q) clearBtn.classList.remove('hidden');\n      else clearBtn.classList.add('hidden');\n\n      const filtered = allUsersList.filter(u => \n        (u.username && u.username.toLowerCase().includes(q)) ||\n        (u.phone && u.phone.includes(q)) ||\n        (u.email && u.email.toLowerCase().includes(q))\n      );\n      renderUsersTable(filtered);\n    }\n\n    function clearSearch() {\n      const input = document.getElementById('userSearchInput');\n      input.value = '';\n      document.getElementById('clearSearchBtn').classList.add('hidden');\n      renderUsersTable(allUsersList);\n    }\n\n    // ၆။ BALANCE ADJUST MODAL (+ / -)\n    function openBalanceModal(key, name, currentBal) {\n      document.getElementById('balanceTargetUserId').value = key;\n      document.getElementById('balanceModalUserName').innerText = name;\n      document.getElementById('balanceModalCurrent').innerText = `${currentBal.toLocaleString()} MMK`;\n      document.getElementById('inputBalanceAmount').value = '';\n      setBalanceAction('add');\n      document.getElementById('balanceModal').classList.remove('hidden');\n    }\n\n    function closeBalanceModal() {\n      document.getElementById('balanceModal').classList.add('hidden');\n    }\n\n    function setBalanceAction(action) {\n      currentBalanceAction = action;\n      const btnAdd = document.getElementById('btnActionAdd');\n      const btnDeduct = document.getElementById('btnActionDeduct');\n\n      if (action === 'add') {\n        btnAdd.className = \"py-2 rounded-xl bg-emerald-500 text-white font-bold flex items-center justify-center gap-1.5 transition\";\n        btnDeduct.className = \"py-2 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold flex items-center justify-center gap-1.5 transition\";\n      } else {\n        btnDeduct.className = \"py-2 rounded-xl bg-rose-500 text-white font-bold flex items-center justify-center gap-1.5 transition\";\n        btnAdd.className = \"py-2 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold flex items-center justify-center gap-1.5 transition\";\n      }\n    }\n\n    async function submitBalanceAdjust() {\n      const key = document.getElementById('balanceTargetUserId').value;\n      const amount = parseFloat(document.getElementById('inputBalanceAmount').value);\n\n      if (!amount || amount <= 0) {\n        showToast(\"မှားယွင်းမှု\", \"ငွေပမာဏ မှန်ကန်စွာ ထည့်ပေးပါ\", \"error\");\n        return;\n      }\n\n      const user = allUsersList.find(u => String(u.key) === String(key));\n      if (!user) return;\n\n      let currentBal = Number(user.balance || 0);\n      let newBal = currentBalanceAction === 'add' ? (currentBal + amount) : (currentBal - amount);\n\n      if (newBal < 0) newBal = 0;\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}registered_users_db/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ balance: newBal })\n        });\n\n        closeBalanceModal();\n        fetchUsersData();\n        showToast(\"အောင်မြင်ပါသည်\", `${user.username} ၏ လက်ကျန်ငွေအား ${newBal.toLocaleString()} MMK သို့ ပြောင်းလဲလိုက်ပါပြီ`);\n      } catch (e) {\n        showToast(\"အမှား\", \"ငွေပြင်ဆင်မှု မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    // ၇။ DEPOSIT FREEZE / LOCK LOGIC (အချိန်နှင့် ပိတ်ခြင်း)\n    function openFreezeModal(key) {\n      document.getElementById('freezeTargetUserId').value = key;\n      document.getElementById('freezeModal').classList.remove('hidden');\n    }\n\n    function closeFreezeModal() {\n      document.getElementById('freezeModal').classList.add('hidden');\n    }\n\n    async function submitDepositFreeze() {\n      const key = document.getElementById('freezeTargetUserId').value;\n      const hours = parseInt(document.getElementById('freezeDurationSelect').value);\n      const user = allUsersList.find(u => String(u.key) === String(key));\n\n      let untilTime = 0;\n      if (hours > 0) {\n        untilTime = Date.now() + (hours * 60 * 60 * 1000);\n      }\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}registered_users_db/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ depositFrozenUntil: untilTime })\n        });\n\n        closeFreezeModal();\n        fetchUsersData();\n        showToast(\"သိမ်းဆည်းပြီး\", hours > 0 ? `${user.username} အား ငွေဖြည့်ခွင့် ကန့်သတ်လိုက်ပါပြီ` : \"ငွေဖြည့်ခွင့် ပြန်လည်ဖွင့်ပေးလိုက်ပါပြီ\");\n      } catch (e) {\n        showToast(\"အမှား\", \"မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    // ၈။ BAN / UNBAN USER\n    async function toggleBanUser(key, currentBanned) {\n      const newStatus = !currentBanned;\n      const confirmMsg = newStatus ? \"ဤအကောင့်ကို Ban ရန် သေချာပါသလား?\" : \"ဤအကောင့်ကို Unban ပြန်လုပ်ရန် သေချာပါသလား?\";\n      if (!confirm(confirmMsg)) return;\n\n      try {\n        await fetch(`${FIREBASE_DB_URL}registered_users_db/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ isBanned: newStatus })\n        });\n\n        fetchUsersData();\n        showToast(newStatus ? \"Ban ပြီးပါပြီ\" : \"Unban ပြီးပါပြီ\", newStatus ? \"အကောင့်ဝင်ရောက်ခွင့် ပိတ်လိုက်ပါပြီ\" : \"အကောင့်ပြန်လည် အသုံးပြုနိုင်ပါပြီ\");\n      } catch (e) {\n        showToast(\"အမှား\", \"မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    // ၉။ KICK USER (SESSION ဖြုတ်ချခြင်း)\n    async function kickUser(key) {\n      if (!confirm(\"ဤ User ၏ လက်ရှိ Session ကို ဖြုတ်ချ (Kick) ရန် သေချာပါသလား?\")) return;\n\n      try {\n        // Kick Token သို့မဟုတ် forceLogout flag ပေးပို့ခြင်း\n        await fetch(`${FIREBASE_DB_URL}registered_users_db/${key}.json`, {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ forceLogout: Date.now() })\n        });\n\n        showToast(\"ဖြုတ်ချပြီးပါပြီ\", \"User ထံမှ Session ကို ချက်ချင်း ဖြုတ်ချလိုက်ပါပြီ\");\n      } catch (e) {\n        showToast(\"အမှား\", \"Kick မအောင်မြင်ပါ\", \"error\");\n      }\n    }\n\n    // METRICS UPDATE\n    function updateUserMetrics() {\n      const now = Date.now();\n      const total = allUsersList.length;\n      const active = allUsersList.filter(u => (now - (u.lastActiveTime || 0)) < (3 * 60 * 1000)).length;\n      const banned = allUsersList.filter(u => u.isBanned === true).length;\n      const frozen = allUsersList.filter(u => (u.depositFrozenUntil || 0) > now).length;\n\n      document.getElementById('metricTotalUsers').innerText = total;\n      document.getElementById('metricActiveUsers').innerText = active;\n      document.getElementById('metricBannedUsers').innerText = banned;\n      document.getElementById('metricFrozenUsers').innerText = frozen;\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      initTheme();\n      fetchUsersData();\n      setInterval(fetchUsersData, 8000); // ၈ စက္ကန့်တစ်ကြိမ် အလိုအလျောက် Live စစ်ဆေးမည်\n    });\n  <\/script>\n</body>\n</html>", "APeport.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Admin - Financial & Sales Reports (AReport)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons CDN -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n\n  <!-- Google Fonts CDN -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <!-- Chart.js CDN -->\n  <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      background-color: #0a0f1d;\n      color: #e2e8f0;\n      -webkit-tap-highlight-color: transparent;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n  </style>\n</head>\n\n<body class=\"min-h-screen flex overflow-x-hidden\">\n\n  <!-- ==================== TOAST ALERT ==================== -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-[#0e1629] border border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-circle-check\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION ==================== -->\n  <aside class=\"w-64 bg-[#080d19] border-r border-white/5 flex flex-col justify-between shrink-0 hidden lg:flex\">\n    <div>\n      <div class=\"px-6 py-5 flex items-center gap-3 border-b border-white/5\">\n        <div class=\"w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-lg shadow-lg shadow-blue-500/20\">\n          <i class=\"fa-solid fa-gamepad\"></i>\n        </div>\n        <div>\n          <h1 class=\"text-base font-extrabold text-white tracking-wide\">GameAdmin</h1>\n          <p class=\"text-[10px] text-slate-400 font-mono\">Reports & Analytics</p>\n        </div>\n      </div>\n\n      <nav class=\"p-4 space-y-1 text-xs font-semibold\">\n        <a href=\"admin.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-house text-sm w-4 text-center\"></i>\n          <span>Home</span>\n        </a>\n        <a href=\"AUser.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-users text-sm w-4 text-center\"></i>\n          <span>Users</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders</span>\n        </a>\n        <a href=\"APayment.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & QR</span>\n        </a>\n        <a href=\"AGame.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gamepad text-sm w-4 text-center\"></i>\n          <span>Games (AGame)</span>\n        </a>\n        <a href=\"AMlbb.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-400 hover:text-white hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-gem text-sm w-4 text-center text-cyan-400\"></i>\n          <span>MLBB Engine (AMlbb)</span>\n        </a>\n        <a href=\"AReport.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition\">\n          <i class=\"fa-solid fa-chart-column text-sm w-4 text-center\"></i>\n          <span>Reports (AReport)</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"admin.html\" class=\"w-full py-2.5 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        <span>Back to Admin Home</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN CONTENT ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll\">\n    \n    <!-- Top Header -->\n    <header class=\"h-16 border-b border-white/5 bg-[#0a0f1d]/90 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-30\">\n      <div class=\"flex items-center gap-3\">\n        <a href=\"admin.html\" class=\"lg:hidden w-8 h-8 rounded-xl bg-white/[0.03] border border-white/10 flex items-center justify-center text-slate-300\">\n          <i class=\"fa-solid fa-arrow-left text-xs\"></i>\n        </a>\n        <div>\n          <h2 class=\"text-sm font-extrabold text-white leading-tight\">Sales & Revenue Reports</h2>\n          <span class=\"text-[10px] text-slate-400 font-mono\">Financial Insights & Transaction Analytics</span>\n        </div>\n      </div>\n\n      <div class=\"flex items-center gap-2\">\n        <button onclick=\"exportReportCSV()\" class=\"px-3 py-1.5 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/10 text-xs font-bold text-slate-300 flex items-center gap-1.5 transition\">\n          <i class=\"fa-solid fa-file-csv text-xs text-emerald-400\"></i>\n          <span>Export CSV</span>\n        </button>\n        <button onclick=\"window.print()\" class=\"px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition flex items-center gap-1.5 shadow active:scale-95\">\n          <i class=\"fa-solid fa-print text-xs\"></i>\n          <span class=\"hidden sm:inline\">Print Report</span>\n        </button>\n      </div>\n    </header>\n\n    <main class=\"p-6 space-y-6\">\n\n      <!-- Date Range Filter Bar -->\n      <div class=\"p-4 rounded-2xl bg-[#0e1629] border border-white/5 flex flex-col sm:flex-row items-center justify-between gap-3\">\n        <div class=\"flex items-center gap-2 text-xs text-slate-300 font-bold\">\n          <i class=\"fa-solid fa-calendar-days text-blue-400\"></i>\n          <span>အစီရင်ခံစာ ကာလအပိုင်းအခြား:</span>\n        </div>\n\n        <div class=\"flex items-center gap-1.5 w-full sm:w-auto text-xs font-bold\">\n          <button onclick=\"setReportRange('today')\" id=\"range-today\" class=\"flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-slate-400 hover:text-white bg-white/[0.03] border border-white/5 transition\">ယနေ့ (Today)</button>\n          <button onclick=\"setReportRange('7days')\" id=\"range-7days\" class=\"flex-1 sm:flex-none px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition\">၇ ရက် (7 Days)</button>\n          <button onclick=\"setReportRange('month')\" id=\"range-month\" class=\"flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-slate-400 hover:text-white bg-white/[0.03] border border-white/5 transition\">ဤလ (Month)</button>\n          <button onclick=\"setReportRange('all')\" id=\"range-all\" class=\"flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-slate-400 hover:text-white bg-white/[0.03] border border-white/5 transition\">အားလုံး (All)</button>\n        </div>\n      </div>\n\n      <!-- Financial Metric Summary Cards -->\n      <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-4\">\n        <!-- 1. Total Revenue -->\n        <div class=\"p-4 rounded-2xl bg-[#0e1629] border border-white/5 space-y-2\">\n          <div class=\"w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-sm\">\n            <i class=\"fa-solid fa-wallet\"></i>\n          </div>\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-semibold block uppercase\">စုစုပေါင်း အရောင်းဝင်ငွေ</span>\n            <span class=\"text-lg font-black text-white font-mono\" id=\"metricTotalRevenue\">0 MMK</span>\n          </div>\n          <span class=\"text-[10px] text-emerald-400 font-semibold flex items-center gap-1\">\n            <i class=\"fa-solid fa-arrow-trend-up text-[9px]\"></i> +18% <span class=\"text-slate-500\">ကာလတူထက်</span>\n          </span>\n        </div>\n\n        <!-- 2. Completed Orders -->\n        <div class=\"p-4 rounded-2xl bg-[#0e1629] border border-white/5 space-y-2\">\n          <div class=\"w-9 h-9 rounded-xl bg-blue-500/15 text-blue-400 flex items-center justify-center text-sm\">\n            <i class=\"fa-solid fa-circle-check\"></i>\n          </div>\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-semibold block uppercase\">အောင်မြင်ပြီး အော်ဒါများ</span>\n            <span class=\"text-lg font-black text-white font-mono\" id=\"metricCompletedOrders\">0 ခု</span>\n          </div>\n          <span class=\"text-[10px] text-blue-400 font-semibold flex items-center gap-1\">\n            <i class=\"fa-solid fa-check-double text-[9px]\"></i> 100% Verified\n          </span>\n        </div>\n\n        <!-- 3. Estimated Net Profit -->\n        <div class=\"p-4 rounded-2xl bg-[#0e1629] border border-white/5 space-y-2\">\n          <div class=\"w-9 h-9 rounded-xl bg-amber-500/15 text-amber-400 flex items-center justify-center text-sm\">\n            <i class=\"fa-solid fa-coins\"></i>\n          </div>\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-semibold block uppercase\">ခန့်မှန်း အသားတင်အမြတ်</span>\n            <span class=\"text-lg font-black text-amber-400 font-mono\" id=\"metricNetProfit\">0 MMK</span>\n          </div>\n          <span class=\"text-[10px] text-amber-400 font-semibold flex items-center gap-1\">\n            <i class=\"fa-solid fa-chart-line text-[9px]\"></i> Based on Margin\n          </span>\n        </div>\n\n        <!-- 4. Average Order Value -->\n        <div class=\"p-4 rounded-2xl bg-[#0e1629] border border-white/5 space-y-2\">\n          <div class=\"w-9 h-9 rounded-xl bg-purple-500/15 text-purple-400 flex items-center justify-center text-sm\">\n            <i class=\"fa-solid fa-scale-balanced\"></i>\n          </div>\n          <div>\n            <span class=\"text-[10px] text-slate-400 font-semibold block uppercase\">ပျမ်းမျှ အော်ဒါတန်ဖိုး</span>\n            <span class=\"text-lg font-black text-white font-mono\" id=\"metricAvgOrder\">0 MMK</span>\n          </div>\n          <span class=\"text-[10px] text-purple-400 font-semibold flex items-center gap-1\">\n            <i class=\"fa-solid fa-receipt text-[9px]\"></i> Per Transaction\n          </span>\n        </div>\n      </div>\n\n      <!-- Charts Row -->\n      <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n        \n        <!-- Left: Revenue Trend Chart (Line / Bar) -->\n        <div class=\"lg:col-span-2 p-5 rounded-2xl bg-[#0e1629] border border-white/5 space-y-3\">\n          <div class=\"flex items-center justify-between\">\n            <div>\n              <h3 class=\"text-xs font-bold text-white flex items-center gap-2\">\n                <i class=\"fa-solid fa-chart-area text-blue-500\"></i> အရောင်းဝင်ငွေ တက်ကျနှုန်းပြ ဂရပ် (Revenue Flow)\n              </h3>\n              <p class=\"text-[10px] text-slate-400 mt-0.5\">ရက်အလိုက် ငွေဝင်ငွေထွက်နှင့် အရောင်းပမာဏ လှုပ်ရှားမှု</p>\n            </div>\n            <span class=\"text-[10px] text-slate-400 bg-white/[0.03] border border-white/10 px-2.5 py-1 rounded-lg font-mono\">MMK Currency</span>\n          </div>\n          <div class=\"h-64 relative\">\n            <canvas id=\"revenueFlowChart\"></canvas>\n          </div>\n        </div>\n\n        <!-- Right: Game Category Breakdown Chart -->\n        <div class=\"p-5 rounded-2xl bg-[#0e1629] border border-white/5 space-y-3\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"text-xs font-bold text-white flex items-center gap-2\">\n              <i class=\"fa-solid fa-pie-chart text-purple-400\"></i> ဂိမ်းအလိုက် ရောင်းအားဝေစု\n            </h3>\n            <span class=\"text-[10px] text-slate-400 font-mono\">Top Share</span>\n          </div>\n          <div class=\"h-44 relative flex items-center justify-center\">\n            <canvas id=\"gameCategoryShareChart\"></canvas>\n          </div>\n          <!-- Breakdown Legend -->\n          <div class=\"space-y-1.5 text-[11px] pt-2 border-t border-white/5\">\n            <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5 text-slate-300\"><span class=\"w-2 h-2 rounded-full bg-blue-500\"></span> Mobile Legends</span><span class=\"font-bold text-white\" id=\"shareMlbb\">60%</span></div>\n            <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5 text-slate-300\"><span class=\"w-2 h-2 rounded-full bg-amber-500\"></span> PUBG Mobile</span><span class=\"font-bold text-white\" id=\"sharePubg\">22%</span></div>\n            <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5 text-slate-300\"><span class=\"w-2 h-2 rounded-full bg-rose-500\"></span> Free Fire</span><span class=\"font-bold text-white\" id=\"shareFf\">12%</span></div>\n            <div class=\"flex items-center justify-between\"><span class=\"flex items-center gap-1.5 text-slate-300\"><span class=\"w-2 h-2 rounded-full bg-purple-500\"></span> Other Games</span><span class=\"font-bold text-white\" id=\"shareOther\">6%</span></div>\n          </div>\n        </div>\n\n      </div>\n\n      <!-- Transaction Log Data Table -->\n      <div class=\"p-5 rounded-2xl bg-[#0e1629] border border-white/5 space-y-3\">\n        <div class=\"flex items-center justify-between\">\n          <div>\n            <h3 class=\"text-xs font-bold text-white flex items-center gap-2\">\n              <i class=\"fa-solid fa-receipt text-emerald-400\"></i> အတည်ပြုပြီး အရောင်းမှတ်တမ်းများ (Completed Audit Log)\n            </h3>\n            <p class=\"text-[10px] text-slate-400 mt-0.5\">ဝင်ငွေအဖြစ် အတည်ပြုပြီးစီးခဲ့သော ငွေလွှဲနှင့် အော်ဒါစာရင်းများ</p>\n          </div>\n          <span class=\"text-[10px] font-mono text-slate-400\" id=\"reportCountPill\">0 Transactions</span>\n        </div>\n\n        <div class=\"overflow-x-auto\">\n          <table class=\"w-full text-left text-xs\" id=\"reportDataTable\">\n            <thead>\n              <tr class=\"text-slate-400 border-b border-white/5 text-[10px] font-bold uppercase\">\n                <th class=\"py-2.5 px-3\">Order ID</th>\n                <th class=\"py-2.5 px-3\">Customer</th>\n                <th class=\"py-2.5 px-3\">Service / Item</th>\n                <th class=\"py-2.5 px-3\">Payment Channel</th>\n                <th class=\"py-2.5 px-3\">Date & Time</th>\n                <th class=\"py-2.5 px-3 text-right\">Revenue (MMK)</th>\n              </tr>\n            </thead>\n            <tbody id=\"reportTableBody\" class=\"divide-y divide-white/5\">\n              <!-- Rendered via JavaScript -->\n            </tbody>\n          </table>\n        </div>\n      </div>\n\n    </main>\n  </div>\n\n  <!-- ==================== JAVASCRIPT ==================== -->\n  <script>\n    const ORDERS_DB_KEY = 'user_orders_db';\n    let currentReportRange = '7days';\n    let revenueChartInstance = null;\n    let shareChartInstance = null;\n    let toastTimeout = null;\n\n    // Sample Audit Data if DB is clean\n    const DEFAULT_REPORT_ORDERS = [\n      { orderId: 'ORD-1023', userName: 'thura99', userPhone: '09904599001', gameTitle: 'Mobile Legends', packageName: '500 + 500 Diamonds', paymentMethod: 'KBZPay', approvedAmount: '45000', dateText: '20/10/2026, 09:30 PM', statusType: 'completed' },\n      { orderId: 'ORD-1022', userName: 'user123', userPhone: '09904599002', gameTitle: 'PUBG Mobile', packageName: 'UC 660', paymentMethod: 'WavePay', approvedAmount: '42000', dateText: '19/10/2026, 08:15 PM', statusType: 'completed' },\n      { orderId: 'ORD-1021', userName: 'aungko', userPhone: '09904599003', gameTitle: 'Mobile Legends', packageName: 'Weekly Diamond Pass', paymentMethod: 'Wallet Balance', approvedAmount: '6200', dateText: '18/10/2026, 04:40 PM', statusType: 'completed' },\n      { orderId: 'ORD-1020', userName: 'yoon123', userPhone: '09904599004', gameTitle: 'Free Fire', packageName: 'Diamond 520', paymentMethod: 'CBPay', approvedAmount: '28000', dateText: '17/10/2026, 02:10 PM', statusType: 'completed' },\n      { orderId: 'ORD-1019', userName: 'winhtet', userPhone: '09904599005', gameTitle: 'Mobile Legends', packageName: '250 + 250 Diamonds', paymentMethod: 'KBZPay', approvedAmount: '22500', dateText: '16/10/2026, 11:25 AM', statusType: 'completed' }\n    ];\n\n    function getAllCompletedOrders() {\n      const raw = localStorage.getItem(ORDERS_DB_KEY);\n      let orders = DEFAULT_REPORT_ORDERS;\n      if (raw) {\n        try {\n          const parsed = JSON.parse(raw);\n          if (Array.isArray(parsed) && parsed.length > 0) {\n            orders = parsed.filter(o => o.statusType === 'completed');\n          }\n        } catch (e) {}\n      }\n      return orders;\n    }\n\n    function setReportRange(range) {\n      currentReportRange = range;\n      ['today', '7days', 'month', 'all'].forEach(r => {\n        const btn = document.getElementById(`range-${r}`);\n        if (r === range) {\n          btn.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition';\n        } else {\n          btn.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-slate-400 hover:text-white bg-white/[0.03] border border-white/5 transition';\n        }\n      });\n      refreshReports();\n      showToast('အစီရင်ခံစာ မွမ်းမံပြီး', `${range.toUpperCase()} စာရင်းများကို တွက်ချက်ပြသလိုက်ပါပြီ`, 'info');\n    }\n\n    function refreshReports() {\n      const orders = getAllCompletedOrders();\n      \n      // Calculate Metrics\n      let totalRev = 0;\n      orders.forEach(o => {\n        if (o.approvedAmount) totalRev += Number(o.approvedAmount);\n        else if (o.packageName && o.packageName.includes('MMK')) {\n          const match = o.packageName.match(/(\\d+[\\d,]*)\\s*MMK/);\n          if (match) totalRev += Number(match[1].replace(/,/g, ''));\n        }\n      });\n\n      const orderCount = orders.length;\n      const avgOrder = orderCount > 0 ? Math.round(totalRev / orderCount) : 0;\n      const netProfit = Math.round(totalRev * 0.12); // Approx 12% average margin\n\n      document.getElementById('metricTotalRevenue').innerText = `${totalRev.toLocaleString()} MMK`;\n      document.getElementById('metricCompletedOrders').innerText = `${orderCount} ခု`;\n      document.getElementById('metricAvgOrder').innerText = `${avgOrder.toLocaleString()} MMK`;\n      document.getElementById('metricNetProfit').innerText = `${netProfit.toLocaleString()} MMK`;\n      document.getElementById('reportCountPill').innerText = `${orderCount} Transactions`;\n\n      renderReportTable(orders);\n      renderCharts(totalRev);\n    }\n\n    function renderReportTable(orders) {\n      const tbody = document.getElementById('reportTableBody');\n      tbody.innerHTML = '';\n\n      if (orders.length === 0) {\n        tbody.innerHTML = `\n          <tr>\n            <td colspan=\"6\" class=\"py-8 text-center text-slate-500 font-bold\">\n              အရောင်းမှတ်တမ်း မရှိသေးပါ\n            </td>\n          </tr>\n        `;\n        return;\n      }\n\n      orders.forEach(o => {\n        const tr = document.createElement('tr');\n        tr.className = \"hover:bg-white/[0.02] transition\";\n\n        const amountVal = o.approvedAmount ? Number(o.approvedAmount) : 0;\n\n        tr.innerHTML = `\n          <td class=\"py-3 px-3 font-mono font-bold text-slate-400\">#${o.orderId}</td>\n          <td class=\"py-3 px-3\">\n            <span class=\"font-bold text-white block\">${o.userName || 'Gamer'}</span>\n            <span class=\"text-[10px] text-slate-400 font-mono\">${o.userPhone || '-'}</span>\n          </td>\n          <td class=\"py-3 px-3\">\n            <span class=\"font-bold text-blue-400 block\">${o.gameTitle || 'Game Top-Up'}</span>\n            <span class=\"text-[10px] text-slate-400\">${o.packageName || '-'}</span>\n          </td>\n          <td class=\"py-3 px-3\">\n            <span class=\"px-2 py-0.5 rounded-lg bg-blue-500/10 text-blue-400 font-bold text-[10px]\">\n              ${o.paymentMethod || 'Wallet'}\n            </span>\n          </td>\n          <td class=\"py-3 px-3 text-slate-400 text-[11px] font-mono\">${o.dateText || '-'}</td>\n          <td class=\"py-3 px-3 font-mono font-black text-emerald-400 text-right text-xs\">\n            ${amountVal.toLocaleString()} MMK\n          </td>\n        `;\n        tbody.appendChild(tr);\n      });\n    }\n\n    function renderCharts(totalRev) {\n      // 1. Revenue Flow Trend Chart\n      const ctxFlow = document.getElementById('revenueFlowChart').getContext('2d');\n      if (revenueChartInstance) revenueChartInstance.destroy();\n\n      revenueChartInstance = new Chart(ctxFlow, {\n        type: 'line',\n        data: {\n          labels: ['Oct 15', 'Oct 16', 'Oct 17', 'Oct 18', 'Oct 19', 'Oct 20', 'Oct 21'],\n          datasets: [{\n            label: 'Daily Revenue (MMK)',\n            data: [42000, 68000, 95000, 140000, 110000, 185000, totalRev > 0 ? totalRev : 150000],\n            borderColor: '#38bdf8',\n            backgroundColor: 'rgba(56, 189, 248, 0.12)',\n            fill: true,\n            tension: 0.38,\n            pointBackgroundColor: '#38bdf8',\n            pointBorderColor: '#ffffff',\n            pointRadius: 4,\n            borderWidth: 2\n          }]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: { legend: { display: false } },\n          scales: {\n            x: {\n              grid: { display: false },\n              ticks: { color: '#64748b', font: { size: 10 } }\n            },\n            y: {\n              grid: { color: 'rgba(255, 255, 255, 0.05)' },\n              ticks: { color: '#64748b', font: { size: 10 } }\n            }\n          }\n        }\n      });\n\n      // 2. Game Share Doughnut Chart\n      const ctxShare = document.getElementById('gameCategoryShareChart').getContext('2d');\n      if (shareChartInstance) shareChartInstance.destroy();\n\n      shareChartInstance = new Chart(ctxShare, {\n        type: 'doughnut',\n        data: {\n          labels: ['MLBB', 'PUBG', 'Free Fire', 'Other'],\n          datasets: [{\n            data: [60, 22, 12, 6],\n            backgroundColor: ['#3b82f6', '#f59e0b', '#f43f5e', '#a855f7'],\n            borderWidth: 0,\n            hoverOffset: 4\n          }]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          cutout: '72%',\n          plugins: { legend: { display: false } }\n        }\n      });\n    }\n\n    function exportReportCSV() {\n      const orders = getAllCompletedOrders();\n      if (orders.length === 0) {\n        showToast('သတိပေးချက်', 'Export လုပ်ရန် အချက်အလက်မရှိပါ', 'warning');\n        return;\n      }\n\n      let csvContent = \"data:text/csv;charset=utf-8,\";\n      csvContent += \"Order ID,Customer Name,Phone,Game,Package,Payment Method,Amount,Date\\n\";\n\n      orders.forEach(o => {\n        csvContent += `\"${o.orderId}\",\"${o.userName || ''}\",\"${o.userPhone || ''}\",\"${o.gameTitle || ''}\",\"${o.packageName || ''}\",\"${o.paymentMethod || ''}\",\"${o.approvedAmount || 0}\",\"${o.dateText || ''}\"\\n`;\n      });\n\n      const encodedUri = encodeURI(csvContent);\n      const link = document.createElement(\"a\");\n      link.setAttribute(\"href\", encodedUri);\n      link.setAttribute(\"download\", `sales_report_${new Date().toISOString().slice(0, 10)}.csv`);\n      document.body.appendChild(link);\n      link.click();\n      document.body.removeChild(link);\n\n      showToast('အောင်မြင်ပါသည်', 'အရောင်းအစီရင်ခံစာ CSV ဖိုင် ထုတ်ယူပြီးပါပြီ', 'success');\n    }\n\n    function showToast(title, msg, type = 'success') {\n      const toast = document.getElementById('toastAlert');\n      const iconBox = document.getElementById('toastIconBox');\n      const icon = document.getElementById('toastIcon');\n\n      document.getElementById('toastTitle').innerText = title;\n      document.getElementById('toastMessage').innerText = msg;\n\n      if (type === 'error') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-xmark';\n      } else if (type === 'warning') {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-triangle-exclamation';\n      } else {\n        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';\n        icon.className = 'fa-solid fa-circle-check';\n      }\n\n      toast.classList.remove('translate-x-full');\n      clearTimeout(toastTimeout);\n      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3500);\n    }\n\n    // Initialize\n    refreshReports();\n  <\/script>\n</body>\n</html>", "Asetting.html": "<!DOCTYPE html>\n<html lang=\"my\" class=\"dark\">\n<head><script>\n(function(){\n const db='https://kavxygameshop-default-rtdb.asia-southeast1.firebasedatabase.app/';\n const originalFetch=window.fetch.bind(window);\n window.fetch=async function(input,init){\n   const url=typeof input==='string'?input:(input instanceof Request?input.url:String(input));\n   if(url.startsWith(db)){\n     const token=await parent.KAVXY_ADMIN_TOKEN();\n     if(!token) throw new Error('Admin login required');\n     const u=new URL(url);u.searchParams.set('auth',token);\n     if(input instanceof Request) input=new Request(u.toString(),input);\n     else input=u.toString();\n   }\n   return originalFetch(input,init);\n };\n document.addEventListener('click',function(ev){\n   const a=ev.target.closest('a[href]'); if(!a)return;\n   const path=a.getAttribute('href').split(/[?#]/)[0].split('/').pop();\n   if(parent.KAVXY_ADMIN_PAGES.includes(path)){ev.preventDefault();parent.KAVXY_ADMIN_OPEN(path);}\n },true);\n})();\n<\/script>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" id=\"viewportMeta\" />\n  <title>GameAdmin - System Settings (Asetting)</title>\n\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script>\n    tailwind.config = {\n      darkMode: 'class',\n      theme: {\n        extend: {\n          colors: {\n            dashboard: {\n              bg: '#0a0f1d',\n              card: '#0e1629',\n              sidebar: '#080d19',\n              border: 'rgba(255, 255, 255, 0.07)',\n              accent: '#3b82f6'\n            }\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <!-- Font Awesome Icons & Google Fonts -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\" />\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n  <style>\n    body {\n      font-family: 'Outfit', 'Padauk', sans-serif;\n      -webkit-tap-highlight-color: transparent;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n    .custom-scroll::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    .custom-scroll::-webkit-scrollbar-thumb {\n      background: rgba(255, 255, 255, 0.15);\n      border-radius: 9999px;\n    }\n    /* Forced Desktop View Styles */\n    body.forced-desktop {\n      min-width: 1200px !important;\n      overflow-x: auto !important;\n    }\n    body.forced-desktop #desktopSidebar {\n      display: flex !important;\n    }\n    body.forced-desktop #mobileBottomBar {\n      display: none !important;\n    }\n  </style>\n</head>\n\n<body class=\"bg-[#f4f6fa] dark:bg-[#0a0f1d] text-slate-800 dark:text-gray-100 min-h-screen flex overflow-x-hidden\">\n\n  <!-- ==================== TOAST ALERT ==================== -->\n  <div id=\"toastAlert\" class=\"fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none\">\n    <div class=\"flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#0e1629] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto\">\n      <div id=\"toastIconBox\" class=\"w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0\">\n        <i id=\"toastIcon\" class=\"fa-solid fa-gear\"></i>\n      </div>\n      <div class=\"flex-1\">\n        <h4 id=\"toastTitle\" class=\"text-xs font-bold text-slate-900 dark:text-white\">အသိပေးချက်</h4>\n        <p id=\"toastMessage\" class=\"text-[11px] text-slate-500 dark:text-slate-400 mt-0.5\">အောင်မြင်ပါသည်</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- ==================== SIDEBAR NAVIGATION (DESKTOP MODE) ==================== -->\n  <aside id=\"desktopSidebar\" class=\"w-64 bg-white dark:bg-[#080d19] border-r border-slate-200 dark:border-white/5 flex-col justify-between shrink-0 hidden lg:flex\">\n    < ext-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-credit-card text-sm w-4 text-center\"></i>\n          <span>Payments & Slips</span>\n        </a>\n        <a href=\"AEvent.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-wand-magic-sparkles text-sm w-4 text-center text-amber-400\"></i>\n          <span>Events & Seasons</span>\n        </a>\n        <a href=\"AOrder.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.03] transition\">\n          <i class=\"fa-solid fa-file-lines text-sm w-4 text-center\"></i>\n          <span>Orders Management</span>\n        </a>\n        <a href=\"Asetting.html\" class=\"flex items-center gap-3 px-3.5 py-3 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition\">\n          <i class=\"fa-solid fa-gear text-sm w-4 text-center\"></i>\n          <span>Settings (Asetting)</span>\n        </a>\n      </nav>\n    </div>\n\n    <div class=\"p-4\">\n      <a href=\"index.html\" target=\"_blank\" class=\"w-full py-2.5 rounded-xl bg-slate-100 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-700 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-2 border border-slate-200 dark:border-white/5 transition\">\n        <i class=\"fa-solid fa-arrow-up-right-from-square text-xs text-blue-500\"></i>\n        <span>Live Index ကြည့်မည်</span>\n      </a>\n    </div>\n  </aside>\n\n  <!-- ==================== MAIN WORKSPACE ==================== -->\n  <div class=\"flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll pb-20 lg:pb-6\">\n    \n    <!-- Top Header -->\n    <header class=\"h-16
