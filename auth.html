<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="pageTitle">KAVXY - Login & Register</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            },
            accent: {
              400: '#f59e0b',
              500: '#d97706',
            },
            reseller: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', 'Padauk', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Seasonal Particle Canvas */
    #seasonalCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 25;
    }

    /* AEvent Themes */
    body.theme-general { background: radial-gradient(circle at 50% 0%, #13213a 0%, #090d16 65%, #060910 100%) !important; }
    body.theme-summer {
      background: radial-gradient(circle at 50% 10%, #3d2003 0%, #170d03 55%, #090602 100%) !important;
    }
    body.theme-rainy {
      background: radial-gradient(circle at 50% 10%, #0f2b38 0%, #071922 60%, #030d12 100%) !important;
    }
    body.theme-winter {
      background: radial-gradient(circle at 50% 10%, #0c2744 0%, #061526 55%, #020912 100%) !important;
    }
    body.theme-thingyan {
      background: radial-gradient(circle at 50% 12%, #382405 0%, #0d2d3e 50%, #04141c 100%) !important;
    }
    body.theme-thadingyut {
      background: radial-gradient(circle at 50% 10%, #341a06 0%, #150901 60%, #080300 100%) !important;
    }
  </style>
</head>

<body class="bg-[#f4f6fa] dark:bg-[#090d16] text-slate-800 dark:text-gray-100 min-h-screen transition-colors duration-300 pb-12 flex flex-col justify-between overflow-x-hidden select-none">

  <!-- Seasonal Particle Canvas -->
  <canvas id="seasonalCanvas"></canvas>

  <!-- ==================== TOAST ALERT ==================== -->
  <div id="toastAlert" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 max-w-sm w-full px-4 pointer-events-none">
    <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-white dark:bg-[#131b2e] border border-slate-200 dark:border-white/10 shadow-2xl pointer-events-auto">
      <div id="toastIconBox" class="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0">
        <i id="toastIcon" class="fa-solid fa-circle-check"></i>
      </div>
      <div class="flex-1">
        <h4 id="toastTitle" class="text-xs font-bold text-slate-900 dark:text-white">အသိပေးချက်</h4>
        <p id="toastMessage" class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">အောင်မြင်ပါသည်</p>
      </div>
    </div>
  </div>

  <!-- ==================== HEADER ==================== -->
  <header class="p-4 flex items-center justify-between max-w-md mx-auto w-full relative z-30">
    <a href="index.html" class="w-9 h-9 rounded-xl bg-white/80 dark:bg-white/5 border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-700 dark:text-gray-200 active:scale-95 transition backdrop-blur-md">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </a>
    <span class="text-[10px] text-slate-400 font-mono" id="headerSeasonTag">AUTHENTICATION</span>
    <button onclick="toggleThemeManual()" aria-label="Toggle Theme" class="w-9 h-9 rounded-xl bg-white/80 dark:bg-white/5 border border-slate-200 dark:border-white/10 flex items-center justify-center text-slate-700 dark:text-gray-200 active:scale-95 transition backdrop-blur-md">
      <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
    </button>
  </header>

  <!-- ==================== MAIN AUTH CARD ==================== -->
  <main class="max-w-md mx-auto px-4 w-full relative z-20 my-auto">
    <div class="p-6 rounded-[32px] bg-white/80 dark:bg-[#111827]/80 backdrop-blur-md border border-slate-200/80 dark:border-white/10 shadow-2xl space-y-5">
      
      <!-- Brand Logo & Title (Asetting Synced) -->
      <div class="text-center space-y-2">
        <div class="w-14 h-14 mx-auto rounded-2xl overflow-hidden border border-brand-500/30 bg-slate-800 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <img id="authBrandLogo" src="" class="w-full h-full object-cover hidden" alt="Brand Logo">
          <div id="authDefaultLogoIcon" class="w-full h-full bg-gradient-to-tr from-brand-600 via-sky-500 to-indigo-600 text-white flex items-center justify-center text-2xl">
            <i class="fa-solid fa-gamepad animate-pulse"></i>
          </div>
        </div>
        <div>
          <h2 class="text-base font-black text-slate-900 dark:text-white tracking-wide" id="authBrandName">KAVXY Game Hub</h2>
          <p class="text-[11px] text-slate-400" id="authSubTitle">ဂိမ်းဒိုင်းမွန်းများ ဖြည့်သွင်းရန် အကောင့်ဝင်ပါ</p>
        </div>
      </div>

      <!-- Auth Tabs (Login / Register) -->
      <div class="flex items-center gap-1.5 p-1 bg-slate-100 dark:bg-white/5 rounded-2xl border border-slate-200 dark:border-white/5 text-xs font-bold">
        <button onclick="switchAuthTab('login')" id="tabLogin" class="flex-1 py-2 rounded-xl bg-brand-500 text-white shadow-sm transition">
          အကောင့်ဝင်ရန် (Login)
        </button>
        <button onclick="switchAuthTab('register')" id="tabRegister" class="flex-1 py-2 rounded-xl text-slate-400 hover:text-white transition">
          အကောင့်သစ်ဖွင့် (Register)
        </button>
      </div>

      <!-- ==================== 1. LOGIN FORM ==================== -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1 font-semibold">Email (Gmail သို့မဟုတ် အခြား Email)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-user text-xs"></i>
            </span>
            <input type="email" id="loginIdentifier" required placeholder="example@gmail.com" class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1 font-semibold">စကားဝှက် (Password)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-9 pr-9 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-brand-500">
            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white">
              <i class="fa-solid fa-eye-slash text-xs"></i>
            </button>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-black text-xs shadow-lg shadow-brand-500/25 active:scale-95 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>အကောင့်ဝင်မည်</span>
          </button>
        </div>
      </form>

      <!-- ==================== 2. REGISTER FORM ==================== -->
      <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-3 text-xs hidden">
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1 font-semibold">အမည် (Gamer Name)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-id-badge text-xs"></i>
            </span>
            <input type="text" id="regUsername" required placeholder="ဥပမာ: ShadowGamer" class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1 font-semibold">Email (Gmail သို့မဟုတ် အခြား Email)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-phone text-xs"></i>
            </span>
            <input type="email" id="regIdentifier" required placeholder="example@gmail.com" class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1 font-semibold">စကားဝှက် အသစ် (Password)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input type="password" id="regPassword" required placeholder="အနည်းဆုံး ၆ လုံး" minlength="6" class="w-full pl-9 pr-9 py-2.5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03] text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-brand-500">
            <button type="button" onclick="togglePasswordVisibility('regPassword', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white">
              <i class="fa-solid fa-eye-slash text-xs"></i>
            </button>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-black text-xs shadow-lg shadow-brand-500/25 active:scale-95 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus"></i>
            <span>အကောင့်သစ် စတင်ဖွင့်မည်</span>
          </button>
        </div>
      </form>

    </div>
  </main>

  <footer class="text-center text-[10px] text-slate-400 py-3 relative z-20">
    &copy; KAVXY Mobile Game Hub. All Rights Reserved.
  </footer>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    const FIREBASE_API_KEY = 'PASTE_FIREBASE_WEB_API_KEY_HERE';
    const FIREBASE_DB_URL = 'https://kavxy-5d60f-default-rtdb.firebaseio.com/';
    let toastTimeout = null;

    // ============================================================
    // 1. BRAND & ASETTING SYNC
    // ============================================================
    function syncBrandFromAdmin() {
      let siteName = 'KAVXY';
      let siteLogoUrl = null;

      try {
        const rawPlatform = localStorage.getItem('site_platform_config');
        if (rawPlatform) {
          const cfg = JSON.parse(rawPlatform);
          if (cfg.name && cfg.name.trim() !== '') siteName = cfg.name.trim();
          if (cfg.logo && cfg.logo.trim() !== '') siteLogoUrl = cfg.logo.trim();
        }
      } catch (e) {}

      const separateLogo = localStorage.getItem('index_site_logo') || localStorage.getItem('admin_site_logo');
      if (separateLogo && separateLogo.trim() !== '') siteLogoUrl = separateLogo.trim();

      const separateName = localStorage.getItem('platform_site_name');
      if (separateName && separateName.trim() !== '') siteName = separateName.trim();

      document.getElementById('pageTitle').innerText = `${siteName} - Login & Register`;
      document.getElementById('authBrandName').innerText = `${siteName} Game Hub`;

      const logoImg = document.getElementById('authBrandLogo');
      const defaultIcon = document.getElementById('authDefaultLogoIcon');
      if (siteLogoUrl) {
        logoImg.src = siteLogoUrl;
        logoImg.classList.remove('hidden');
        defaultIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        defaultIcon.classList.remove('hidden');
      }
    }

    // ============================================================
    // 2. AEVENT SEASONS THEME SYNC
    // ============================================================
    const SEASONS_DATA = {
      general: { themeClass: 'theme-general', tag: 'GENERAL EDITION' },
      summer: { themeClass: 'theme-summer', tag: 'SUMMER EDITION' },
      rainy: { themeClass: 'theme-rainy', tag: 'MONSOON EDITION' },
      winter: { themeClass: 'theme-winter', tag: 'WINTER EDITION' },
      thingyan: { themeClass: 'theme-thingyan', tag: 'THINGYAN FESTIVAL' },
      thadingyut: { themeClass: 'theme-thadingyut', tag: 'THADINGYUT FESTIVAL' }
    };

    function loadActiveSeasonFromAdmin() {
      let activeSeasonKey = 'general';
      try {
        const raw = localStorage.getItem('site_event_theme_config');
        if (raw) {
          const cfg = JSON.parse(raw);
          if (cfg && cfg.activeMode && SEASONS_DATA[cfg.activeMode]) {
            activeSeasonKey = cfg.activeMode;
          }
        } else {
          activeSeasonKey = localStorage.getItem('home_saved_season') || 'general';
        }
      } catch(e) {
        activeSeasonKey = 'general';
      }

      const data = SEASONS_DATA[activeSeasonKey] || SEASONS_DATA.general;
      document.body.className = `${data.themeClass} text-slate-800 dark:text-gray-100 min-h-screen transition-colors duration-300 pb-12 flex flex-col justify-between overflow-x-hidden select-none`;
      
      const tagElem = document.getElementById('headerSeasonTag');
      if (tagElem) tagElem.innerText = data.tag;

      initSeasonalCanvas(activeSeasonKey);
    }

    async function syncEventFromCloud() {
      try {
        const res = await fetch(`${FIREBASE_DB_URL}active_season.json`, {cache: 'no-store'});
        if (!res.ok) return;
        const key = await res.json();
        if (typeof key === 'string' && SEASONS_DATA[key]) {
          localStorage.setItem('site_event_theme_config', JSON.stringify({activeMode:key}));
          loadActiveSeasonFromAdmin();
        }
      } catch(e) { /* use saved event when offline */ }
    }

    // ============================================================
    // 3. CANVAS PARTICLES
    // ============================================================
    const canvas = document.getElementById('seasonalCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function initSeasonalCanvas(type) {
      resizeCanvas();
      particles = [];
      const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : (type === 'general' ? 10 : (type === 'rainy' ? 40 : (type === 'winter' ? 35 : 20)));

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 4 + 2,
          speedY: type === 'rainy' ? (Math.random() * 6 + 10) : (type === 'thadingyut' ? -(Math.random() * 0.7 + 0.3) : (Math.random() * 1.3 + 0.6)),
          speedX: type === 'rainy' ? -1.2 : (Math.sin(Math.random() * Math.PI * 2) * 0.5),
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.04,
          opacity: Math.random() * 0.7 + 0.3,
          length: Math.random() * 14 + 8,
          type: type
        });
      }

      if (animId) cancelAnimationFrame(animId);
      renderParticles();
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        ctx.save();
        if (p.type === 'rainy') {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.globalAlpha = p.opacity;
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 2, p.y + p.length);
          ctx.stroke();
        } else {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.beginPath();
          if (p.type === 'thingyan') {
            ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.9, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 204, 21, ${p.opacity})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "#eab308";
            ctx.fill();
          } else if (p.type === 'winter') {
            ctx.arc(0, 0, p.size * 0.8, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(224, 242, 254, ${p.opacity})`;
            ctx.shadowBlur = 5;
            ctx.shadowColor = "#bae6fd";
            ctx.fill();
          } else if (p.type === 'thadingyut') {
            ctx.rect(-p.size, -p.size * 1.3, p.size * 2, p.size * 2.6);
            ctx.fillStyle = `rgba(251, 191, 36, ${p.opacity})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#f59e0b";
            ctx.fill();
          } else if (p.type === 'summer' || p.type === 'general') {
            ctx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(245, 158, 11, ${p.opacity})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "#f59e0b";
            ctx.fill();
          }
        }
        ctx.restore();

        p.y += p.speedY;
        p.x += p.speedX;
        p.rotation += p.rotationSpeed;

        if (p.type === 'thadingyut' && p.y < -20) p.y = canvas.height + 20;
        if (p.type !== 'thadingyut' && p.y > canvas.height + 20) p.y = -20;
        if (p.x > canvas.width) p.x = 0;
        if (p.x < 0) p.x = canvas.width;
      });

      animId = requestAnimationFrame(renderParticles);
    }

    // ============================================================
    // 4. THEME CONTROLLER
    // ============================================================
    function applyTheme(isDark) {
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      if (isDark) {
        html.classList.add('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-sm';
      } else {
        html.classList.remove('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-sm';
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('user_theme_preference') || 'dark';
      applyTheme(savedTheme === 'dark');
    }

    function toggleThemeManual() {
      const isCurrentlyDark = document.documentElement.classList.contains('dark');
      const targetDark = !isCurrentlyDark;
      applyTheme(targetDark);
      localStorage.setItem('user_theme_preference', targetDark ? 'dark' : 'light');
    }

    // ============================================================
    // 5. AUTH TABS & PASSWORD TOGGLE
    // ============================================================
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabReg = document.getElementById('tabRegister');
      const subTitle = document.getElementById('authSubTitle');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = "flex-1 py-2 rounded-xl bg-brand-500 text-white shadow-sm transition";
        tabReg.className = "flex-1 py-2 rounded-xl text-slate-400 hover:text-white transition";
        subTitle.innerText = "ဂိမ်းဒိုင်းမွန်းများ ဖြည့်သွင်းရန် အကောင့်ဝင်ပါ";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = "flex-1 py-2 rounded-xl bg-brand-500 text-white shadow-sm transition";
        tabLogin.className = "flex-1 py-2 rounded-xl text-slate-400 hover:text-white transition";
        subTitle.innerText = "အကောင့်သစ်ဖွင့်လှစ်ပြီး ချက်ချင်းစတင်လိုက်ပါ";
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye text-xs text-brand-400';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye-slash text-xs text-slate-400';
      }
    }

    // ============================================================
    // 6. LOGIN & REGISTER HANDLERS
    // ============================================================
    function firebaseReady() {
      if (FIREBASE_API_KEY.includes('PASTE_FIREBASE')) {
        showToast('Setup လိုအပ်သည်', 'Firebase Web API Key ကို auth.html တွင် ထည့်ပေးပါ', 'error');
        return false;
      }
      return true;
    }

    async function authRequest(endpoint, payload) {
      const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${endpoint}?key=${encodeURIComponent(FIREBASE_API_KEY)}`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || 'NETWORK_ERROR');
      return data;
    }

    function authErrorMessage(error) {
      const code = String(error.message || error).split(' : ')[0];
      const messages = {
        EMAIL_EXISTS: 'ဒီ Email နဲ့ Account ရှိပြီးသားပါ',
        INVALID_LOGIN_CREDENTIALS: 'Email သို့မဟုတ် Password မှားနေပါတယ်',
        EMAIL_NOT_FOUND: 'ဒီ Email နဲ့ Account မရှိသေးပါ',
        INVALID_PASSWORD: 'Password မှားနေပါတယ်',
        WEAK_PASSWORD: 'Password အနည်းဆုံး ၆ လုံး ထည့်ပါ',
        OPERATION_NOT_ALLOWED: 'Firebase Console မှာ Email/Password Login ဖွင့်ပေးပါ',
        TOO_MANY_ATTEMPTS_TRY_LATER: 'ခဏစောင့်ပြီး ထပ်ကြိုးစားပါ',
        NETWORK_ERROR: 'Internet ချိတ်ဆက်မှု စစ်ဆေးပါ'
      };
      return messages[code] || 'မအောင်မြင်ပါ။ Firebase Settings နဲ့ Internet ကို စစ်ဆေးပါ';
    }

    function saveFirebaseSession(result, username) {
      const session = {
        loggedIn: true, uid: result.localId, username: username || result.displayName || result.email.split('@')[0],
        email: result.email, phone: '', balance: 0, spent: 0, role: 'user',
        authProvider: 'firebase'
      };
      // Legacy pages use user_session for display only; never trust it for authorization or balances.
      localStorage.setItem('user_session', JSON.stringify(session));
      sessionStorage.setItem('firebase_id_token', result.idToken);
      sessionStorage.setItem('firebase_refresh_token', result.refreshToken);
    }

    function setFormBusy(formId, busy) {
      const button = document.querySelector(`#${formId} button[type="submit"]`);
      if (button) button.disabled = busy;
      if (button) button.style.opacity = busy ? '.6' : '1';
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      if (!firebaseReady()) return;
      const email = document.getElementById('loginIdentifier').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      setFormBusy('loginForm', true);
      try {
        const result = await authRequest('signInWithPassword', {email, password, returnSecureToken:true});
        saveFirebaseSession(result, result.displayName);
        showToast('အောင်မြင်ပါသည်', 'အကောင့်ဝင်ရောက်မှု အောင်မြင်ပါသည်', 'success');
        setTimeout(() => location.href = 'index.html', 850);
      } catch(e) { showToast('Login မအောင်မြင်ပါ', authErrorMessage(e), 'error'); }
      finally { setFormBusy('loginForm', false); }
    }

    async function handleRegisterSubmit(event) {
      event.preventDefault();
      if (!firebaseReady()) return;
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regIdentifier').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;
      if (username.length < 2 || username.length > 40 || password.length < 6) {
        showToast('မှားယွင်းမှု', 'အမည် ၂-၄၀ လုံး၊ Password အနည်းဆုံး ၆ လုံး လိုအပ်ပါတယ်', 'error'); return;
      }
      setFormBusy('registerForm', true);
      try {
        const created = await authRequest('signUp', {email, password, returnSecureToken:true});
        let result = created;
        try {
          const updated = await authRequest('update', {idToken:created.idToken, displayName:username, returnSecureToken:true});
          result = {...created, ...updated, localId:created.localId, email:created.email};
        } catch(e) { /* Account exists even if display name update fails */ }
        saveFirebaseSession(result, username);
        showToast('အောင်မြင်ပါသည်', 'အကောင့်သစ် ဖွင့်လှစ်ပြီးပါပြီ', 'success');
        setTimeout(() => location.href = 'index.html', 850);
      } catch(e) { showToast('Register မအောင်မြင်ပါ', authErrorMessage(e), 'error'); }
      finally { setFormBusy('registerForm', false); }
    }

    // ============================================================
    // 7. TOAST NOTIFICATION
    // ============================================================
    function showToast(title, msg, type = 'success') {
      const toast = document.getElementById('toastAlert');
      const iconBox = document.getElementById('toastIconBox');
      const icon = document.getElementById('toastIcon');

      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastMessage').innerText = msg;

      if (type === 'error') {
        iconBox.className = 'w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-lg shrink-0';
        icon.className = 'fa-solid fa-circle-xmark';
      } else if (type === 'info') {
        iconBox.className = 'w-10 h-10 rounded-xl bg-blue-500/15 text-blue-500 flex items-center justify-center text-lg shrink-0';
        icon.className = 'fa-solid fa-circle-info';
      } else {
        iconBox.className = 'w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center text-lg shrink-0';
        icon.className = 'fa-solid fa-circle-check';
      }

      toast.classList.remove('translate-x-full');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.add('translate-x-full'), 3200);
    }

    // Init Page
    initTheme();
    syncBrandFromAdmin();
    loadActiveSeasonFromAdmin();
    syncEventFromCloud();
    setInterval(syncEventFromCloud, 15000);
    window.addEventListener('storage', e => {if (e.key === 'site_event_theme_config') loadActiveSeasonFromAdmin();});
  </script>
</body>
</html>
